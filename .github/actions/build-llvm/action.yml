name: build-llvm

inputs:
  token:
    required: true
    type: string

outputs:
  cache_key:
    description: 'The commit hash of the llvm repo'
    value: llvm-install-${{ steps.llvm-commit.outputs.llvm_commit_hash }}-temp

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Get llvm-project repo URL and SHA1
      id: llvm-commit
      run: |
        # Read the deps.txt file and extract the llvm URL and commit hash
        $depsFile = "${{ github.workspace}}/cmake/deps.txt"
        $llvmLine = Select-String '^llvm;' $depsFile | ForEach-Object { $_.Line -split ';' }
        if ($llvmLine.Count -ge 3) {
          # Extract from the line format: llvm;https://github.com/llvm/llvm-project.git;commit_hash
          $url, $hash = $llvmLine[1], $llvmLine[2]
          echo "llvm_repo_url=$url" >> $env:GITHUB_OUTPUT
          echo "llvm_commit_hash=$hash" >> $env:GITHUB_OUTPUT
          echo "Found LLVM repo URL: $url"
          echo "Found LLVM commit hash: $hash"
        } else {
          echo "Error: Could not find LLVM entry in deps.txt"
          exit 1
        }
      shell: powershell

    - name: Cache installed LLVM
      id: cache-llvm
      uses: actions/cache@v3
      env:
        NODE_TLS_REJECT_UNAUTHORIZED: 0
      with:
        path: ${{ env.VAI_RT_PREFIX }}
        key: llvm-install-${{ steps.llvm-commit.outputs.llvm_commit_hash }}-temp

    - name: Checkout llvm-project
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        git clone ${{ steps.llvm-commit.outputs.llvm_repo_url }} llvm
        git -C llvm checkout ${{ steps.llvm-commit.outputs.llvm_commit_hash }}
      shell: powershell

    - name: Checkout onnx-mlir
      run: |
        # Get onnx-mlir repo URL and SHA1
        $depsFile = "${{ github.workspace}}/cmake/deps.txt"
        $onnxMlir = Select-String '^onnx-mlir;' $depsFile | ForEach-Object { $_.Line -split ';' }
        if ($onnxMlir.Count -ge 3) {
          $url, $hash = $onnxMlir[1], $onnxMlir[2]
          echo "Checkout ONNX-MLIR $url at $hash"
          git clone $url onnx-mlir
          git -C onnx-mlir checkout $hash
        } else {
          echo "Error: Could not find ONNX-MLIR entry in deps.txt"
          exit 1
        }
      shell: powershell

    - name: build and install llvm
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      shell: powershell
      run: |
          echo "build and install llvm.."
          . ${{ github.workspace}}/tools/build_llvm.ps1
