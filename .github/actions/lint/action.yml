name: Lint

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install lintrunner
      run: |
        python -m pip install lintrunner lintrunner-adapters>=0.8.0 --force-reinstall
        python -m pip install -r requirements-lintrunner.txt --force-reinstall
      shell: powershell

    - name: Add user Scripts folder to PATH
      run: |
        $userBase = python -m site --user-base
        $scriptsPath = "$userBase\Scripts"
        "Adding $scriptsPath to PATH"
        "$scriptsPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Run lintrunner
      run: |
        set -e
        set -o pipefail
        lintrunner init
        lintrunner -v --force-color --all-files
        pre-commit run --all-files
        echo "Checking for license headers..."
        python -m licenseheaders -t ./LICENSES/license.txt -x '3rd-party/*'  -s ./LICENSES/settings.json -d .
        if $(git status --porcelain | grep -q '^[AM]'); then
          echo "License header check failed. Please run the license header check locally and fix the issues."
          exit 1
        else
          echo "License header check passed."
        fi
      shell: bash
