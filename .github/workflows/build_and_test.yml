name: build-and-test

on:
  workflow_call:
    inputs:
      ort_hash_id:
        description: 'The hash id of the ort repo'
        required: true
        type: string
    secrets:
      Z1AIEBUILD_GHE_PAT:
        required: true
        description: 'GitHub Personal Access Token for VitisAI/morphizen-demo'
env:
    VAI_RT_PREFIX: ${{ github.workspace }}/gi
    VAI_RT_WORKSPACE: ${{ github.workspace }}
    VAI_RT_BUILD_DIR: ${{ github.workspace }}/gb
    MY_GITHUB_TOKEN : ${{ secrets.MY_GITHUB_TOKEN }}
    API_URL: "https://gitenterprise.xilinx.com/api/v3"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows_vitisai ]

    steps:
         # pitfall: we must update the source code to the latest commit with actions/checkout@v4
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            submodules: true
            fetch-depth: 0  # Fetch all history for all branches and tags

        - name: Cache installed ONNXRuntime and deps
          id: cache-onnxruntime-and-deps
          env:
            NODE_TLS_REJECT_UNAUTHORIZED: 0
          uses: actions/cache@v3
          with:
                path: ${{ env.VAI_RT_PREFIX }}
                key: ${{ inputs.ort_hash_id }}
                fail-on-cache-miss: true

        - name: check environment
          run: |
            echo "VAI_RT_PREFIX: ${{ env.VAI_RT_PREFIX }}"
            echo "VAI_RT_WORKSPACE: ${{ env.VAI_RT_WORKSPACE }}"
            echo "VAI_RT_BUILD_DIR: ${{ env.VAI_RT_BUILD_DIR }}"
            echo "MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}"
            echo "ORT_HASH_ID: ${{ inputs.ort_hash_id }}"
            Get-ChildItem -Path ${{ env.VAI_RT_PREFIX }} -Recurse | Select-Object FullName, Length, LastWriteTime

        - name: set credential
          uses: ./.github/actions/set-env
          
        - name: Checkout VitisAI/morphizen-demo
          uses: actions/checkout@v4
          with:
            repository: VitisAI/morphizen-demo
            path: morphizen-demo
            ref: dev
            token: ${{ env.Z1AIEBUILD_GHE_PAT }}

        - name: build and install onnxrutime and deps
          run: |
            echo "build and test morphizen-demo.."
            . ${{ github.workspace }}/tools/build_and_test.ps1
