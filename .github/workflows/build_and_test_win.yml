name: build-and-test-win

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VAI_RT_PREFIX: ${{ github.workspace }}/install
  VAI_RT_BUILD_DIR: ${{ github.workspace }}/cmake-build
  VAI_RT_WORKSPACE: ${{ github.workspace }}
  ONNXRUNTIME_VERSION: "1.23.2"

jobs:
  build-and-test:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - name: Checkout MorphiZen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0
          lfs: true
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      # Cache ONNXRuntime to avoid downloading on every build
      - name: Cache ONNXRuntime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ${{ env.VAI_RT_PREFIX }}
          key: onnxruntime-win-x64-${{ env.ONNXRUNTIME_VERSION }}

      # Download pre-built ONNXRuntime if cache miss
      - name: Download pre-built ONNXRuntime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ortVersion = "${{ env.ONNXRUNTIME_VERSION }}"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          $zipFile = "${{ github.workspace }}/onnxruntime-win-x64-$ortVersion.zip"
          echo "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipFile

          # Extract to install directory
          New-Item -ItemType Directory -Force -Path "${{ env.VAI_RT_PREFIX }}"
          Expand-Archive -Path $zipFile -DestinationPath "${{ env.VAI_RT_PREFIX }}" -Force

          # Move files from nested directory to install root
          $extractedDir = "${{ env.VAI_RT_PREFIX }}/onnxruntime-win-x64-$ortVersion"
          if (Test-Path $extractedDir) {
            Move-Item -Path "$extractedDir/*" -Destination "${{ env.VAI_RT_PREFIX }}/" -Force
            Remove-Item -Path $extractedDir -Force -Recurse
          }

          # Create CMake config file for find_package(onnxruntime)
          $cmakeDir = "${{ env.VAI_RT_PREFIX }}/lib/cmake/onnxruntime"
          New-Item -ItemType Directory -Force -Path $cmakeDir

          $configContent = @"
          # onnxruntimeConfig.cmake - CMake configuration file for ONNXRuntime
          # Auto-generated for pre-built package

          if(NOT TARGET onnxruntime::onnxruntime)
            add_library(onnxruntime::onnxruntime SHARED IMPORTED)
            set_target_properties(onnxruntime::onnxruntime PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "`${CMAKE_CURRENT_LIST_DIR}/../../../include"
              IMPORTED_LOCATION "`${CMAKE_CURRENT_LIST_DIR}/../../../lib/onnxruntime.dll"
              IMPORTED_IMPLIB "`${CMAKE_CURRENT_LIST_DIR}/../../../lib/onnxruntime.lib"
            )
          endif()

          set(onnxruntime_FOUND TRUE)
          set(onnxruntime_VERSION "$ortVersion")
          "@

          $configContent | Out-File -FilePath "$cmakeDir/onnxruntimeConfig.cmake" -Encoding UTF8

          # List installed files
          Get-ChildItem -Recurse "${{ env.VAI_RT_PREFIX }}"

      # Build MorphiZen
      - name: CMake Configure
        shell: powershell
        run: |
          cmake -B ${{ env.VAI_RT_BUILD_DIR }} -S . `
            -Dmorphizen_ENABLE_ORT_BRIDGE=ON `
            -Dmorphizen_ENABLE_ONNX_BACKEND=ON `
            -Dmorphizen_ENABLE_MLIR_BACKEND=OFF `
            -Dmorphizen_ENABLE_UNIT_TEST=ON `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DCMAKE_PREFIX_PATH=${{ env.VAI_RT_PREFIX }}"

      - name: CMake Build
        run: |
          cmake --build ${{ env.VAI_RT_BUILD_DIR }} --config Release --parallel

      # TODO: Enable tests once runtime dependencies are properly configured
      # - name: Run Tests
      #   run: |
      #     ctest --test-dir ${{ env.VAI_RT_BUILD_DIR }} -C Release --output-on-failure --timeout 600
