name: build-and-test-win-msbuild

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MORPHIZEN_PREFIX: ${{ github.workspace }}/install
  MORPHIZEN_BUILD_DIR: ${{ github.workspace }}/cmake-build
  MORPHIZEN_WORKSPACE: ${{ github.workspace }}
  ONNXRUNTIME_VERSION: "1.24.1"
  LLVM_COMMIT: "f8cb7987c64dcffb72414a40560055cb717dbf74"
  PROTOBUF_VERSION: "v21.12"
  GTEST_VERSION: "v1.15.0"
  GLOG_VERSION: "v0.7.1"
  GSL_VERSION: "v4.0.0"
  THEROCK_VERSION: therock-dist-windows-gfx1151-7.11.0

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - name: Checkout MorphiZen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0
          lfs: true
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Restore dependencies from cache (built by Ninja workflow)
      # Fails if cache not found - this workflow only tests MSBuild generator compatibility
      - name: Restore Dependencies Cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MORPHIZEN_PREFIX }}
          key: deps-win-x64-release-mt-ort-${{ env.ONNXRUNTIME_VERSION }}-llvm-${{ env.LLVM_COMMIT }}-proto-${{ env.PROTOBUF_VERSION }}-gtest-${{ env.GTEST_VERSION }}-glog-${{ env.GLOG_VERSION }}-gsl-${{ env.GSL_VERSION }}
          fail-on-cache-miss: true

      # Restore TheRock from the cache populated by the ninja workflow. Falls
      # through to download/extract on cache miss (e.g. first time the key
      # exists for this branch / cache eviction); ninja workflow's cache@save
      # is what populates the key on the happy path.
      - name: Restore TheRock cache
        id: cache-therock
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/therock-dist
          key: ${{ env.THEROCK_VERSION }}

      - name: Download & extract TheRock
        if: steps.cache-therock.outputs.cache-hit != 'true'
        shell: bash
        run: |
          THEROCK_DIST="$(cygpath -u '${{ runner.workspace }}/therock-dist')"
          mkdir -p "$THEROCK_DIST"
          curl -fsSL \
            "https://repo.amd.com/rocm/tarball/${{ env.THEROCK_VERSION }}.tar.gz" \
            -o therock.tar.gz
          tar -xzf therock.tar.gz -C "$THEROCK_DIST" --strip-components=1
          rm therock.tar.gz

      # Build MorphiZen with auto-detected generator (Visual Studio/MSBuild)
      # Tests default Windows CMake experience (no -G flag, multi-config generator)
      #
      # CMAKE_PREFIX_PATH includes both our prebuilt deps install tree and the
      # TheRock dist so find_package(hip) inside ort-bridge resolves.
      # HIP_PLATFORM=amd is required by TheRock's hip-config.cmake.
      - name: CMake Configure (MSBuild/Visual Studio auto-detected)
        shell: cmd
        run: |
          cmake -B ${{ env.MORPHIZEN_BUILD_DIR }} -S . ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -Dmorphizen_ENABLE_UNIT_TEST=ON ^
            "-DCMAKE_PREFIX_PATH=${{ env.MORPHIZEN_PREFIX }};${{ runner.workspace }}/therock-dist" ^
            -DHIP_PLATFORM=amd

      - name: CMake Build
        shell: cmd
        run: |
          cmake --build ${{ env.MORPHIZEN_BUILD_DIR }} --config Release --parallel

      - name: Run Tests
        shell: cmd
        # PATH must include therock-dist\bin so Windows LoadLibrary resolves
        # amdhip64_7.dll, which onnxruntime_vitisai_ep.dll now imports as a
        # load-time dep (via ort-bridge's `target_link_libraries(... PUBLIC
        # hip::host)`). On Linux dlopen walks RPATH set by CMake so this is
        # automatic, but Windows LoadLibrary doesn't, hence the explicit
        # PATH prepend here. Same pattern as ROCm/onnx-hipdnn-ep CI.
        run: |
          set PATH=${{ runner.workspace }}\therock-dist\bin;%PATH%
          cd ${{ env.MORPHIZEN_BUILD_DIR }}
          ctest -C Release --output-on-failure --timeout 120 -j4
        env:
          # GitHub Windows runners don't have an AMD GPU, so the EP factory's
          # production GPU-device registration would fail to find any
          # OrtEpDevice for unit tests like HelloEpTest to bind to. Flip
          # the runtime knob so the factory registers a CPU-device entry
          # instead (read by GetSupportedDevicesImpl in
          # ort-bridge/src/morphizen-ep-factory.cpp).
          MORPHIZEN_EP_ENABLE_CPU_DEVICE: "1"
