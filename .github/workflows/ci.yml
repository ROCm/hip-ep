name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      LLVM_TAG: llvm-22.1.0-release
      # Protobuf is a required dependency of onnx-mlir: ONNX model files (.onnx)
      # are protobuf-serialized, so onnx-mlir needs protobuf to parse them.
      # The protobuf package also bundles abseil (absl), which protobuf 3.21+
      # depends on internally.
      PROTO_TAG: protobuf-34.0-release
      FLATBUFFERS_TAG: flatbuffers-25.12.19-release
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Cache pre-built binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/prebuilt-local
          key: prebuilt-${{ env.LLVM_TAG }}-${{ env.PROTO_TAG }}-${{ env.FLATBUFFERS_TAG }}

      - name: Setup pre-built binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-prebuilt.sh

      # The prebuilt LLVM package has C:\msvsn2022 hardcoded in LLVMExports.cmake
      # for the DIA SDK path. This is a known LLVM issue:
      # https://github.com/llvm/llvm-project/issues/111829
      - name: Fix DIA SDK path from prebuilt LLVM
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          mklink /J C:\msvsn2022 "%VS_PATH%"

      # llvm-lit.py (from prebuilt) requires the lit pip package at runtime.
      # Pin Python to avoid mismatch between pip's interpreter and CMake's
      # find_package(Python3) on runners that ship multiple Python versions.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lit
        run: pip install lit

      # Put cl.exe and ninja.exe (bundled with VS) into PATH for the Ninja generator
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Cache compilation results across runs; uses GitHub Actions Cache as backend
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: bash
        run: |
          PREBUILT_DIR=$(cd ../prebuilt-local && pwd)
          cmake -S . -B ../build/$(basename $PWD) \
            -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$PREBUILT_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_MOCK_RUNTIME=ON \
            -DONNX_HIP_INCLUDE_LIT_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            --fresh

      - name: Build
        shell: bash
        run: cmake --build ../build/$(basename $PWD) --parallel $(nproc)

      - name: Test
        shell: bash
        run: ctest --test-dir ../build/$(basename $PWD) --output-on-failure --parallel $(nproc)
