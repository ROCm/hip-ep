name: Linux Deps

# Prebuilds the heavy dependencies and returns their cache keys. A cache hit is
# only probed (lookup-only): nothing is downloaded, packed or uploaded, so a
# warm run costs a few seconds per job. On a miss the job builds the tree,
# saves the cache, and also uploads the tree as a workflow artifact so the
# callers' restore still works if the entry is evicted before the build job
# runs. Callers restore the cache and, on a miss, download the artifact. A
# caller whose restore misses after this workflow hit has no artifact either;
# it fails and the run needs a re-run, which rebuilds the evicted entry. The
# artifact is a tar.zst because upload-artifact drops file modes and symlinks,
# which the LLVM tools and the ORT/OGA shared-library links depend on. zstd -T0
# packs in parallel, where gzip is single-threaded on a multi-GB prefix.
#
# ONNX Runtime and OGA build in one job: OGA links against the ORT prefix, so
# a shared job hands it over on disk instead of a cache save, restore and
# artifact round trip, and a warm run needs one runner for both probes.
#
# Linux Build and Linux RMT Build both call this workflow. Each job's
# concurrency group is per ref and commit, so the two callers of one event
# queue on the same group and a cold key is built once. A group holds only one
# pending job and cancels the older one; per commit, a newer push cannot cancel
# a queued deps job of an earlier commit. Both callers of one event see the
# same github.sha, which on a pull request is the test merge commit. The llvm
# group also carries llvm_extra_targets, because the two callers build
# different target sets. Group names are repository-wide, so they carry a
# linux prefix that keeps them apart from the Windows deps groups.
on:
  workflow_call:
    inputs:
      llvm_extra_targets:
        description: LLVM targets built in addition to X86, e.g. AMDGPU.
        type: string
        default: ""
    outputs:
      llvm_cache_key:
        description: Cache key holding the LLVM/MLIR/LLD install prefix.
        value: ${{ jobs.llvm.outputs.cache_key }}
      ort_cache_key:
        description: Cache key holding the ONNX Runtime install prefix.
        value: ${{ jobs.ort-oga.outputs.ort_cache_key }}
      oga_cache_key:
        description: Cache key holding the OGA artifact set.
        value: ${{ jobs.ort-oga.outputs.oga_cache_key }}

permissions:
  contents: read

env:
  # LLVM/MLIR/LLD are cloned from deps.txt llvm_project. The hash column is a
  # full commit, and the cache key is that commit. Same source as
  # cmake/deps.cmake's from-source fallback. rocmlirTriton's vendored
  # external/llvm-project is not built.
  ONNXRUNTIME_VERSION: "1.31.0"
  # Space-separated microsoft/onnxruntime PR numbers `git apply`-ed on top of
  # the pinned tag during the from-source build (an empty list applies nothing;
  # ORT is still built from source either way). Part of the ort-install cache
  # key. Remove a PR once its fix lands in the pinned ONNX Runtime release.
  ONNXRUNTIME_PR_PATCHES: ""
  OGA_VERSION: "0.19.0"
  # Space-separated microsoft/onnxruntime-genai PR numbers fetched from
  # pull/<n>.diff and applied on top of v<OGA_VERSION>. Part of the OGA cache
  # key. Remove a PR once it lands in the pinned OGA release.
  OGA_PR_PATCHES: "2875"

jobs:
  llvm:
    runs-on: ubuntu-latest
    # A cold LLVM build takes hours; the timeout stays below the 6 h default so
    # a hung link does not burn the full budget.
    timeout-minutes: 300
    env:
      # sccache only pays off on a miss, and the default size evicts constantly
      # while LLVM (thousands of objects) compiles. Starting value: tune it
      # from the sccache stats step below.
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_IDLE_TIMEOUT: "0"
    concurrency:
      group: deps-linux-llvm${{ inputs.llvm_extra_targets && format('-{0}', inputs.llvm_extra_targets) || '' }}-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Checkout deps manifest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source-hip-ep
          sparse-checkout: cmake
          fetch-depth: 1
          show-progress: false

      - name: Compute cache key
        id: key
        working-directory: source-hip-ep
        env:
          EXTRA: ${{ inputs.llvm_extra_targets }}
        run: |
          set -euo pipefail
          LINE=$(grep -E '^llvm_project;' cmake/deps.txt)
          LLVM_URL=$(echo "$LINE" | cut -d';' -f2)
          LLVM_REF=$(echo "$LINE" | cut -d';' -f3)
          LLVM_COMMIT="$LLVM_REF"
          if ! [[ "$LLVM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: deps.txt llvm_project must pin a full commit, got '$LLVM_REF'" >&2
            exit 1
          fi
          # The install holds only these components, which also scopes the
          # exported CMake targets so find_package does not expect the omitted
          # tools. A target build with an extra backend also needs the MLIR/LLVM
          # translation and codegen tools; the X86-only set omits them so its
          # existing cache entry stays valid.
          COMPONENTS="clang;clang-resource-headers;llvm-link;llvm-config;llvm-tblgen;mlir-tblgen;mlir-pdll;mlir-linalg-ods-yaml-gen;mlir-opt;lld;FileCheck;not;count;split-file;llvm-headers;llvm-libraries;cmake-exports;mlir-headers;mlir-libraries;mlir-cmake-exports;lld-headers;lld-libraries;lld-cmake-exports"
          if [ -n "$EXTRA" ]; then
            COMPONENTS="${COMPONENTS};mlir-translate;llc;opt"
          fi
          TAG="${EXTRA//;/-}"
          echo "url=$LLVM_URL" >> "$GITHUB_OUTPUT"
          echo "ref=$LLVM_REF" >> "$GITHUB_OUTPUT"
          echo "commit=$LLVM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "targets=X86${EXTRA:+;$EXTRA}" >> "$GITHUB_OUTPUT"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "value=linux-llvm${TAG:+-$TAG}-dist-${LLVM_COMMIT}" >> "$GITHUB_OUTPUT"

      # Lookup-only: a hit downloads nothing. The build job restores the cache
      # itself; this job only builds, saves and uploads on a miss.
      - name: Probe llvm-install
        id: cache-llvm
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      # ubuntu-latest ships ~14 GB usable SSD; the from-source LLVM build needs
      # much more. Keep swap. Deleting it makes the LLVM link OOM the runner,
      # which GitHub reports as "lost communication" and drops the log.
      - name: Free disk space
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Setup Python 3.14
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install build toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build git ca-certificates curl
          python3 -m pip install --upgrade pip
          python3 -m pip install cmake ninja
          cmake --version
          ninja --version

      - name: Prepare sccache local cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-deps-llvm-${{ env.SCCACHE_KEY_DATE }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-deps-llvm-

      - name: Setup sccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build LLVM/MLIR/LLD from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Shallow fetch of the pinned commit. The cmake project lives at
          # llvm/, not the repository root. Recipe matches cmake/deps.cmake's
          # from-source fallback: clang;mlir;lld, RTTI on, zlib/zstd off,
          # INSTALL_UTILS on.
          SRC="${{ runner.workspace }}/llvm-project"
          git init "$SRC"
          git -C "$SRC" remote add origin "${{ steps.key.outputs.url }}"
          git -C "$SRC" fetch --depth 1 origin "${{ steps.key.outputs.commit }}"
          git -C "$SRC" checkout FETCH_HEAD
          rm -rf "$SRC/.git"
          cmake -G Ninja -S "$SRC/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD="${{ steps.key.outputs.targets }}" \
            -DCMAKE_INSTALL_PREFIX="${{ runner.workspace }}/llvm-install" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_PARALLEL_LINK_JOBS=4 \
            -DLLVM_TOOL_LTO_BUILD=OFF \
            -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF \
            -DLLVM_DISTRIBUTION_COMPONENTS="${{ steps.key.outputs.components }}" \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_C_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install-distribution
          du -sh "${{ runner.workspace }}"/llvm-install/{bin,include,lib}
          rm -rf "$SRC" "${{ runner.workspace }}/build-llvm"

      # Reports the hit rate so the cache size above and the value of keeping
      # sccache in this job can be judged from real numbers.
      - name: sccache stats
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          {
            echo "### sccache (llvm)"
            echo '```'
            sccache --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}

      # Only on a miss: a hit leaves a cache entry that the build job restores.
      - name: Pack llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tar -C "${{ runner.workspace }}/llvm-install" -I 'zstd -T0' -cf "${{ runner.temp }}/llvm-install.tar.zst" .
          du -sh "${{ runner.temp }}/llvm-install.tar.zst"

      - name: Upload llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.value }}
          path: ${{ runner.temp }}/llvm-install.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save sccache directory
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-deps-llvm-${{ env.SCCACHE_KEY_DATE }}-${{ github.run_id }}

  # ONNX Runtime and OGA share a job: OGA builds against the ORT prefix, so the
  # prefix reaches it on disk. The probes below are lookup-only, so a warm run
  # (both entries present) skips every build step and finishes in seconds.
  ort-oga:
    runs-on: ubuntu-latest
    # A cold ORT build takes 50-90 min and OGA follows it; stay below the 6 h
    # default so a hang does not burn the full budget.
    timeout-minutes: 300
    env:
      # Starting value: tune it from the sccache stats step below.
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_IDLE_TIMEOUT: "0"
    concurrency:
      group: deps-linux-ort-oga-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false

    outputs:
      ort_cache_key: ${{ steps.key.outputs.ort }}
      oga_cache_key: ${{ steps.key.outputs.oga }}

    steps:
      - name: Compute cache keys
        id: key
        run: |
          echo "ort=linux-ort-${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}-whl" >> "$GITHUB_OUTPUT"
          echo "oga=linux-oga-${{ env.OGA_VERSION }}-pr${{ env.OGA_PR_PATCHES }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      # Lookup-only: a hit downloads nothing. The build job restores the caches
      # itself; this job only builds, saves and uploads on a miss.
      - name: Probe ort-install
        id: cache-ort
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.ort }}
          lookup-only: true

      - name: Probe oga-artifacts
        id: cache-oga
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.oga }}
          lookup-only: true

      # One decision point so the steps below stay readable. OGA never needs an
      # ORT build of its own: when ORT is cached, it is restored for OGA only.
      - name: Decide work
        id: need
        run: |
          ort=false; oga=false
          [ "${{ steps.cache-ort.outputs.cache-hit }}" = "true" ] || ort=true
          [ "${{ steps.cache-oga.outputs.cache-hit }}" = "true" ] || oga=true
          any=false
          { [ "$ort" = true ] || [ "$oga" = true ]; } && any=true
          echo "ort=$ort" >> "$GITHUB_OUTPUT"
          echo "oga=$oga" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "build ort=$ort oga=$oga"

      - name: Free disk space
        if: steps.need.outputs.any == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Pin the Python the whole job uses (the ORT and OGA wheels are built
      # against it).
      - name: Setup Python 3.14
        if: steps.need.outputs.any == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install build toolchain
        if: steps.need.outputs.any == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build git ca-certificates curl
          python3 -m pip install --upgrade pip
          # numpy/wheel/setuptools/packaging are needed at ORT configure time:
          # --build_wheel makes onnxruntime_python.cmake run find_package(Python
          # ... NumPy), which fails the generate step if numpy is absent, and
          # they are required again when the OGA wheel is configured. requests:
          # OGA build.py's util.dependency_resolver imports it at module load
          # (the pinned Python 3.14 has no preinstalled requests).
          python3 -m pip install cmake ninja numpy wheel setuptools packaging requests
          cmake --version
          ninja --version

      - name: Prepare sccache local cache
        if: steps.need.outputs.any == 'true'
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      # The older per-job ORT prefix is a fallback so the first run after the
      # job merge still starts warm.
      - name: Restore sccache directory
        if: steps.need.outputs.any == 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-deps-ortoga-${{ env.SCCACHE_KEY_DATE }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-deps-ortoga-
            sccache-linux-deps-ort-

      - name: Setup sccache
        if: steps.need.outputs.any == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      # -----------------------------------------------------------------------
      # ONNX Runtime
      # -----------------------------------------------------------------------
      - name: Checkout ONNX Runtime v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.need.outputs.ort == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Microsoft/onnxruntime
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          path: source-onnxruntime
          submodules: true
          fetch-depth: 1
          show-progress: false

      # Apply microsoft/onnxruntime PR patches listed in ONNXRUNTIME_PR_PATCHES
      # on top of the pinned tag. The fresh checkout always lands clean, so the
      # patches apply directly (the PR list is in the ort-install cache key, so
      # editing it forces a rebuild). Empty list => nothing to apply.
      - name: Apply ONNX Runtime PR patches
        if: steps.need.outputs.ort == 'true'
        working-directory: source-onnxruntime
        env:
          ORT_PRS: ${{ env.ONNXRUNTIME_PR_PATCHES }}
        run: |
          set -euo pipefail
          prs="$(echo "$ORT_PRS" | xargs || true)"
          if [ -z "$prs" ]; then
            echo "ONNXRUNTIME_PR_PATCHES is empty; nothing to apply"
            exit 0
          fi
          for pr in $prs; do
            url="https://github.com/microsoft/onnxruntime/pull/${pr}.patch"
            echo "Fetching $url"
            # github.com throttles raw .patch fetches with HTTP 429; retry with
            # backoff (--retry-all-errors covers 429/5xx) to ride out the limit.
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors \
              "$url" -o "/tmp/ort-pr-${pr}.patch"
            echo "Applying PR #${pr}"
            git apply --whitespace=nowarn "/tmp/ort-pr-${pr}.patch"
          done

      - name: Build ONNX Runtime
        if: steps.need.outputs.ort == 'true'
        working-directory: source-onnxruntime
        run: |
          set -euo pipefail
          ./build.sh \
            --config Release \
            --build_shared_lib \
            --parallel \
            --compile_no_warning_as_error \
            --skip_submodule_sync \
            --build_dir "${{ runner.workspace }}/build-onnxruntime" \
            --skip_tests \
            --cmake_generator Ninja \
            --build_wheel \
            --cmake_extra_defines \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Install ORT into ort-install
        if: steps.need.outputs.ort == 'true'
        run: |
          set -euo pipefail
          # ORT's Linux build.sh writes to <build_dir>/Release.
          cmake --install "${{ runner.workspace }}/build-onnxruntime/Release" \
            --prefix "${{ runner.workspace }}/ort-install"
          # perf_test is not a cmake install target; copy it into the cached prefix.
          PERF=$(find "${{ runner.workspace }}/build-onnxruntime" -name onnxruntime_perf_test -type f | head -1)
          if [ -z "$PERF" ]; then
            echo "ERROR: onnxruntime_perf_test not found in build tree"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/ort-install/bin"
          cp "$PERF" "${{ runner.workspace }}/ort-install/bin/"
          # Cache the ORT Python wheel inside ort-install so it rides the same
          # cache key. Output: build-onnxruntime/Release/dist/onnxruntime-<ver>-cp<py>-linux_x86_64.whl
          ORT_WHEEL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ]; then
            echo "ERROR: onnxruntime wheel not found in build tree (need --build_wheel)"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/ort-install/wheels"
          cp "$ORT_WHEEL" "${{ runner.workspace }}/ort-install/wheels/"
          echo "Cached ORT wheel: $(basename "$ORT_WHEEL")"
          # The prefix is complete. Drop the build and source trees so the OGA
          # build below has the disk the ORT build used.
          rm -rf "${{ runner.workspace }}/build-onnxruntime" "$GITHUB_WORKSPACE/source-onnxruntime"

      # Saved before OGA starts so a later OGA failure cannot lose the ORT
      # prefix.
      - name: Save ort-install
        if: steps.need.outputs.ort == 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.ort }}

      # Only on a miss: a hit leaves a cache entry that the build job restores.
      - name: Pack ort-install
        if: steps.need.outputs.ort == 'true'
        run: |
          set -euo pipefail
          tar -C "${{ runner.workspace }}/ort-install" -I 'zstd -T0' -cf "${{ runner.temp }}/ort-install.tar.zst" .
          du -sh "${{ runner.temp }}/ort-install.tar.zst"

      - name: Upload ort-install
        if: steps.need.outputs.ort == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.ort }}
          path: ${{ runner.temp }}/ort-install.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # -----------------------------------------------------------------------
      # OGA
      # -----------------------------------------------------------------------
      # ORT was built above, or is cached and needed only as OGA's input.
      - name: Restore ort-install for OGA
        if: steps.need.outputs.oga == 'true' && steps.need.outputs.ort != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.ort }}
          fail-on-cache-miss: true

      - name: Checkout OGA
        if: steps.need.outputs.oga == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: microsoft/onnxruntime-genai
          ref: v${{ env.OGA_VERSION }}
          submodules: recursive
          path: onnxruntime-genai
          # Full history: `git apply --3way` below resolves each hunk against the
          # blob the PR was prepared from, which lives at the PR's merge base.
          fetch-depth: 0
          show-progress: false

      - name: Apply OGA PR patches
        if: steps.need.outputs.oga == 'true'
        working-directory: onnxruntime-genai
        env:
          OGA_PRS: ${{ env.OGA_PR_PATCHES }}
        run: |
          set -euo pipefail
          prs="$(echo "$OGA_PRS" | xargs || true)"
          if [ -z "$prs" ]; then
            echo "OGA_PR_PATCHES is empty; nothing to apply"
            exit 0
          fi
          # pull/<n>.diff is the PR's net diff against its merge base. Replaying
          # pull/<n>.patch with `git am` drops the conflict resolution of any
          # "merge main" commit in the PR.
          # --3way is required, not an optimization: a PR branched off main
          # carries context lines that main has since edited but the pinned tag
          # has not, and a plain apply rejects those hunks. The merge keeps the
          # tag's version of every line the PR did not touch, so unrelated main
          # commits stay out; a hunk needing code absent from the tag conflicts
          # and fails the step. Tests are excluded because OGA does not build
          # them and their fixtures do conflict; OGA's own CI workflows are
          # excluded because the build does not use them and some no longer
          # exist at the pinned tag. Markdown is excluded because the build
          # does not read it and doc edits across the listed PRs conflict.
          for pr in $prs; do
            url="https://github.com/microsoft/onnxruntime-genai/pull/${pr}.diff"
            echo "Fetching $url"
            # github.com throttles raw .diff fetches with HTTP 429; retry with
            # backoff (--retry-all-errors covers 429/5xx) to ride out the limit.
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors \
              "$url" -o "/tmp/oga-pr-${pr}.diff"
            echo "Applying PR #${pr}"
            git apply --whitespace=nowarn --3way --exclude='test/*' \
              --exclude='.github/*' --exclude='*.md' "/tmp/oga-pr-${pr}.diff" \
              || { echo "PR #${pr} failed to apply"; exit 1; }
          done

      - name: Build OGA
        if: steps.need.outputs.oga == 'true'
        run: |
          set -euo pipefail
          ART="${{ runner.workspace }}/oga-artifacts"
          ORT_PREFIX="${{ runner.workspace }}/ort-install"
          ORT_HOME="${{ runner.workspace }}/oga-ort-home"
          mkdir -p "$ORT_HOME/include" "$ORT_HOME/lib"
          # ORT_HOME wants flat C API headers + the .so. Source-built ORT nests
          # headers under include/onnxruntime/; the prebuilt tgz is already flat.
          if [ -d "$ORT_PREFIX/include/onnxruntime" ]; then
            cp -r "$ORT_PREFIX/include/onnxruntime/." "$ORT_HOME/include/"
          else
            cp -r "$ORT_PREFIX/include/." "$ORT_HOME/include/"
          fi
          cp -a "$ORT_PREFIX"/lib/libonnxruntime.so* "$ORT_HOME/lib/" 2>/dev/null || true
          cp -a "$ORT_PREFIX"/lib/libonnxruntime_providers_shared.so* "$ORT_HOME/lib/" 2>/dev/null || true
          # ENABLE_TESTS=OFF is not redundant with --skip_tests: build.py only
          # turns the option off for mobile targets, so on desktop --skip_tests
          # skips *running* the tests while still building them. This job needs
          # only the shared library, model_benchmark and the wheel.
          python3 onnxruntime-genai/build.py \
            --config Release \
            --cmake_generator Ninja \
            --no_telemetry \
            --ort_home "$ORT_HOME" \
            --skip_tests --skip_examples \
            --parallel \
            --build_dir "${{ runner.workspace }}/build-oga" \
            --cmake_extra_defines \
              ENABLE_TESTS=OFF \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache
          mkdir -p "$ART"
          cp "${{ runner.workspace }}/build-oga/Release/benchmark/c/model_benchmark" "$ART/"
          cp -a "${{ runner.workspace }}/build-oga/Release"/libonnxruntime-genai.so* "$ART/"
          # Cache the OGA python wheel alongside the other OGA artifacts.
          OGA_WHEEL=$(find "${{ runner.workspace }}/build-oga" \
            -name "onnxruntime_genai-*.whl" -type f | head -1)
          if [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: onnxruntime_genai wheel not found in build tree"
            exit 1
          fi
          cp "$OGA_WHEEL" "$ART/"
          echo "Cached OGA wheel: $(basename "$OGA_WHEEL")"

      # Reports the hit rate so the cache size above and the value of keeping
      # sccache in this job can be judged from real numbers.
      - name: sccache stats
        if: always() && steps.need.outputs.any == 'true'
        continue-on-error: true
        run: |
          {
            echo "### sccache (ort-oga)"
            echo '```'
            sccache --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save oga-artifacts
        if: steps.need.outputs.oga == 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.oga }}

      - name: Pack oga-artifacts
        if: steps.need.outputs.oga == 'true'
        run: |
          set -euo pipefail
          tar -C "${{ runner.workspace }}/oga-artifacts" -I 'zstd -T0' -cf "${{ runner.temp }}/oga-artifacts.tar.zst" .
          du -sh "${{ runner.temp }}/oga-artifacts.tar.zst"

      - name: Upload oga-artifacts
        if: steps.need.outputs.oga == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.oga }}
          path: ${{ runner.temp }}/oga-artifacts.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save sccache directory
        if: always() && steps.need.outputs.any == 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-deps-ortoga-${{ env.SCCACHE_KEY_DATE }}-${{ github.run_id }}
