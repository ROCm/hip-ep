name: Windows Build (Mock)

on:
  workflow_call:
    inputs:
      llvm_cache_key:
        description: Cache key of the prebuilt LLVM/MLIR/LLD install prefix.
        required: true
        type: string
      ort_cache_key:
        description: Cache key of the prebuilt ONNX Runtime install prefix.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Pin to VS 2022: windows-latest now serves the VS 2026 image
    # (actions/runner-images#14017), which the pinned LLVM/ORT deps were
    # not validated against.
    runs-on: windows-2022
    # Must be job-level: workflow-level concurrency has no effect in a
    # reusable workflow.
    concurrency:
      group: build-windows-mock-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      # MorphiZen is vendored in-tree as a git subtree under morphizen,
      # so no deploy key or submodule initialization is needed.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 0
          show-progress: false

      # LLVM and ORT are prebuilt by the deps workflow. fail-on-cache-miss
      # makes the contract explicit: a green deps run means these entries
      # exist, so a miss is a wiring bug, not a cue to rebuild.
      - name: Restore llvm-install
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ inputs.llvm_cache_key }}
          fail-on-cache-miss: true

      - name: Restore ort-install
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ inputs.ort_cache_key }}
          fail-on-cache-miss: true

      # -----------------------------------------------------------------------
      # llvm-lit.py requires the lit pip package at runtime. Pin Python to
      # match find_package(Python3) and the cp314 ORT wheel that the shared
      # ort-install cache carries (so mock and real produce the same wheel).
      # -----------------------------------------------------------------------
      - name: Setup Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Install pip dependencies
        run: pip install lit requests

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-mock-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-mock-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # -----------------------------------------------------------------------
      # protobuf, flatbuffers and gtest are resolved by cmake/deps.cmake during
      # Configure/Build (from-source FetchContent fallback), not pre-built here.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # Build (mock) via the cross-platform build.py. --mock sets
      # BUILD_MOCK_RUNTIME=ON (no ROCm/TheRock); ORT + LLVM come from the cached
      # prefixes and cmake/deps.cmake source-builds the rest. build.py runs the
      # GPU-free test suites (LIT + the plugin-registrar and output-allocator
      # unit tests) after install. No compiler plugin is selected here, so the
      # LIT pipeline stays plugin-free (see the isolated step below for why).
      # -----------------------------------------------------------------------
      - name: Build onnx-hipdnn-ep (mock)
        shell: bash
        run: |
          python build.py \
            --mock \
            --config Release \
            --cmake_generator Ninja \
            --build_dir "${{ runner.workspace }}/build/mock" \
            --cmake_prefix_path "${{ runner.workspace }}/ort-install;${{ runner.workspace }}/llvm-install"

      # -----------------------------------------------------------------------
      # Exercise the sample plugin's registrar unit test in ISOLATION. This is a
      # validation-only build (no artifacts shipped), but the sample plugin
      # cannot be selected in the build above: selecting a plugin injects its
      # pipeline-slot pass into buildOnnxToHipPipeline, and the sample pass emits
      # a remark per func.func, which pollutes the pipeline LIT tests that
      # capture stderr. So reconfigure the just-built tree with the plugin and
      # run ONLY the registrar ctest -- it checks the plugin registry (it does
      # not run the pipeline), so it is unaffected. This covers the
      # HIP_EP_EXPECT_SAMPLE=1 branch: the addDialectRegistration ->
      # loadAllDialects path and the convert-hip-to-llvm hasPromisedInterface
      # guard. LIT is not re-run here, so it stays plugin-free.
      # -----------------------------------------------------------------------
      - name: Plugin registrar unit test (sample plugin selected)
        shell: bash
        run: |
          BUILD="${{ runner.workspace }}/build/mock"
          cmake -B "$BUILD" -DHIPDNN_EP_COMPILER_PLUGINS=sample
          cmake --build "$BUILD" --config Release --target test_static_plugins
          ctest --test-dir "$BUILD" -C Release -R StaticPlugins --output-on-failure

      - name: Save sccache directory
        if: always() && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-mock-${{ env.SCCACHE_KEY_DATE }}
