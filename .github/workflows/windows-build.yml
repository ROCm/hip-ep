name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, "release_*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    # Cancel the build job when a newer commit lands on the same PR ref to
    # save runner minutes. gpu-test deliberately does NOT inherit this rule
    # (see its own concurrency block below) so an in-progress GPU run keeps
    # going to completion even if a newer build supersedes it.
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      PREBUILT_CACHE_VERSION: "3"  # bump to invalidate prebuilt cache (added cp314 wheels)
      LLVM_TAG: llvm-22.1.0-release
      FLATBUFFERS_TAG: flatbuffers-25.12.19-release
      PROTO_TAG: protobuf-34.0-release
      ONNXRUNTIME_VERSION: "1.25.1"
      # Space-separated list of microsoft/onnxruntime PR numbers to fetch
      # from github.com/microsoft/onnxruntime/pull/<n>.patch and `git apply`
      # on top of the pinned ONNXRUNTIME_VERSION tag during the source-build
      # step. The PR list is also part of the prebuilt-local cache key, so
      # editing this list auto-invalidates the cached install prefix.
      # Remove a PR number once its fix is in the pinned ONNXRUNTIME_VERSION.
      ONNXRUNTIME_PR_PATCHES: "28608"
      GTEST_VERSION: "1.15.0"
      THEROCK_VERSION: therock-dist-windows-gfx1151-7.11.0
      SCCACHE_GHA_ENABLED: "true"
      OGA_REPO: AMDmoore/onnxruntime-genai
      OGA_REF: 2615301864b4d2397231d443865cb96111cc5fc2
      # ilammy/msvc-dev-cmd and mozilla-actions/sccache-action have no
      # Node.js 24 releases yet; allow Node.js 20 until they are updated.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      # ROCm/MorphiZen is a private repo. A read-only deploy key is stored as
      # MORPHIZEN_DEPLOY_KEY in ROCm/onnx-hipdnn-ep secrets, and the matching
      # public key is added to ROCm/MorphiZen deploy keys. The git URL rewrite
      # below redirects the HTTPS submodule URL to SSH at clone time so that
      # .gitmodules can stay as HTTPS.
      - name: Setup SSH key for MorphiZen submodule
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MORPHIZEN_DEPLOY_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          show-progress: false

      - name: Checkout MorphiZen submodule
        shell: bash
        run: |
          git config --global url."git@github.com:ROCm/MorphiZen.git".insteadOf \
            "https://github.com/ROCm/MorphiZen.git"
          git submodule update --init --recursive --depth 1

      # -----------------------------------------------------------------------
      # Cache: ORT + LLVM prebuilt + flatbuffers + protobuf + gtest
      # All are installed into the same prebuilt-local prefix so one cache
      # entry covers all of them.
      # Note: protobuf is excluded from prebuilt downloads – cmake/deps.cmake
      # fetches v21.12 via FetchContent (same version pinned by morphizen) to
      # avoid C4267 errors from mismatched protobuf versions.
      # ORT is built from source and installed here (same pattern as GTest).
      # -----------------------------------------------------------------------
      - name: Cache prebuilt-local
        id: cache-prebuilt
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/prebuilt-local
          # The `ortpr-<list>` segment embeds the ONNXRUNTIME_PR_PATCHES env
          # value verbatim, so editing the PR list auto-invalidates the
          # cached install prefix. Without this, bumping the patched PR set
          # but leaving ONNXRUNTIME_VERSION fixed would silently keep the
          # previous-patch ORT artifacts in the cache.
          key: prebuilt-v${{ env.PREBUILT_CACHE_VERSION }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}-${{ env.LLVM_TAG }}-${{ env.FLATBUFFERS_TAG }}-${{ env.PROTO_TAG }}-gtest${{ env.GTEST_VERSION }}

      # -----------------------------------------------------------------------
      # Cache: TheRock HIP SDK for Windows (separate cache – large tarball)
      # -----------------------------------------------------------------------
      - name: Cache TheRock
        id: cache-therock
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/therock-dist
          key: ${{ env.THEROCK_VERSION }}

      - name: Download & extract TheRock
        if: steps.cache-therock.outputs.cache-hit != 'true'
        shell: bash
        run: |
          THEROCK_DIST="$(cygpath -u '${{ runner.workspace }}/therock-dist')"
          mkdir -p "$THEROCK_DIST"
          curl -fsSL \
            "https://repo.amd.com/rocm/tarball/${{ env.THEROCK_VERSION }}.tar.gz" \
            -o therock.tar.gz
          tar -xzf therock.tar.gz -C "$THEROCK_DIST" --strip-components=1
          rm therock.tar.gz

      # -----------------------------------------------------------------------
      # The prebuilt LLVM package has C:\msvsn2022 hardcoded in LLVMExports.cmake
      # for the DIA SDK path (known LLVM issue: llvm/llvm-project#111829).
      # Create a junction from C:\msvsn2022 to the actual VS installation.
      # -----------------------------------------------------------------------
      - name: Fix DIA SDK path from prebuilt LLVM
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          mklink /J C:\msvsn2022 "%VS_PATH%"

      # -----------------------------------------------------------------------
      # llvm-lit.py (from prebuilt) requires the lit pip package at runtime.
      # Pin Python to avoid mismatch with find_package(Python3) in CMake.
      # -----------------------------------------------------------------------
      - name: Setup Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Install pip dependencies
        run: pip install lit requests

      # Put cl.exe and ninja.exe (bundled with VS) into PATH
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Cache compilation results across runs via GitHub Actions Cache backend
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # -----------------------------------------------------------------------
      # Build ONNX Runtime from source and install into prebuilt-local.
      # Produces both the ORT shared library (build-time dep for onnx-hipdnn-ep)
      # and onnxruntime_perf_test.exe (GPU test tool).
      # Requires MSVC env; placed after Setup MSVC (same pattern as GTest).
      # Clone and build are skipped when the ORT build cache hits.
      # -----------------------------------------------------------------------
      - name: Checkout ONNX Runtime v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Microsoft/onnxruntime
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          path: source-onnxruntime
          submodules: true
          fetch-depth: 1
          show-progress: false

      # Fetch and apply microsoft/onnxruntime PR patches listed in
      # ONNXRUNTIME_PR_PATCHES (env). Each PR's `.patch` endpoint returns the
      # git format-patch mailbox for the PR's current head, which we apply on
      # top of the pinned ONNXRUNTIME_VERSION tag. The cache key on
      # `prebuilt-local` includes the PR list, so adding/removing a PR
      # number forces a rebuild. The source-onnxruntime tree itself is not
      # cached, so a fresh checkout always lands here clean and patches
      # apply directly. No idempotency needed.
      - name: Apply ONNX Runtime PR patches
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-onnxruntime
        env:
          ORT_PRS: ${{ env.ONNXRUNTIME_PR_PATCHES }}
        run: |
          $prs = $env:ORT_PRS.Trim()
          if (-not $prs) {
            Write-Host "ONNXRUNTIME_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "ort-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Build ONNX Runtime
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "${{ github.workspace }}\source-onnxruntime"
          call build.bat ^
            --config Release ^
            --build_shared_lib ^
            --parallel ^
            --compile_no_warning_as_error ^
            --skip_submodule_sync ^
            --build_dir "${{ runner.workspace }}\build-onnxruntime" ^
            --skip_tests ^
            --disable_memleak_checker ^
            --use_dml ^
            --cmake_generator Ninja ^
            --build_wheel

      - name: Install ORT into prebuilt-local
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install "${{ runner.workspace }}/build-onnxruntime/Release" \
            --prefix "${{ runner.workspace }}/prebuilt-local"
          # perf_test is not a cmake install target; copy manually so it lands
          # in prebuilt-local (cached) rather than the ephemeral build directory.
          PERF_TEST=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in build tree"
            exit 1
          fi
          cp "$PERF_TEST" "${{ runner.workspace }}/prebuilt-local/bin/"
          # DirectML.dll is not installed by cmake --install; copy manually.
          DML_DLL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -path "*/x64-win/DirectML.dll" -type f | head -1)
          if [ -z "$DML_DLL" ]; then
            echo "ERROR: DirectML.dll not found in build tree"
            exit 1
          fi
          cp "$DML_DLL" "${{ runner.workspace }}/prebuilt-local/bin/"
          # Cache the cp314 ORT Python wheel inside prebuilt-local so it
          # rides the same cache key as the rest of the ORT artifacts.
          # Output path: build-onnxruntime/Release/dist/onnxruntime_directml-1.25.1-cp314-cp314-win_amd64.whl
          ORT_WHEEL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ]; then
            echo "ERROR: onnxruntime_directml wheel not found in build tree"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/prebuilt-local/wheels"
          cp "$ORT_WHEEL" "${{ runner.workspace }}/prebuilt-local/wheels/"
          echo "Cached ORT wheel: $(basename "$ORT_WHEEL")"

      # -----------------------------------------------------------------------
      # Download LLVM prebuilt (from wcy123/llvm-mlir-prebuilt releases)
      # -----------------------------------------------------------------------
      - name: Download LLVM prebuilt
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREBUILT_DIR="${{ runner.workspace }}/prebuilt-local"
          mkdir -p "$PREBUILT_DIR"
          gh release download "${{ env.LLVM_TAG }}" \
            --repo wcy123/llvm-mlir-prebuilt \
            --pattern "llvm-22.1.0-release-windows-x64.zip" \
            --dir "$PREBUILT_DIR"
          unzip -q -o "$PREBUILT_DIR/llvm-22.1.0-release-windows-x64.zip" -d "$PREBUILT_DIR"
          rm "$PREBUILT_DIR/llvm-22.1.0-release-windows-x64.zip"

      # -----------------------------------------------------------------------
      # Download flatbuffers prebuilt
      # -----------------------------------------------------------------------
      - name: Download flatbuffers prebuilt
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREBUILT_DIR="${{ runner.workspace }}/prebuilt-local"
          gh release download "${{ env.FLATBUFFERS_TAG }}" \
            --repo wcy123/llvm-mlir-prebuilt \
            --pattern "flatbuffers-25.12.19-release-windows-x64.zip" \
            --dir "$PREBUILT_DIR"
          unzip -q -o "$PREBUILT_DIR/flatbuffers-25.12.19-release-windows-x64.zip" -d "$PREBUILT_DIR"
          rm "$PREBUILT_DIR/flatbuffers-25.12.19-release-windows-x64.zip"

      # -----------------------------------------------------------------------
      # Download protobuf prebuilt
      # -----------------------------------------------------------------------
      - name: Download protobuf prebuilt
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREBUILT_DIR="${{ runner.workspace }}/prebuilt-local"
          mkdir -p "$PREBUILT_DIR"
          gh release download "${{ env.PROTO_TAG }}" \
            --repo wcy123/llvm-mlir-prebuilt \
            --pattern "protobuf-34.0-release-windows-x64.zip" \
            --dir "$PREBUILT_DIR"
          unzip -q -o "$PREBUILT_DIR/protobuf-34.0-release-windows-x64.zip" -d "$PREBUILT_DIR"
          rm "$PREBUILT_DIR/protobuf-34.0-release-windows-x64.zip"

      # -----------------------------------------------------------------------
      # Build GTest from source and install into prebuilt-local.
      # cmake/deps.cmake does find_package(GTest CONFIG QUIET) first; if found
      # via CMAKE_PREFIX_PATH it skips FetchContent entirely.
      # Requires MSVC env (cl.exe + ninja) hence placed after Setup MSVC.
      # -----------------------------------------------------------------------
      - name: Build GTest
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -fsSL "https://github.com/google/googletest/archive/refs/tags/v${{ env.GTEST_VERSION }}.zip" -o gtest.zip
          unzip -q gtest.zip
          cmake -G Ninja -B gtest-build -S "googletest-${{ env.GTEST_VERSION }}" ^
            -DCMAKE_BUILD_TYPE=Release ^
            "-DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/prebuilt-local" ^
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" ^
            -DBUILD_GMOCK=ON
          ninja -C gtest-build install
          rd /s /q gtest-build "googletest-${{ env.GTEST_VERSION }}"
          del gtest.zip

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B ../build/$(basename "$PWD") \
            -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=${{ runner.workspace }}/prebuilt-local" \
            "-DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/install" \
            -DBUILD_EP=ON \
            -DBUILD_HIP_TOOLS=ON \
            "-DTHEROCK_DIST=${{ runner.workspace }}/therock-dist" \
            -DHIP_ARCHITECTURES=gfx1151 \
            -Dmorphizen_ENABLE_UNIT_TEST=OFF \
            -DBUILD_MOCK_RUNTIME=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache


      # -----------------------------------------------------------------------
      # Build & Install
      # -----------------------------------------------------------------------
      - name: Build & Install
        shell: bash
        run: cmake --build ../build/$(basename "$PWD") --parallel $(nproc) --target install

      # -----------------------------------------------------------------------
      # Run LIT tests (FileCheck-based IR tests; no GPU required)
      # -----------------------------------------------------------------------
      - name: Run LIT tests
        shell: bash
        run: cmake --build ../build/$(basename "$PWD") --target check-hip-mlir-lit

      # -----------------------------------------------------------------------
      # Build OGA (onnxruntime-genai) for model_benchmark.exe
      # Cache only the two artifacts we need: model_benchmark.exe and
      # onnxruntime-genai.dll, keyed on OGA commit + ORT version.
      # -----------------------------------------------------------------------
      - name: Cache OGA artifacts
        id: cache-oga
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          # Reuse PREBUILT_CACHE_VERSION as the OGA cache version too: when
          # the OGA build outputs change shape (e.g. wheel added), bumping
          # PREBUILT_CACHE_VERSION invalidates both ORT and OGA caches in
          # one step instead of needing two separate version knobs.
          key: oga-dml-v${{ env.PREBUILT_CACHE_VERSION }}-${{ env.OGA_REF }}-ort${{ env.ONNXRUNTIME_VERSION }}

      - name: Checkout OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.OGA_REPO }}
          ref: ${{ env.OGA_REF }}
          path: source-oga
          submodules: true
          fetch-depth: 1
          show-progress: false

      - name: Prepare ORT_HOME for OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ORT_HOME="${{ runner.workspace }}/oga-ort-home"
          mkdir -p "$ORT_HOME/include" "$ORT_HOME/lib"
          PREBUILT="${{ runner.workspace }}/prebuilt-local"
          cp -r "$PREBUILT/include/onnxruntime/"* "$ORT_HOME/include/"
          cp "$PREBUILT/lib/"onnxruntime*.lib "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime.dll" "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" "$ORT_HOME/lib/"
          echo "ORT_HOME=$ORT_HOME" >> "$GITHUB_ENV"

      - name: Build OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python "${{ github.workspace }}/source-oga/build.py" \
            --config Release \
            --cmake_generator Ninja \
            --use_dml \
            --ort_home "$ORT_HOME" \
            --skip_tests --skip_examples \
            --parallel \
            --build_dir "${{ runner.workspace }}/build-oga" \
            --cmake_extra_defines \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          mkdir -p "${{ runner.workspace }}/oga-artifacts"
          OGA_OUT="${{ runner.workspace }}/build-oga/Release"
          cp "$OGA_OUT/benchmark/c/model_benchmark.exe" "${{ runner.workspace }}/oga-artifacts/"
          cp "$OGA_OUT/onnxruntime-genai.dll" "${{ runner.workspace }}/oga-artifacts/"
          # Cache the cp314 OGA Python wheel alongside the other OGA artifacts.
          # Output path: build-oga/Release/wheel/onnxruntime_genai_directml-0.13.0.dev0-cp314-cp314-win_amd64.whl
          OGA_WHEEL=$(find "${{ runner.workspace }}/build-oga" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: onnxruntime_genai_directml wheel not found in build tree"
            exit 1
          fi
          cp "$OGA_WHEEL" "${{ runner.workspace }}/oga-artifacts/"
          echo "Cached OGA wheel: $(basename "$OGA_WHEEL")"

      # -----------------------------------------------------------------------
      # Stage GPU test package:
      #   staging/bin/    – executables + DLLs needed at runtime on the GPU box
      #   staging/models/ – ONNX test model
      #   staging/morphizen_config.json
      # -----------------------------------------------------------------------
      - name: Stage GPU test package
        shell: bash
        run: |
          mkdir -p staging/bin staging/lib

          # onnxruntime_perf_test.exe + onnxruntime.dll – from prebuilt-local
          PREBUILT="${{ runner.workspace }}/prebuilt-local"
          PERF_TEST=$(find "$PREBUILT" -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in $PREBUILT"
            exit 1
          fi
          cp "$PERF_TEST" staging/bin/

          # ORT DLLs + DirectML.dll – from the install prefix
          cp "$PREBUILT/bin/onnxruntime.dll" staging/bin/
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" staging/bin/
          cp "$PREBUILT/bin/DirectML.dll" staging/bin/

          # MorphiZen EP DLL + other DLLs/EXEs from onnx-hipdnn-ep install
          cp "${{ runner.workspace }}/install/bin/"*.dll staging/bin/ 2>/dev/null || true
          cp "${{ runner.workspace }}/install/bin/"*.exe staging/bin/ 2>/dev/null || true

          # mm unit test binary (requires a real GPU; runs in gpu-test job)
          MM_TEST=$(find "${{ runner.workspace }}/build" -name "mm_tests.exe" -type f | head -1)
          if [ -n "$MM_TEST" ]; then
            cp "$MM_TEST" staging/bin/
            echo "  Packaged: mm_tests.exe <- $MM_TEST"
          else
            echo "  WARNING: mm_tests.exe not found in build tree"
          fi

          # Import libraries needed by the MorphiZen JIT linker (lld-link).
          # hip-compiler.dll embeds the build-time install path for
          # hip_custom_kernels.lib; staging/lib/ preserves them so the
          # gpu-test job can restore them at the expected location.
          cp "${{ runner.workspace }}/install/lib/"*.lib staging/lib/ 2>/dev/null || true

          # amdhip64_7.dll – HIP runtime required at inference time
          cp "${{ runner.workspace }}/therock-dist/bin/amdhip64_7.dll" staging/bin/

          # MorphiZen EP config
          cp etc/morphizen_config.json staging/

          # ---------------------------------------------------------------
          # Package MSVC/WinSDK release CRT import libraries for lld-link.
          # The MorphiZen JIT compiler links against the release CRT (/MD),
          # so the GPU test machine does not need VS Build Tools installed.
          # ilammy/msvc-dev-cmd (already run above) sets VCToolsInstallDir,
          # WindowsSdkDir, and WindowsSDKVersion in the environment.
          # ---------------------------------------------------------------
          MSVC_LIB="$(cygpath -u "$VCToolsInstallDir")/lib/x64"
          UCRT_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/ucrt/x64"
          UM_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/um/x64"
          echo "MSVC lib: $MSVC_LIB"
          echo "UCRT lib: $UCRT_LIB"
          echo "UM lib:   $UM_LIB"
          for lib in msvcrt.lib ucrt.lib vcruntime.lib oldnames.lib \
                     libcpmt.lib libcmt.lib kernel32.lib user32.lib; do
            src=$(find "$MSVC_LIB" "$UCRT_LIB" "$UM_LIB" \
                    -maxdepth 1 -iname "$lib" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp "$src" staging/lib/
              echo "  Packaged: $lib <- $src"
            else
              echo "  WARNING: $lib not found"
            fi
          done

          # ---------------------------------------------------------------
          # OGA artifacts: model_benchmark.exe + onnxruntime-genai.dll
          # ---------------------------------------------------------------
          cp "${{ runner.workspace }}/oga-artifacts/model_benchmark.exe" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/onnxruntime-genai.dll" staging/bin/

          # ---------------------------------------------------------------
          # Python wheels (ORT + OGA cp314) — bundled into the same artifact
          # under staging/wheels/ so downstream consumers download a single
          # zip. Both wheels are cached inside prebuilt-local / oga-artifacts
          # respectively, so cache hits restore them without re-running ORT
          # or OGA from source.
          # ---------------------------------------------------------------
          mkdir -p staging/wheels
          ORT_WHEEL=$(find "${{ runner.workspace }}/prebuilt-local/wheels" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          OGA_WHEEL=$(find "${{ runner.workspace }}/oga-artifacts" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ] || [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: cp314 wheel(s) missing from cache"
            echo "  ORT: $ORT_WHEEL"
            echo "  OGA: $OGA_WHEEL"
            exit 1
          fi
          cp "$ORT_WHEEL" staging/wheels/
          cp "$OGA_WHEEL" staging/wheels/

          echo "=== Staged package contents ==="
          find staging/ -type f | sort

      - name: Upload GPU test package
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-package
          path: staging/
          retention-days: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_')) && 14 || 3 }}

  # ---------------------------------------------------------------------------
  # GPU test job: runs on the self-hosted machine with a real AMD GPU.
  # Downloads the package built above and runs onnxruntime_perf_test.
  # ---------------------------------------------------------------------------
  gpu-test:
    needs: build-windows
    runs-on: StrixHalo
    # Never cancel an in-progress GPU run: queue newer runs of the same ref
    # behind it instead of killing the long-running perf / OGA / L2 suites.
    # The self-hosted StrixHalo runner already serializes physically, so
    # this group only adds explicit logical queueing for clarity.
    concurrency:
      group: gpu-test-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write

    env:
      THEROCK_VERSION: therock-dist-windows-gfx1151-7.11.0
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Clean workspace
        shell: cmd
        run: |
          taskkill /f /im hip-onnx-runner.exe >nul 2>&1 || ver >nul
          taskkill /f /im onnxruntime_perf_test.exe >nul 2>&1 || ver >nul
          taskkill /f /im model_benchmark.exe >nul 2>&1 || ver >nul
          if exist gpu-test-package rd /s /q gpu-test-package
          if exist l2-results rd /s /q l2-results
          if exist oga-results rd /s /q oga-results

      - name: Download GPU test package
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-package
          path: gpu-test-package

      # TheRock DLLs are required at runtime on the GPU machine.
      # Download is fast enough that caching is not needed on the self-hosted runner.
      - name: Download & extract TheRock
        shell: pwsh
        run: |
          $dist = "${{ runner.workspace }}\therock-dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          curl.exe -fsSL `
            "https://repo.amd.com/rocm/tarball/${{ env.THEROCK_VERSION }}.tar.gz" `
            -o therock.tar.gz
          tar -xzf therock.tar.gz -C $dist --strip-components=1
          Remove-Item therock.tar.gz

      # -----------------------------------------------------------------------
      # Run mm unit tests on the real GPU machine.
      # mm_tests.exe is a standalone GTest binary that calls hipMalloc etc.
      # -----------------------------------------------------------------------
      - name: Run mm unit tests (GPU)
        shell: cmd
        run: |
          set PATH=${{ runner.workspace }}\therock-dist\bin;%CD%\gpu-test-package\bin;%PATH%
          gpu-test-package\bin\mm_tests.exe

      # Run perf test against seq128 models via MorphiZen EP.
      # Models are pre-placed on the runner at C:\actions-runner\_work\model\.
      # -t 30        : run for 30 seconds per model
      # -c 1         : single session
      # -s           : sequential execution
      # -I           : generate random inputs (no test data files needed)
      # THEROCK_DIST : required by discoverLibraries() to locate HIP libs
      # LIB          : all link-time libs are packaged in gpu-test-package/lib/
      #                (MSVC release CRT + hip_custom_kernels); no VS required.
      # Output is tee'd to results/ for QPS extraction. Non-zero exit code
      # sets FAILED but continues so all models are tested.
      - name: Run onnxruntime_perf_test (GPU)
        shell: cmd
        run: |
          set THEROCK_DIST=${{ runner.workspace }}\therock-dist
          set PATH=${{ runner.workspace }}\therock-dist\bin;%CD%\gpu-test-package\bin;%PATH%
          set LIB=%CD%\gpu-test-package\lib;${{ runner.workspace }}\therock-dist\lib
          set MODEL_DIR=${{ runner.workspace }}\model
          if not exist "%MODEL_DIR%" (
            echo [ERROR] MODEL_DIR not found: %MODEL_DIR%
            exit /b 1
          )
          set FOUND=0
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do set FOUND=1
          if "%FOUND%"=="0" (
            echo [ERROR] No *seq128.onnx models found in %MODEL_DIR%
            exit /b 1
          )
          set FAILED=0
          cd gpu-test-package\bin
          mkdir ..\results 2>nul
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do (
            echo === Testing %%~nxM ===
            onnxruntime_perf_test.exe ^
              --plugin_ep_libs "MorphiZenExecutionProvider|onnxruntime_morphizen_ep.dll" ^
              --plugin_eps "MorphiZenExecutionProvider" ^
              --plugin_ep_options "config_file|..\morphizen_config.json" ^
              -C "session.disable_cpu_ep_fallback|1" ^
              -t 30 -c 1 -s ^
              "%%M" > "..\results\%%~nxM.txt" 2>&1
            type "..\results\%%~nxM.txt"
            if errorlevel 1 set FAILED=1
          )
          exit /b %FAILED%

      # ----------------------------------------------------------------------
      # EPContext export + import perf test (PR #132 sidecar-in-tar path).
      # Limited to full_model_seq128 to bound runtime: each model triggers
      # one export pass (~60 s + N GB sidecar write) plus one import perf
      # pass (-t 30). The _ctx.onnx + _MORPHIZEN.bin are deleted right after
      # import to keep runner disk usage bounded.
      # ----------------------------------------------------------------------
      - name: Run EPContext export/import perf test (GPU)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:THEROCK_DIST = "${{ runner.workspace }}\therock-dist"
          $pkgBin = Join-Path $PWD "gpu-test-package\bin"
          $env:PATH = "${{ runner.workspace }}\therock-dist\bin;$pkgBin;$env:PATH"
          $env:LIB = (Join-Path $PWD "gpu-test-package\lib") + ";${{ runner.workspace }}\therock-dist\lib"

          $modelDir = "${{ runner.workspace }}\model"
          if (-not (Test-Path $modelDir)) {
            Write-Host "[SKIP] MODEL_DIR not found: $modelDir"
            exit 0
          }
          $models = @(Get-ChildItem $modelDir -Recurse -Filter "full_model_seq128.onnx" -ErrorAction SilentlyContinue)
          if ($models.Count -eq 0) {
            Write-Host "[SKIP] No full_model_seq128.onnx in $modelDir"
            exit 0
          }

          New-Item -ItemType Directory -Force -Path "gpu-test-package\results-epctx-export" | Out-Null
          New-Item -ItemType Directory -Force -Path "gpu-test-package\results-epctx-import" | Out-Null
          $cacheDir = Join-Path $PWD "gpu-test-package\epctx-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $failed = 0
          Push-Location gpu-test-package\bin
          foreach ($m in $models) {
            $exportFile = "..\results-epctx-export\$($m.Name).txt"
            $importFile = "..\results-epctx-import\$($m.Name).txt"
            $ctxPath = Join-Path $cacheDir "$($m.BaseName)_ctx.onnx"
            Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue

            Write-Host "=== EPContext export: $($m.Name) ==="
            & .\onnxruntime_perf_test.exe `
              --plugin_ep_libs "MorphiZenExecutionProvider|onnxruntime_morphizen_ep.dll" `
              --plugin_eps "MorphiZenExecutionProvider" `
              --plugin_ep_options "config_file|..\morphizen_config.json" `
              -C "session.disable_cpu_ep_fallback|1 ep.context_enable|1 ep.context_embed_mode|0 ep.context_file_path|$ctxPath" `
              -t 5 -c 1 -s -I `
              $m.FullName 2>&1 | Tee-Object -FilePath $exportFile
            if ($LASTEXITCODE -ne 0) {
              Add-Content $exportFile "[ERROR] EPContext export failed"
              $failed = 1
              Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue
              continue
            }
            if (-not (Test-Path $ctxPath)) {
              Add-Content $exportFile "[ERROR] _ctx.onnx not produced"
              $failed = 1
              continue
            }

            Write-Host "=== EPContext import: $($m.Name) ==="
            & .\onnxruntime_perf_test.exe `
              --plugin_ep_libs "MorphiZenExecutionProvider|onnxruntime_morphizen_ep.dll" `
              --plugin_eps "MorphiZenExecutionProvider" `
              --plugin_ep_options "config_file|..\morphizen_config.json" `
              -C "session.disable_cpu_ep_fallback|1" `
              -t 30 -c 1 -s -I `
              $ctxPath 2>&1 | Tee-Object -FilePath $importFile
            if ($LASTEXITCODE -ne 0) { $failed = 1 }

            Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue
          }
          Pop-Location
          Remove-Item $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
          exit $failed

      # -----------------------------------------------------------------------
      # OGA benchmark: run model_benchmark against pre-placed LLM models.
      # Models are at ${{ runner.workspace }}/oga-models/<model>/
      # with genai_config.json pre-configured for MorphiZenEP pipeline.
      # Skipped gracefully when model directory does not exist.
      # -----------------------------------------------------------------------
      - name: Run OGA benchmark
        if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:THEROCK_DIST = "${{ runner.workspace }}\therock-dist"
          $pkgBin = Join-Path $PWD "gpu-test-package\bin"
          $env:PATH = "${{ runner.workspace }}\therock-dist\bin;$pkgBin;$env:PATH"
          $env:LIB = (Join-Path $PWD "gpu-test-package\lib") + ";${{ runner.workspace }}\therock-dist\lib"
          $env:HIP_CUSTOM_KERNELS_DIR = Join-Path $PWD "gpu-test-package\lib"

          $ogaModelRoot = "${{ runner.workspace }}\oga-models"
          if (-not (Test-Path $ogaModelRoot)) {
            Write-Host "[SKIP] OGA model directory not found: $ogaModelRoot"
            exit 0
          }

          $benchmark = Join-Path $pkgBin "model_benchmark.exe"
          if (-not (Test-Path $benchmark)) {
            Write-Host "[SKIP] model_benchmark.exe not found"
            exit 0
          }

          $epDll = Join-Path $pkgBin "onnxruntime_morphizen_ep.dll"
          New-Item -ItemType Directory -Force -Path "oga-results" | Out-Null

          $failed = 0
          foreach ($modelDir in (Get-ChildItem $ogaModelRoot -Directory)) {
            $pipelineConfig = Join-Path $modelDir.FullName "genai_config_128.json"
            if (-not (Test-Path $pipelineConfig)) {
              Write-Host "[SKIP] No genai_config_128.json in $($modelDir.Name)"
              continue
            }
            $genaiCfgPath = Join-Path $modelDir.FullName "genai_config.json"
            Copy-Item $pipelineConfig $genaiCfgPath -Force
            $cfgJson = Get-Content $genaiCfgPath -Raw | ConvertFrom-Json
            $epName = try {
              $opts = $cfgJson.model.decoder.session_options.provider_options[0]
              ($opts.PSObject.Properties | Select-Object -First 1).Name
            } catch { $null }
            if (-not $epName) { $epName = "MorphiZenExecutionProvider" }
            $promptFile = Join-Path $modelDir.FullName "prompt.txt"
            $promptArgs = if (Test-Path $promptFile) {
              @("--prompt_file", $promptFile)
            } else {
              @("-l", "128")
            }
            $outFile = "oga-results\$($modelDir.Name).txt"
            Write-Host "=== OGA Benchmark: $($modelDir.Name) (EP=$epName) ==="
            & $benchmark `
              -i $modelDir.FullName `
              -g 128 -r 5 -w 1 -b 1 -ml -1 `
              @promptArgs `
              --ep_library $epName $epDll `
              -v 2>&1 | Tee-Object -FilePath $outFile
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      # -----------------------------------------------------------------------
      # L2 accuracy test: compare MorphiZen EP vs CPU output for each model
      # in l2-test-models/. Skipped gracefully when directory does not exist.
      # -----------------------------------------------------------------------
      - name: Run L2 accuracy tests
        if: always()
        timeout-minutes: 10
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set THEROCK_DIST=${{ runner.workspace }}\therock-dist
          set PATH=${{ runner.workspace }}\therock-dist\bin;%CD%\gpu-test-package\bin;%PATH%
          set LIB=%CD%\gpu-test-package\lib;${{ runner.workspace }}\therock-dist\lib
          set L2_MODEL_DIR=${{ runner.workspace }}\l2-test-models
          if not exist "%L2_MODEL_DIR%" (
            echo [SKIP] L2 model directory not found: %L2_MODEL_DIR%
            exit /b 0
          )
          set FOUND=0
          for /r "%L2_MODEL_DIR%" %%M in (*.onnx) do set FOUND=1
          if "!FOUND!"=="0" (
            echo [SKIP] No .onnx models found in %L2_MODEL_DIR%
            exit /b 0
          )
          cd gpu-test-package\bin
          set FAILED=0
          for /r "%L2_MODEL_DIR%" %%M in (*.onnx) do (
            set "MDIR=%%~dpM"
            set "REL=!MDIR:%L2_MODEL_DIR%\=!"
            set "OUT=..\..\l2-results\!REL!%%~nM.txt"
            mkdir "..\..\l2-results\!REL!" 2>nul
            echo === L2 test: !REL!%%~nxM ===
            rd /s /q "%%~nM_o_dump" 2>nul
            rd /s /q "%%~nM_cpu_o_dump" 2>nul
            hip-onnx-runner.exe -m "%%M" -d 2 -s 42 > "!OUT!" 2>&1
            if errorlevel 1 (
              echo [ERROR] EP inference failed>> "!OUT!"
              type "!OUT!"
              set FAILED=1
            ) else (
              hip-onnx-runner.exe -m "%%M" -d 2 -s 42 -n >> "!OUT!" 2>&1
              if errorlevel 1 (
                echo [ERROR] CPU inference failed>> "!OUT!"
                type "!OUT!"
                set FAILED=1
              ) else (
                hip-onnx-runner.exe -L "%%~nM_o_dump,%%~nM_cpu_o_dump" >> "!OUT!" 2>&1
                type "!OUT!"
              )
            )
          )
          exit /b !FAILED!

      - name: Publish L2 results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $l2Dir = "l2-results"
          if (-not (Test-Path $l2Dir)) {
            Write-Host "No L2 results to publish (directory not found)"
            return
          }
          $files = Get-ChildItem $l2Dir -Recurse -Filter "*.txt" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "No L2 result files found"
            return
          }

          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $rawSha = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $sha = $rawSha.Substring(0, 7)
          $prNumber = "${{ github.event.pull_request.number }}"
          $threshold = 0.01
          $l2Root = (Resolve-Path $l2Dir).Path

          $tableRows = ""
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($l2Root.Length).TrimStart('\', '/')
            $model = $rel -replace '\.txt$', '' -replace '\\', '/'
            $content = Get-Content $f.FullName -Raw
            $l2Match = [regex]::Match($content, 'Combined L2 \(stacked diffs\):\s+([\d.eE+-]+)\s+\(total_elems:\s+(\d+),.*?skipped_nonfinite:\s+(\d+)\)')
            $errMatch = [regex]::Match($content, '\[ERROR\]\s*(.+)')
            if ($l2Match.Success) {
              $l2val = [double]$l2Match.Groups[1].Value
              $elems = $l2Match.Groups[2].Value
              $skipped = $l2Match.Groups[3].Value
              $tableRows += "| $model | $l2val | $elems | $skipped |`n"
            } elseif ($errMatch.Success) {
              $reason = $errMatch.Groups[1].Value.Trim()
              $tableRows += "| $model | $reason | - | - |`n"
            } else {
              $tableRows += "| $model | error | - | - |`n"
            }
          }

          $header = "## L2 Accuracy Results (EP vs CPU)`n`n" +
                    "| Model | Combined L2 | Total Elems | Skipped NaN/Inf |`n" +
                    "|-------|------------|------------|----------------|`n"
          $footer = "`nThreshold: $threshold | Run: [${{ github.run_number }}]($runUrl) - Commit: ``$sha``"
          $summary = $header + $tableRows + $footer

          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          if ("${{ github.event_name }}" -eq "pull_request" -and $prNumber) {
            $marker = "<!-- morphizen-l2-results -->"
            $body = "$marker`n$summary"

            $commentsJson = gh api "repos/${{ github.repository }}/issues/$prNumber/comments" 2>$null
            $ghOk = ($LASTEXITCODE -eq 0)
            $existing = $null
            if ($ghOk -and $commentsJson) {
              $comments = $commentsJson | ConvertFrom-Json
              $found = $comments | Where-Object { $_.body -and $_.body.StartsWith($marker) } | Select-Object -First 1
              if ($found) { $existing = $found.id }
            }

            if ($ghOk -and $existing) {
              Write-Host "Updating existing L2 PR comment $existing"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" `
                -f body="$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to update L2 PR comment" }
            } elseif ($ghOk) {
              Write-Host "Creating new L2 PR comment"
              gh pr comment $prNumber -R "${{ github.repository }}" --body "$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to create L2 PR comment" }
            } else {
              Write-Host "WARNING: gh api unreachable, skipping L2 PR comment"
            }
          }

      # Parse QPS from result files and publish:
      #   - PR trigger  → post/update a PR comment via gh CLI (github-actions[bot])
      #   - other trigger → write to GITHUB_STEP_SUMMARY only
      - name: Publish perf results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $resultsDir = "gpu-test-package/results"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $rawSha = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $sha = $rawSha.Substring(0, 7)
          $prNumber = "${{ github.event.pull_request.number }}"

          # Helper: build table rows from a results dir.
          # Each file: extract Number of inferences per second / Session
          # creation / 1st infer / Avg CPU / Peak WS for the standard
          # 6-column format (Model | QPS | Session (s) | 1st Infer (ms) |
          # CPU% | Mem (MB)).
          function Get-PerfRows($dir) {
            $rows = ""
            foreach ($f in (Get-ChildItem "$dir/*.txt" -ErrorAction SilentlyContinue)) {
              $model = $f.BaseName -replace '\.onnx$', ''
              $content = Get-Content $f.FullName -Raw
              $qpsMatch = [regex]::Match($content, 'Number of inferences per second:\s+([\d.]+)')
              $sessMatch = [regex]::Match($content, 'Session creation time cost:\s+([\d.]+)\s+s')
              $firstMatch = [regex]::Match($content, 'First inference time cost:\s+(\d+)\s+ms')
              $cpuMatch = [regex]::Match($content, 'Avg CPU usage:\s+(\d+)\s+%')
              $memMatch = [regex]::Match($content, 'Peak working set size:\s+(\d+)\s+bytes')
              $sess = if ($sessMatch.Success) { $sessMatch.Groups[1].Value } else { "-" }
              $first = if ($firstMatch.Success) { $firstMatch.Groups[1].Value } else { "-" }
              $cpu = if ($cpuMatch.Success) { $cpuMatch.Groups[1].Value } else { "-" }
              $memMB = if ($memMatch.Success) { "{0:F0}" -f ([double]$memMatch.Groups[1].Value / 1MB) } else { "-" }
              if ($qpsMatch.Success) {
                $qps = "{0:F2}" -f [double]$qpsMatch.Groups[1].Value
                $rows += "| $model | $qps | $sess | $first | $cpu | $memMB |`n"
              } else {
                $rows += "| $model | failed | $sess | $first | $cpu | $memMB |`n"
              }
            }
            return $rows
          }

          # Build table rows from result files
          $tableRows = Get-PerfRows $resultsDir
          if (-not $tableRows) { $tableRows = "| (no results) | - | - | - | - | - |`n" }

          $perfHeader = "| Model | QPS | Session (s) | 1st Infer (ms) | CPU% | Mem (MB) |`n" +
                        "|-------|----:|----:|----:|----:|----:|`n"
          $header = "## MorphiZen EP Performance Results`n`n" + $perfHeader

          # EPContext export/import perf tables (full_model_seq128 only).
          $epctxExportRows = Get-PerfRows "gpu-test-package/results-epctx-export"
          $epctxImportRows = Get-PerfRows "gpu-test-package/results-epctx-import"
          $epctxSection = ""
          if ($epctxExportRows) {
            $epctxSection += "`n## EPContext Export Performance`n`n" + $perfHeader + $epctxExportRows
          }
          if ($epctxImportRows) {
            $epctxSection += "`n## EPContext Import Performance`n`n" + $perfHeader + $epctxImportRows
          }

          # --- OGA benchmark results ---
          $ogaRows = ""
          foreach ($f in (Get-ChildItem "oga-results/*.txt" -ErrorAction SilentlyContinue)) {
            $model = $f.BaseName
            $content = Get-Content $f.FullName -Raw
            $ttftMatch = [regex]::Match($content, 'Prompt processing \(time to first token\):\s*\n\s*avg \(us\):\s+([\d.]+)')
            $tpsMatch  = [regex]::Match($content, 'Token generation:\s*\n\s*avg \(us\):\s+([\d.]+)\s*\n\s*avg \(tokens/s\):\s+([\d.]+)')
            $memMatch  = [regex]::Match($content, 'Peak working set size \(bytes\):\s+(\d+)')
            $ttft = if ($ttftMatch.Success) { "{0:F1}" -f ([double]$ttftMatch.Groups[1].Value / 1000) } else { "-" }
            $tps  = if ($tpsMatch.Success) { "{0:F1}" -f [double]$tpsMatch.Groups[2].Value } else { "-" }
            $mem  = if ($memMatch.Success) { "{0:F2}" -f ([double]$memMatch.Groups[1].Value / 1GB) } else { "-" }
            $ogaRows += "| $model | 1 | 5 | 128 | 128 | $ttft | $tps | $mem |`n"
          }
          $ogaSection = ""
          if ($ogaRows) {
            $ogaSection = "`n## OGA Benchmark Results`n`n" +
                          "| Model | Warmup | Reps | Prompt Len | Gen Tokens | TTFT (ms) | TPS | Peak Mem (GB) |`n" +
                          "|-------|----:|----:|----:|----:|----:|----:|----:|`n" +
                          $ogaRows
          }

          $footer = "`nRun: [${{ github.run_number }}]($runUrl) - Commit: ``$sha``"
          $summary = $header + $tableRows + $epctxSection + $ogaSection + $footer

          # Always write to step summary and log
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          # On pull_request events, also post/update a PR comment via gh CLI.
          # Errors are non-fatal — step summary is already written above.
          if ("${{ github.event_name }}" -eq "pull_request" -and $prNumber) {
            $marker = "<!-- morphizen-perf-results -->"
            $body = "$marker`n$summary"

            # Find existing comment with marker using PowerShell JSON parsing (avoids jq escaping issues)
            $commentsJson = gh api "repos/${{ github.repository }}/issues/$prNumber/comments" 2>$null
            $ghOk = ($LASTEXITCODE -eq 0)
            $existing = $null
            if ($ghOk -and $commentsJson) {
              $comments = $commentsJson | ConvertFrom-Json
              $found = $comments | Where-Object { $_.body -and $_.body.StartsWith($marker) } | Select-Object -First 1
              if ($found) { $existing = $found.id }
            }

            if ($ghOk -and $existing) {
              Write-Host "Updating existing PR comment $existing"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" `
                -f body="$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to update PR comment" }
            } elseif ($ghOk) {
              Write-Host "Creating new PR comment"
              gh pr comment $prNumber -R "${{ github.repository }}" --body "$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to create PR comment" }
            } else {
              Write-Host "WARNING: gh api unreachable, skipping PR comment"
            }
          }
