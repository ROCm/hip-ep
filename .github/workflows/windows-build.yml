name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  build-windows:
    # windows-latest now serves the VS 2026 (VS 18) image, under which the
    # pinned onnxruntime-genai / onnxruntime_extensions fails to build
    # (gsl/util C2220 warning-as-error). Pin to the VS 2022 image per
    # actions/runner-images#14017.
    runs-on: windows-2022
    # Single build for all gfx115x targets: cmake/deps.cmake auto-downloads TheRock
    # from the first HIP_ARCHITECTURES entry (gfx1151); lib/Runtime/Kernels emits
    # one custom_kernels_<arch>.dll per arch into install/bin/, all staged into
    # one gpu-test-package artifact.
    # Cancel the build job when a newer commit lands on the same PR ref to
    # save runner minutes. gpu-test deliberately does NOT inherit this rule
    # (see its own concurrency block below) so an in-progress GPU run keeps
    # going to completion even if a newer build supersedes it.
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      # LLVM/MLIR/LLD are built from source at this upstream release tag.
      # Bumping it only invalidates the llvm-install cache. NOTE: this is NOT
      # the morphizen FetchContent fallback pin (cmake/deps.txt) -- the project
      # resolves LLVM via find_package against this build, so that fallback is
      # unused.
      LLVM_TAG: llvmorg-22.1.0
      ONNXRUNTIME_VERSION: "1.27.0"
      # Space-separated list of microsoft/onnxruntime PR numbers to fetch
      # from github.com/microsoft/onnxruntime/pull/<n>.patch and `git apply`
      # on top of the pinned ONNXRUNTIME_VERSION tag during the source-build
      # step. The PR list is also part of the ort-install cache key, so
      # editing this list auto-invalidates the cached ORT install prefix.
      # Remove a PR number once its fix is in the pinned ONNXRUNTIME_VERSION.
      ONNXRUNTIME_PR_PATCHES: ""
      SCCACHE_GHA_ENABLED: "true"
      # Fork branch carrying AMDGPU MorphiZen integration (former PR 2194) plus
      # sliding_window support.
      OGA_REPO: "cliu1003/onnxruntime-genai"
      OGA_REF: "sliding_window_support_amdgpu"
      # Optional space-separated microsoft/onnxruntime-genai PR numbers applied
      # on top of the fork checkout via pull/<n>.patch + git am. Empty when the
      # fork branch already carries the needed integration.
      OGA_PR_PATCHES: ""
      # ilammy/msvc-dev-cmd and mozilla-actions/sccache-action have no
      # Node.js 24 releases yet; allow Node.js 20 until they are updated.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      # gfx1151 first: TheRock tarball selection, NATIVE default import lib, and
      # wheel rocm index hint all take the first list entry (see cmake/deps.cmake).
      HIP_ARCHITECTURES: "gfx1151;gfx1152;gfx1150"

    steps:
      # MorphiZen is vendored in-tree as a git subtree under morphizen,
      # so no deploy key or submodule initialization is needed.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          show-progress: false

      # -----------------------------------------------------------------------
      # Per-dependency caches. Each dep is built from source into its own
      # ${{ runner.workspace }}/<dep>-install prefix and cached separately so a
      # version bump of one dep does not invalidate the others. The configure
      # step lists all of them on CMAKE_PREFIX_PATH (no merge/copy).
      #
      # The llvm/protobuf/flatbuffers/gtest caches are byte-identical to the
      # ones produced by windows-build-mock.yml, so their keys are shared
      # across both workflows -- whichever job builds a dep first populates
      # the cache for both, and the expensive LLVM cold build runs once.
      # Only the ORT cache differs per-PR via the patched-PR list.
      # -----------------------------------------------------------------------
      - name: Cache ort-install
        id: cache-ort
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/ort-install
          # `ortpr-<list>` embeds ONNXRUNTIME_PR_PATCHES verbatim so editing
          # the patched-PR set auto-invalidates the cached ORT prefix.
          key: dep-ort-${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}

      - name: Cache llvm-install
        id: cache-llvm
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: dep-llvm-${{ env.LLVM_TAG }}

      - name: Setup Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Install pip dependencies
        run: pip install lit requests

      # Put cl.exe and ninja.exe (bundled with VS) into PATH
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Cache compilation results across runs via GitHub Actions Cache backend
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # -----------------------------------------------------------------------
      # Build LLVM/MLIR/LLD/Clang from source into llvm-install.
      # Projects clang;mlir;lld, X86 backend only. The EP find_package()s
      # LLVM/MLIR/LLD and lib/Target/LLVM links X86 codegen + lldCOFF/lldCommon
      # for the in-process COFF DLL linker; clang is shipped so lib/Runtime's
      # runtime-bitcode step uses a version-matched clang from the prefix (and
      # so this build stays identical to cmake/deps.cmake's from-source
      # fallback). /MT matches the toolchain; RTTI on, zlib/zstd off.
      # LLVM_INSTALL_UTILS=ON ships FileCheck (+ not/count) for the LIT suite.
      # Cold build is multi-hour (clang dominates); sccache + the shared
      # llvm-install cache amortize it.
      # -----------------------------------------------------------------------
      - name: Build LLVM/MLIR/LLD from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SRC="${{ runner.workspace }}/llvm-project"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/llvm/llvm-project.git
          git -C "$SRC" fetch --depth 1 origin "${{ env.LLVM_TAG }}"
          git -C "$SRC" checkout FETCH_HEAD
          cmake -G Ninja -S "$SRC/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="${{ runner.workspace }}/llvm-install" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install

      # -----------------------------------------------------------------------
      # Build ONNX Runtime from source and install into ort-install.
      # Produces both the ORT shared library (build-time dep for onnx-hipdnn-ep)
      # and onnxruntime_perf_test.exe (GPU test tool).
      # Requires MSVC env; placed after Setup MSVC (same pattern as GTest).
      # Clone and build are skipped when the ORT build cache hits.
      # -----------------------------------------------------------------------
      - name: Checkout ONNX Runtime v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Microsoft/onnxruntime
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          path: source-onnxruntime
          submodules: true
          fetch-depth: 1
          show-progress: false

      # Fetch and apply microsoft/onnxruntime PR patches listed in
      # ONNXRUNTIME_PR_PATCHES (env). Each PR's `.patch` endpoint returns the
      # git format-patch mailbox for the PR's current head, which we apply on
      # top of the pinned ONNXRUNTIME_VERSION tag. The cache key on
      # `ort-install` includes the PR list, so adding/removing a PR
      # number forces a rebuild. The source-onnxruntime tree itself is not
      # cached, so a fresh checkout always lands here clean and patches
      # apply directly. No idempotency needed.
      - name: Apply ONNX Runtime PR patches
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-onnxruntime
        env:
          ORT_PRS: ${{ env.ONNXRUNTIME_PR_PATCHES }}
        run: |
          $prs = $env:ORT_PRS.Trim()
          if (-not $prs) {
            Write-Host "ONNXRUNTIME_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "ort-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Build ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "${{ github.workspace }}\source-onnxruntime"
          call build.bat ^
            --config Release ^
            --build_shared_lib ^
            --parallel ^
            --compile_no_warning_as_error ^
            --skip_submodule_sync ^
            --build_dir "${{ runner.workspace }}\build-onnxruntime" ^
            --skip_tests ^
            --disable_memleak_checker ^
            --use_dml ^
            --cmake_generator Ninja ^
            --build_wheel

      - name: Install ORT into ort-install
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install "${{ runner.workspace }}/build-onnxruntime/Release" \
            --prefix "${{ runner.workspace }}/ort-install"
          # perf_test is not a cmake install target; copy manually so it lands
          # in ort-install (cached) rather than the ephemeral build directory.
          PERF_TEST=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in build tree"
            exit 1
          fi
          cp "$PERF_TEST" "${{ runner.workspace }}/ort-install/bin/"
          # DirectML.dll is not installed by cmake --install; copy manually.
          DML_DLL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -path "*/x64-win/DirectML.dll" -type f | head -1)
          if [ -z "$DML_DLL" ]; then
            echo "ERROR: DirectML.dll not found in build tree"
            exit 1
          fi
          cp "$DML_DLL" "${{ runner.workspace }}/ort-install/bin/"
          # Cache the cp314 ORT Python wheel inside ort-install so it
          # rides the same cache key as the rest of the ORT artifacts.
          # Output path: build-onnxruntime/Release/dist/onnxruntime_directml-1.27.0-cp314-cp314-win_amd64.whl
          ORT_WHEEL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ]; then
            echo "ERROR: onnxruntime_directml wheel not found in build tree"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/ort-install/wheels"
          cp "$ORT_WHEEL" "${{ runner.workspace }}/ort-install/wheels/"
          echo "Cached ORT wheel: $(basename "$ORT_WHEEL")"

      # -----------------------------------------------------------------------
      # protobuf, flatbuffers and gtest are no longer pre-built here -- they are
      # resolved by cmake/deps.cmake during Configure/Build (find_package first,
      # from-source FetchContent fallback, sccache-accelerated).
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # Build the AMD GPU umbrella EP (onnxruntime-ep-amdgpu) + hip-backend
      # shim from the fork's PR branch. USE_AMDGPU forces DML/MIGraphX off and
      # HIPGPU on (no MIGraphX SDK needed); the shim loads hipgpu.dll (the
      # morphizen EP, renamed via cmake/deps.cmake). Built against ort-install.
      # Commit is pinned; bump it (and the cache key below) when the fork moves.
      #
      # Built BEFORE onnx-hipdnn-ep so its wheel target can bundle amdgpu-ep.dll
      # + hip-backend.dll (HIP_WHEEL_EXTRA_DLLS below). amdgpu-ep only
      # links ort-install, so it has no dependency on the onnx-hipdnn-ep build.
      # -----------------------------------------------------------------------
      - name: Cache amdgpu-ep build
        id: cache-amdgpu
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/build-amdgpu
          # amdgpu-ep/hip-backend link against the patched ort-install, so the
          # key folds in the pinned fork commit + ORT version/PR list; bumping
          # any of them forces a rebuild. On a hit the checkout + build below are
          # skipped and the staging step finds the cached DLLs in build-amdgpu.
          key: dep-amdgpu-a1318ed-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}

      - name: Checkout amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: zz002/onnxruntime-ep-amdgpu
          ref: a1318edb3c5b87d539bd797eff3addaa7ba2ddda
          path: source-amdgpu
          fetch-depth: 1
          show-progress: false

      - name: Build amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # onnxruntime-ep-amdgpu requires CMake >= 4.2; the runner's system
          # cmake is 3.31, so use a pip-provided cmake for this build.
          python -m pip install -q "cmake>=4.2"
          CMAKE="$(python -c "import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake.exe'))")"
          echo "Using $("$CMAKE" --version | head -1)"
          "$CMAKE" -G Ninja -S source-amdgpu -B "${{ runner.workspace }}/build-amdgpu" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_AMDGPU=ON \
            -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/ort-install" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          "$CMAKE" --build "${{ runner.workspace }}/build-amdgpu" --target amdgpu-ep hip-ep

      # -----------------------------------------------------------------------
      # Build onnx-hipdnn-ep via the cross-platform build.py (same driver
      # as the Linux CI and docs/quick_start.md). Cached LLVM/ORT prefixes are
      # injected; protobuf/flatbuffers build from source and TheRock auto-downloads
      # via cmake/deps.cmake. build.py's default build/install dirs resolve to
      # ${{ runner.workspace }}/build/<repo> and ${{ runner.workspace }}/install
      # (repo.parent), matching what the later staging step expects. The LIT tests
      # run inside build.py after install.
      #
      # HIP_WHEEL_EXTRA_DLLS feeds the wheel target the amdgpu-ep.dll +
      # hip-backend.dll built above, so the morphizen wheel ships the whole
      # AMD GPU umbrella chain in onnxruntime/capi/ next to hipgpu.dll.
      # -----------------------------------------------------------------------
      - name: Build onnx-hipdnn-ep
        shell: bash
        run: |
          AMDGPU_BUILD="${{ runner.workspace }}/build-amdgpu"
          AMDGPU_EP=$(find "$AMDGPU_BUILD" -name "amdgpu-ep.dll" -type f | head -1)
          HIP_BACKEND=$(find "$AMDGPU_BUILD" -name "hip-backend.dll" -type f | head -1)
          echo "amdgpu-ep.dll:     $AMDGPU_EP"
          echo "hip-backend.dll: $HIP_BACKEND"
          python build.py \
            --config Release \
            --cmake_generator Ninja \
            --hip_arch "${{ env.HIP_ARCHITECTURES }}" \
            --cmake_prefix_path "${{ runner.workspace }}/ort-install;${{ runner.workspace }}/llvm-install" \
            --cmake_extra_defines CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            --cmake_extra_defines "HIP_WHEEL_EXTRA_DLLS=$AMDGPU_EP;$HIP_BACKEND"

      # -----------------------------------------------------------------------
      # Build OGA (onnxruntime-genai) for model_benchmark.exe
      # Cache only the two artifacts we need: model_benchmark.exe and
      # onnxruntime-genai.dll, keyed on OGA commit + ORT version.
      # -----------------------------------------------------------------------
      - name: Cache OGA artifacts
        id: cache-oga
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          # OGA is built against the patched ort-install, so the key folds in
          # the fork ref, optional OGA_PR_PATCHES, and ONNXRUNTIME_PR_PATCHES.
          # The mm<N> token bumps when the OGA artifact set changes shape.
          key: oga-dml-mm3-${{ env.OGA_REPO }}-${{ env.OGA_REF }}-pr${{ env.OGA_PR_PATCHES }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}

      # OGA is built from cliu1003/onnxruntime-genai sliding_window_support_amdgpu
      # (AMDGPU MorphiZen integration + sliding_window). Optional OGA_PR_PATCHES
      # apply extra upstream PRs on top of the fork checkout.
      - name: Checkout OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.OGA_REPO }}
          ref: ${{ env.OGA_REF }}
          path: source-oga
          submodules: true
          fetch-depth: 1
          show-progress: false

      # Fetch and apply microsoft/onnxruntime-genai PR patches listed in
      # OGA_PR_PATCHES (env), mirroring the ONNX Runtime PR patch step. The
      # source-oga tree is a fresh checkout so patches apply directly; the OGA
      # cache key includes the PR list, so editing it forces a rebuild.
      - name: Apply OGA PR patches
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-oga
        env:
          OGA_PRS: ${{ env.OGA_PR_PATCHES }}
        run: |
          $prs = $env:OGA_PRS.Trim()
          if (-not $prs) {
            Write-Host "OGA_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          # pull/<n>.patch is a format-patch series; apply with `git am` so that
          # intra-series file renames (morphizen_ep -> amdgpu) replay against the
          # correct intermediate tree. `git apply` flattens the series and chokes
          # on the rename whose pre-image only exists after an earlier commit.
          git config user.email "ci@rocm.amd.com"
          git config user.name "ROCm CI"
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime-genai/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "oga-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git am --3way --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              git am --abort
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Prepare ORT_HOME for OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ORT_HOME="${{ runner.workspace }}/oga-ort-home"
          mkdir -p "$ORT_HOME/include" "$ORT_HOME/lib"
          PREBUILT="${{ runner.workspace }}/ort-install"
          cp -r "$PREBUILT/include/onnxruntime/"* "$ORT_HOME/include/"
          cp "$PREBUILT/lib/"onnxruntime*.lib "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime.dll" "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" "$ORT_HOME/lib/"
          echo "ORT_HOME=$ORT_HOME" >> "$GITHUB_ENV"

      - name: Build OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python "${{ github.workspace }}/source-oga/build.py" \
            --config Release \
            --cmake_generator Ninja \
            --use_dml \
            --ort_home "$ORT_HOME" \
            --skip_tests --skip_examples \
            --parallel \
            --build_dir "${{ runner.workspace }}/build-oga" \
            --cmake_extra_defines \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          mkdir -p "${{ runner.workspace }}/oga-artifacts"
          OGA_OUT="${{ runner.workspace }}/build-oga/Release"
          cp "$OGA_OUT/benchmark/c/model_benchmark.exe" "${{ runner.workspace }}/oga-artifacts/"
          cp "$OGA_OUT/onnxruntime-genai.dll" "${{ runner.workspace }}/oga-artifacts/"
          # Cache the cp314 OGA Python wheel alongside the other OGA artifacts.
          # Output path: build-oga/Release/wheel/onnxruntime_genai_directml-0.13.0.dev0-cp314-cp314-win_amd64.whl
          OGA_WHEEL=$(find "${{ runner.workspace }}/build-oga" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: onnxruntime_genai_directml wheel not found in build tree"
            exit 1
          fi
          cp "$OGA_WHEEL" "${{ runner.workspace }}/oga-artifacts/"
          echo "Cached OGA wheel: $(basename "$OGA_WHEEL")"

          # Cache the Python e2e benchmark scripts (benchmark_e2e.py + its metrics
          # helper) so the gpu-test wheel smoke can run them without an OGA source
          # checkout (which only happens on a cache miss).
          mkdir -p "${{ runner.workspace }}/oga-artifacts/benchmark-python"
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_e2e.py" \
             "${{ github.workspace }}/source-oga/benchmark/python/metrics.py" \
             "${{ runner.workspace }}/oga-artifacts/benchmark-python/"

          # build.py --skip_examples leaves examples/c unbuilt. Build only
          # model_mm (the multimodal example used by VL model CI) as a standalone
          # cmake project against the just-built OGA lib + ORT_HOME. build.py's
          # build_examples ignores CXXFLAGS, so set -DCMAKE_CXX_FLAGS=-FS here to
          # force synchronous compiler-PDB writes (parallel model_mm.cpp /
          # common.cpp otherwise clash on vc140.pdb -> C1041).
          cmake -S "${{ github.workspace }}/source-oga/examples/c" \
            -B "${{ runner.workspace }}/build-oga-examples" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODEL_MM=ON -DCMAKE_CXX_FLAGS=-FS \
            -DORT_INCLUDE_DIR="$ORT_HOME/include" \
            -DORT_LIB_DIR="$ORT_HOME/lib" \
            -DOGA_INCLUDE_DIR="${{ github.workspace }}/source-oga/src" \
            -DOGA_LIB_DIR="$OGA_OUT"
          cmake --build "${{ runner.workspace }}/build-oga-examples" --target model_mm
          cp "${{ runner.workspace }}/build-oga-examples/model_mm.exe" \
            "${{ runner.workspace }}/oga-artifacts/"

          # benchmark_multimodal.py drives model_mm for the VL benchmark.
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_multimodal.py" \
            "${{ runner.workspace }}/oga-artifacts/"

      # -----------------------------------------------------------------------
      # Stage GPU test package:
      #   staging/bin/    – executables + DLLs needed at runtime on the GPU box
      #   staging/models/ – ONNX test model
      #   staging/morphizen_config.json
      # -----------------------------------------------------------------------
      - name: Stage GPU test package
        shell: bash
        run: |
          mkdir -p staging/bin staging/lib

          # onnxruntime_perf_test.exe + onnxruntime.dll – from ort-install
          PREBUILT="${{ runner.workspace }}/ort-install"
          PERF_TEST=$(find "$PREBUILT" -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in $PREBUILT"
            exit 1
          fi
          cp "$PERF_TEST" staging/bin/

          # ORT DLLs + DirectML.dll – from the install prefix
          cp "$PREBUILT/bin/onnxruntime.dll" staging/bin/
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" staging/bin/
          cp "$PREBUILT/bin/DirectML.dll" staging/bin/

          # MorphiZen EP DLL + per-arch custom_kernels_gfx<arch>.dll + other
          # install DLLs/EXEs (kernel DLL must sit next to the EP DLL so
          # LlvmIrJit's GetModuleFileName-anchored Load finds it).
          cp "${{ runner.workspace }}/install/bin/"*.dll staging/bin/ 2>/dev/null || true
          cp "${{ runner.workspace }}/install/bin/"*.exe staging/bin/ 2>/dev/null || true

          # AMD GPU umbrella EP + hip-backend shim (built from the fork PR
          # above). The umbrella loads hip-backend.dll, which loads hipgpu.dll
          # (the morphizen EP, already copied from install/bin). All three sit
          # together in staging/bin so the load chain resolves.
          AMDGPU_BUILD="${{ runner.workspace }}/build-amdgpu"
          AMDGPU_EP=$(find "$AMDGPU_BUILD" -name "amdgpu-ep.dll" -type f | head -1)
          HIP_BACKEND=$(find "$AMDGPU_BUILD" -name "hip-backend.dll" -type f | head -1)
          if [ -z "$AMDGPU_EP" ] || [ -z "$HIP_BACKEND" ]; then
            echo "ERROR: amdgpu-ep.dll or hip-backend.dll not found in $AMDGPU_BUILD"
            exit 1
          fi
          cp "$AMDGPU_EP" staging/bin/
          cp "$HIP_BACKEND" staging/bin/

          # Smoke: every per-arch kernel DLL must be present in staging/bin/
          # (LlvmIrJit dlopens custom_kernels_<gcnArchName>.dll at runtime).
          # Failure here means the install rule in lib/Runtime/Kernels/CMakeLists.txt
          # regressed or HIP_ARCHITECTURES was trimmed.
          IFS=';' read -ra HIP_ARCHS <<< "${{ env.HIP_ARCHITECTURES }}"
          for arch in "${HIP_ARCHS[@]}"; do
            KERNEL_DLL="staging/bin/custom_kernels_${arch}.dll"
            if [ ! -f "$KERNEL_DLL" ]; then
              echo "ERROR: $KERNEL_DLL missing from install (HIP_ARCHITECTURES=${{ env.HIP_ARCHITECTURES }})"
              ls -1 "${{ runner.workspace }}/install/bin/" || true
              exit 1
            fi
            echo "OK: $(basename "$KERNEL_DLL") present"
          done

          # Import libraries that get bundled into the MorphiZen JIT-linker
          # path. Kept as a glob so the set evolves with the install rules
          # without touching this workflow each time.
          cp "${{ runner.workspace }}/install/lib/"*.lib staging/lib/ 2>/dev/null || true

          THEROCK_DIR="../build/$(basename "$PWD")/_therock"
          for dll in amdhip64_7.dll MIOpen.dll amd_comgr0702.dll rocblas.dll \
                     libhipblaslt.dll hiprtc0702.dll hiprtc-builtins0702.dll \
                     hipdnn_backend.dll; do
            cp "$THEROCK_DIR/bin/$dll" staging/bin/
          done
          for data in hipblaslt rocblas; do
            cp -r "$THEROCK_DIR/bin/$data" staging/bin/
          done
          for lib in amdhip64.lib MIOpen.lib libhipblaslt.dll.a; do
            cp "$THEROCK_DIR/lib/$lib" staging/lib/
          done

          # MorphiZen EP config
          cp etc/morphizen_config.json staging/

          # ---------------------------------------------------------------
          # Package MSVC/WinSDK release CRT import libraries for lld-link.
          # The MorphiZen JIT compiler links against the release CRT (/MD),
          # so the GPU test machine does not need VS Build Tools installed.
          # ilammy/msvc-dev-cmd (already run above) sets VCToolsInstallDir,
          # WindowsSdkDir, and WindowsSDKVersion in the environment.
          # ---------------------------------------------------------------
          MSVC_LIB="$(cygpath -u "$VCToolsInstallDir")/lib/x64"
          UCRT_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/ucrt/x64"
          UM_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/um/x64"
          echo "MSVC lib: $MSVC_LIB"
          echo "UCRT lib: $UCRT_LIB"
          echo "UM lib:   $UM_LIB"
          for lib in msvcrt.lib ucrt.lib vcruntime.lib oldnames.lib \
                     libcpmt.lib libcmt.lib kernel32.lib user32.lib; do
            src=$(find "$MSVC_LIB" "$UCRT_LIB" "$UM_LIB" \
                    -maxdepth 1 -iname "$lib" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp "$src" staging/lib/
              echo "  Packaged: $lib <- $src"
            else
              echo "  WARNING: $lib not found"
            fi
          done

          # ---------------------------------------------------------------
          # OGA artifacts: model_benchmark.exe + onnxruntime-genai.dll, plus
          # model_mm.exe + benchmark_multimodal.py for the VL model tests.
          # ---------------------------------------------------------------
          cp "${{ runner.workspace }}/oga-artifacts/model_benchmark.exe" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/onnxruntime-genai.dll" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/model_mm.exe" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/benchmark_multimodal.py" staging/bin/

          # ---------------------------------------------------------------
          # Python wheels (ORT + OGA cp314) bundled into the artifact under
          # staging/wheels/. Both are cached inside ort-install / oga-artifacts,
          # so cache hits restore them without rebuilding ORT / OGA.
          # ---------------------------------------------------------------
          mkdir -p staging/wheels
          ORT_WHEEL=$(find "${{ runner.workspace }}/ort-install/wheels" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          OGA_WHEEL=$(find "${{ runner.workspace }}/oga-artifacts" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ] || [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: cp314 wheel(s) missing from cache"
            echo "  ORT: $ORT_WHEEL"
            echo "  OGA: $OGA_WHEEL"
            exit 1
          fi
          cp "$ORT_WHEEL" staging/wheels/
          cp "$OGA_WHEEL" staging/wheels/

          echo "=== Staged package contents ==="
          find staging/ -type f | sort

      - name: Upload GPU test package
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-package
          path: staging/
          retention-days: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 14 || 3 }}

      - name: Stage Python wheel package
        shell: bash
        env:
          VLM_BENCHMARK_REF: f02a82c8312224ef3e2f673c4c6569d487d47e64
        run: |
          mkdir -p wheelpkg/wheels
          ORT_WHEEL=$(find "${{ runner.workspace }}/ort-install/wheels" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          OGA_WHEEL=$(find "${{ runner.workspace }}/oga-artifacts" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          EP_WHEEL=$(find "../build/$(basename "$PWD")/python/dist" \
            -name "onnxruntime_ep_hip-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ] || [ -z "$OGA_WHEEL" ] || [ -z "$EP_WHEEL" ]; then
            echo "ERROR: wheel(s) missing"
            echo "  ORT=$ORT_WHEEL OGA=$OGA_WHEEL EP=$EP_WHEEL"
            exit 1
          fi
          cp "$ORT_WHEEL" "$OGA_WHEEL" "$EP_WHEEL" wheelpkg/wheels/
          cp python/examples/run_onnx.py wheelpkg/
          cp "${{ runner.workspace }}/oga-artifacts/benchmark-python/"*.py wheelpkg/
          curl -fsSL --retry 3 -o wheelpkg/vlm_benchmark.py \
            "https://raw.githubusercontent.com/amd/RyzenAI-SW/$VLM_BENCHMARK_REF/LLM-examples/VLM/vlm_benchmark.py"
          echo "=== Python wheel package layout ==="
          find wheelpkg/ -maxdepth 2 -mindepth 1 | sort

      - name: Upload Python wheel package
        uses: actions/upload-artifact@v4
        with:
          name: hip-python-package
          path: wheelpkg/
          retention-days: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 14 || 3 }}

  # ---------------------------------------------------------------------------
  # GPU test job: runs on the self-hosted machine with a real AMD GPU.
  # Downloads the package built above and runs onnxruntime_perf_test.
  # ---------------------------------------------------------------------------
  gpu-test:
    needs: build-windows
    runs-on: StrixHalo
    # Never cancel an in-progress GPU run: queue newer runs of the same ref
    # behind it instead of killing the long-running perf / OGA / L2 suites.
    # The self-hosted StrixHalo runner already serializes physically, so
    # this group only adds explicit logical queueing for clarity.
    concurrency:
      group: gpu-test-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Clean workspace
        shell: cmd
        run: |
          taskkill /f /im hip-onnx-runner.exe >nul 2>&1 || ver >nul
          taskkill /f /im onnxruntime_perf_test.exe >nul 2>&1 || ver >nul
          taskkill /f /im model_benchmark.exe >nul 2>&1 || ver >nul
          if exist gpu-test-package rd /s /q gpu-test-package
          if exist l2-results rd /s /q l2-results
          if exist oga-results rd /s /q oga-results
          if exist oga-smoke-venv rd /s /q oga-smoke-venv
          if exist oga-smoke-results rd /s /q oga-smoke-results
          if exist wheelpkg rd /s /q wheelpkg

      - name: Download GPU test package
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-package
          path: gpu-test-package

      - name: Download Python wheel package
        uses: actions/download-artifact@v4
        with:
          name: hip-python-package
          path: wheelpkg

      - name: Run onnxruntime_perf_test (GPU)
        shell: cmd
        run: |
          set PATH=%CD%\gpu-test-package\bin;%PATH%
          set MODEL_DIR=${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\model
          if not exist "%MODEL_DIR%" (
            echo [ERROR] MODEL_DIR not found: %MODEL_DIR%
            exit /b 1
          )
          set FOUND=0
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do set FOUND=1
          if "%FOUND%"=="0" (
            echo [ERROR] No *seq128.onnx models found in %MODEL_DIR%
            exit /b 1
          )
          set FAILED=0
          cd gpu-test-package\bin
          mkdir ..\results 2>nul
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do (
            echo === Testing %%~nxM ===
            onnxruntime_perf_test.exe ^
              --plugin_ep_libs "hipgpu|hipgpu.dll" ^
              --plugin_eps "hipgpu" ^
              --plugin_ep_options "config_file|..\morphizen_config.json" ^
              -C "session.disable_cpu_ep_fallback|1" ^
              -t 30 -c 1 -s ^
              "%%M" > "..\results\%%~nxM.txt" 2>&1
            type "..\results\%%~nxM.txt"
            if errorlevel 1 set FAILED=1
          )
          exit /b %FAILED%

      # ----------------------------------------------------------------------
      # Native artifact smoke test (artifact_format=NATIVE), direct hipgpu EP.
      # Exercises the dual-format path: CompilerDriver emits a per-model .dll
      # (lld-link in-process), InferenceState loads it via morphizen::Plugin
      # (LoadLibrary). LLVM IR stays the production default; native is opt-in.
      # lld-link consumes the MSVC/UCRT release CRT import libs + hipdnn-ep-tls.lib
      # staged into gpu-test-package/lib (+ LIB) to link the model .dll. This is
      # now a real gate (no exit /b 0): if native breaks, the job fails.
      # ----------------------------------------------------------------------
      - name: Run native-artifact smoke test (GPU)
        if: always()
        shell: cmd
        run: |
          set THEROCK_DIST=%CD%\gpu-test-package
          set PATH=%CD%\gpu-test-package\bin;%PATH%
          set LIB=%CD%\gpu-test-package\lib
          set MODEL_DIR=${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\model
          if not exist "%MODEL_DIR%" (
            echo [SKIP] MODEL_DIR not found: %MODEL_DIR%
            exit /b 0
          )
          cd gpu-test-package\bin
          mkdir ..\results-native 2>nul
          rem Smoke, not a benchmark: first seq128 model, ONE inference (-r 1).
          rem Exercises native compile -> link -> load -> execute end-to-end
          rem without a full perf sweep (native is opt-in / non-production; the
          rem LLVM-IR default path is what the perf jobs above measure).
          set "SMOKE_MODEL="
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do if not defined SMOKE_MODEL set "SMOKE_MODEL=%%M"
          if not defined SMOKE_MODEL (
            echo [SKIP] no *seq128.onnx model under %MODEL_DIR%
            exit /b 0
          )
          echo === Native smoke %SMOKE_MODEL% ===
          onnxruntime_perf_test.exe ^
            --plugin_ep_libs "hipgpu|hipgpu.dll" ^
            --plugin_eps "hipgpu" ^
            --plugin_ep_options "config_file|..\morphizen_config.json artifact_format|NATIVE" ^
            -C "session.disable_cpu_ep_fallback|1" ^
            -r 1 -c 1 -s ^
            "%SMOKE_MODEL%" > "..\results-native\smoke.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "..\results-native\smoke.txt"
          rem Real gate: hipdnn-ep-tls.lib is now staged into gpu-test-package/lib
          rem so the NATIVE compile -> lld-link -> load -> execute path must pass.
          exit /b %RC%

      # ----------------------------------------------------------------------
      # AMD GPU umbrella NATIVE smoke test: same NATIVE compile/link/load path,
      # but driven through the amdgpu-ep umbrella instead of the hipgpu EP
      # directly. profile=hip (an umbrella option, ep.amdgpuexecutionprovider.
      # prefix) selects the hipgpu backend; the umbrella forwards non-umbrella
      # session-config entries verbatim, so artifact_format is passed as a raw
      # ep.hipgpu.* entry to reach the backend. Real gate (no exit /b 0).
      # ----------------------------------------------------------------------
      - name: Run AMD GPU umbrella native smoke test (GPU)
        if: always()
        shell: cmd
        run: |
          set THEROCK_DIST=%CD%\gpu-test-package
          set PATH=%CD%\gpu-test-package\bin;%PATH%
          set LIB=%CD%\gpu-test-package\lib
          set MODEL_DIR=${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\model
          if not exist "%MODEL_DIR%" (
            echo [SKIP] MODEL_DIR not found: %MODEL_DIR%
            exit /b 0
          )
          cd gpu-test-package\bin
          mkdir ..\results-amdgpu-native 2>nul
          set "SMOKE_MODEL="
          for /r "%MODEL_DIR%" %%M in (*seq128.onnx) do if not defined SMOKE_MODEL set "SMOKE_MODEL=%%M"
          if not defined SMOKE_MODEL (
            echo [SKIP] no *seq128.onnx model under %MODEL_DIR%
            exit /b 0
          )
          echo === AMD GPU umbrella native smoke %SMOKE_MODEL% ===
          onnxruntime_perf_test.exe ^
            --plugin_ep_libs "AMDGPUExecutionProvider|amdgpu-ep.dll" ^
            --plugin_eps "AMDGPUExecutionProvider" ^
            --plugin_ep_options "profile|hip" ^
            -C "session.disable_cpu_ep_fallback|1" ^
            -C "ep.hipgpu.artifact_format|NATIVE" ^
            -r 1 -c 1 -s ^
            "%SMOKE_MODEL%" > "..\results-amdgpu-native\smoke.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "..\results-amdgpu-native\smoke.txt"
          exit /b %RC%

      # ----------------------------------------------------------------------
      # EPContext export + import perf test (PR #132 constants-file-in-tar path).
      # Limited to full_model_seq128 to bound runtime: each model triggers
      # one export pass (~60 s + N GB constants-file write) plus one import perf
      # pass (-t 30). The _ctx.onnx + _MORPHIZEN.bin are deleted right after
      # import to keep runner disk usage bounded.
      # ----------------------------------------------------------------------
      - name: Run EPContext export/import perf test (GPU)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $pkgBin = Join-Path $PWD "gpu-test-package\bin"
          $env:PATH = "$pkgBin;$env:PATH"

          $modelDir = "${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\model"
          if (-not (Test-Path $modelDir)) {
            Write-Host "[SKIP] MODEL_DIR not found: $modelDir"
            exit 0
          }
          $models = @(Get-ChildItem $modelDir -Recurse -Filter "full_model_seq128.onnx" -ErrorAction SilentlyContinue)
          if ($models.Count -eq 0) {
            Write-Host "[SKIP] No full_model_seq128.onnx in $modelDir"
            exit 0
          }

          New-Item -ItemType Directory -Force -Path "gpu-test-package\results-epctx-export" | Out-Null
          New-Item -ItemType Directory -Force -Path "gpu-test-package\results-epctx-import" | Out-Null
          $cacheDir = Join-Path $PWD "gpu-test-package\epctx-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $failed = 0
          Push-Location gpu-test-package\bin
          foreach ($m in $models) {
            $exportFile = "..\results-epctx-export\$($m.Name).txt"
            $importFile = "..\results-epctx-import\$($m.Name).txt"
            $ctxPath = Join-Path $cacheDir "$($m.BaseName)_ctx.onnx"
            Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue

            Write-Host "=== EPContext export: $($m.Name) ==="
            & .\onnxruntime_perf_test.exe `
              --plugin_ep_libs "hipgpu|hipgpu.dll" `
              --plugin_eps "hipgpu" `
              --plugin_ep_options "config_file|..\morphizen_config.json" `
              -C "session.disable_cpu_ep_fallback|1 ep.context_enable|1 ep.context_embed_mode|0 ep.context_file_path|$ctxPath" `
              -t 5 -c 1 -s -I `
              $m.FullName 2>&1 | Tee-Object -FilePath $exportFile
            if ($LASTEXITCODE -ne 0) {
              Add-Content $exportFile "[ERROR] EPContext export failed"
              $failed = 1
              Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue
              continue
            }
            if (-not (Test-Path $ctxPath)) {
              Add-Content $exportFile "[ERROR] _ctx.onnx not produced"
              $failed = 1
              continue
            }

            Write-Host "=== EPContext import: $($m.Name) ==="
            & .\onnxruntime_perf_test.exe `
              --plugin_ep_libs "hipgpu|hipgpu.dll" `
              --plugin_eps "hipgpu" `
              --plugin_ep_options "config_file|..\morphizen_config.json" `
              -C "session.disable_cpu_ep_fallback|1" `
              -t 30 -c 1 -s -I `
              $ctxPath 2>&1 | Tee-Object -FilePath $importFile
            if ($LASTEXITCODE -ne 0) { $failed = 1 }

            Remove-Item "$ctxPath*" -ErrorAction SilentlyContinue
          }
          Pop-Location
          Remove-Item $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
          exit $failed

      # -----------------------------------------------------------------------
      # OGA benchmark: run model_benchmark against pre-placed LLM models.
      # Models are at ${{ runner.workspace }}/oga-models/<model>/
      # with genai_config.json pre-configured for MorphiZenEP pipeline.
      # Skipped gracefully when model directory does not exist.
      # -----------------------------------------------------------------------
      - name: Run OGA benchmark
        if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $pkgBin = Join-Path $PWD "gpu-test-package\bin"
          $env:PATH = "$pkgBin;$env:PATH"

          # amdgpu-oga-models holds AMDGPU-profile genai_config copies; it was
          # generated once on the GPU runner and persists across runs, so just
          # consume it here (no re-copy / no config rewrite). It must be present
          # -- treat its absence as an error, not a skip.
          $ogaModelRoot = "${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\amdgpu-oga-models"
          if (-not (Test-Path $ogaModelRoot)) {
            Write-Host "[ERROR] AMDGPU OGA model directory not found: $ogaModelRoot"
            exit 1
          }

          $benchmark = Join-Path $pkgBin "model_benchmark.exe"
          if (-not (Test-Path $benchmark)) {
            Write-Host "[SKIP] model_benchmark.exe not found"
            exit 0
          }

          New-Item -ItemType Directory -Force -Path "oga-results" | Out-Null

          $failed = 0
          foreach ($modelDir in (Get-ChildItem $ogaModelRoot -Directory)) {
            $genaiCfgPath = Join-Path $modelDir.FullName "genai_config.json"
            if (-not (Test-Path $genaiCfgPath)) {
              Write-Host "[SKIP] No genai_config.json in $($modelDir.Name)"
              continue
            }
            $promptFile = Join-Path $modelDir.FullName "prompt.txt"
            $promptArgs = if (Test-Path $promptFile) {
              @("--prompt_file", $promptFile)
            } else {
              @("-l", "128")
            }
            $outFile = "oga-results\$($modelDir.Name).txt"
            # MorphiZenEP is selected via genai_config.json provider_options and
            # the EP DLL is auto-discovered next to onnxruntime-genai.dll. Do NOT
            # pass --ep_library: upstream model_benchmark rejects it, and where
            # supported it double-registers the EP and crashes on shutdown.
            Write-Host "=== OGA Benchmark: $($modelDir.Name) ==="
            $bargs = @('-i', $modelDir.FullName, '-g', '128', '-r', '5', '-w', '1', '-b', '1') + $promptArgs + @('-v')
            $tmpOut = [System.IO.Path]::GetTempFileName()
            $tmpErr = [System.IO.Path]::GetTempFileName()
            # Launch model_benchmark and sample its per-process GPU memory via
            # Windows perf counters while it runs (peak of dedicated + shared).
            # External measurement keeps the EP/inference path untouched.
            $proc = Start-Process -FilePath $benchmark -ArgumentList $bargs `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput $tmpOut -RedirectStandardError $tmpErr
            # Cache the native handle so $proc.ExitCode is readable after exit;
            # without this Start-Process -PassThru can leave ExitCode $null, and
            # `$null -ne 0` is $true in PowerShell -> false failure.
            $null = $proc.Handle
            $peakDed = 0L
            $peakShared = 0L
            while (-not $proc.HasExited) {
              Start-Sleep -Milliseconds 1500
              try {
                $d = (Get-Counter "\GPU Process Memory(pid_$($proc.Id)_*)\Dedicated Usage" -ErrorAction Stop).CounterSamples |
                  Measure-Object -Property CookedValue -Sum
                if ($d.Sum -gt $peakDed) { $peakDed = [long]$d.Sum }
                $s = (Get-Counter "\GPU Process Memory(pid_$($proc.Id)_*)\Shared Usage" -ErrorAction Stop).CounterSamples |
                  Measure-Object -Property CookedValue -Sum
                if ($s.Sum -gt $peakShared) { $peakShared = [long]$s.Sum }
              } catch { }
            }
            $proc.WaitForExit()
            # Reassemble tool output into $outFile (so the publish-step parsers
            # see model_benchmark's TTFT/TPS/Peak working set), echo to the log,
            # then append the sampled GPU peaks for the publish step.
            Get-Content $tmpOut, $tmpErr -ErrorAction SilentlyContinue | Set-Content $outFile
            Add-Content $outFile "[GPUMEM] Dedicated GPU memory: $peakDed bytes"
            Add-Content $outFile "[GPUMEM] Shared GPU memory: $peakShared bytes"
            Get-Content $outFile | Write-Host
            Remove-Item $tmpOut, $tmpErr -ErrorAction SilentlyContinue
            $ec = $proc.ExitCode
            if ($null -ne $ec -and $ec -ne 0) { $failed = 1 }
          }
          exit $failed

      # -----------------------------------------------------------------------
      # OGA wheel smoke: install the project wheels from the morphizen-python-
      # package artifact + ROCm wheels from repo.amd.com, then run OGA's
      # benchmark_e2e.py against a real model.
      # -----------------------------------------------------------------------
      # The cp314 ORT/OGA wheels need Python 3.14 to create the smoke venv (the
      # runner's default python may be a different version).
      - name: Setup Python 3.14 (wheel smoke)
        if: always()
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Run OGA wheel smoke (Python)
        if: always()
        timeout-minutes: 40
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $model = "${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\amdgpu-oga-models\Llama-3.1-8B-awq-g128-int4-asym-fp16-onnx-dml"
          if (-not (Test-Path $model)) { Write-Host "[SKIP] model not found: $model"; exit 0 }

          # The morphizen wheel now bundles the whole AMD GPU umbrella chain
          # (amdgpu-ep.dll + hip-backend.dll + hipgpu.dll + hip-compiler +
          # custom_kernels) into onnxruntime/capi/, next to onnxruntime.dll where
          # OGA discovers the EP. No DLL injection needed — exercise the wheel
          # path end-to-end.
          $pkg = "$PWD\wheelpkg"
          $venv = "$PWD\oga-smoke-venv"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          python -m venv $venv
          $py = "$venv\Scripts\python.exe"

          # Install project wheels from local dir + ROCm wheels from repo.amd.com.
          Push-Location "$pkg\wheels"
          & $py -m pip install --quiet `
            (Get-Item onnxruntime_directml-*.whl).Name `
            (Get-Item onnxruntime_ep_hip-*.whl).Name `
            (Get-Item onnxruntime_genai_directml-*.whl).Name `
            --extra-index-url https://repo.amd.com/rocm/whl/gfx1151/ `
            psutil tqdm pandas
          Pop-Location
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] wheel install failed"; exit 1 }
          & "$venv\Scripts\rocm-sdk.exe" init   # expand rocm[devel] import libs
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] rocm-sdk init failed"; exit 1 }

          # run_onnx.py --benchmark sets up env (THEROCK_DIST/LIB/PATH) from the
          # installed wheels, then delegates to benchmark_e2e.py.
          New-Item -ItemType Directory -Force -Path oga-smoke-results | Out-Null
          & $py "$pkg\run_onnx.py" --benchmark "$pkg\benchmark_e2e.py" `
            -i $model -l 128 -g 128 -r 5 -w 1 -b 1 -m -1 -v `
            2>&1 | Tee-Object -FilePath "oga-smoke-results\Llama-3.1-8B-awq-g128-int4-asym-fp16-onnx-dml.txt"
          exit $LASTEXITCODE

      # -----------------------------------------------------------------------
      # L2 accuracy test: compare MorphiZen EP vs CPU output for each model
      # in l2-test-models/. Skipped gracefully when directory does not exist.
      # -----------------------------------------------------------------------
      - name: Run L2 accuracy tests
        if: always()
        timeout-minutes: 10
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set PATH=%CD%\gpu-test-package\bin;%PATH%
          rem The EP DLL is now hipgpu.dll; hip-onnx-runner's legacy default name
          rem is onnxruntime_morphizen_ep.dll, so point it at the new DLL.
          set MORPHIZEN_EP_LIB=%CD%\gpu-test-package\bin\hipgpu.dll
          set L2_MODEL_DIR=${{ vars.GPU_TEST_ASSET_ROOT || runner.workspace }}\l2-test-models
          if not exist "%L2_MODEL_DIR%" (
            echo [SKIP] L2 model directory not found: %L2_MODEL_DIR%
            exit /b 0
          )
          set FOUND=0
          for /r "%L2_MODEL_DIR%" %%M in (*.onnx) do set FOUND=1
          if "!FOUND!"=="0" (
            echo [SKIP] No .onnx models found in %L2_MODEL_DIR%
            exit /b 0
          )
          cd gpu-test-package\bin
          set FAILED=0
          for /r "%L2_MODEL_DIR%" %%M in (*.onnx) do (
            set "MDIR=%%~dpM"
            set "REL=!MDIR:%L2_MODEL_DIR%\=!"
            set "OUT=..\..\l2-results\!REL!%%~nM.txt"
            mkdir "..\..\l2-results\!REL!" 2>nul
            echo === L2 test: !REL!%%~nxM ===
            rd /s /q "%%~nM_o_dump" 2>nul
            rd /s /q "%%~nM_cpu_o_dump" 2>nul
            hip-onnx-runner.exe -m "%%M" -d 2 -s 42 > "!OUT!" 2>&1
            if errorlevel 1 (
              echo [ERROR] EP inference failed>> "!OUT!"
              type "!OUT!"
              set FAILED=1
            ) else (
              hip-onnx-runner.exe -m "%%M" -d 2 -s 42 -n >> "!OUT!" 2>&1
              if errorlevel 1 (
                echo [ERROR] CPU inference failed>> "!OUT!"
                type "!OUT!"
                set FAILED=1
              ) else (
                hip-onnx-runner.exe -L "%%~nM_o_dump,%%~nM_cpu_o_dump" >> "!OUT!" 2>&1
                type "!OUT!"
              )
            )
          )
          exit /b !FAILED!

      - name: Publish L2 results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $l2Dir = "l2-results"
          if (-not (Test-Path $l2Dir)) {
            Write-Host "No L2 results to publish (directory not found)"
            return
          }
          $files = Get-ChildItem $l2Dir -Recurse -Filter "*.txt" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "No L2 result files found"
            return
          }

          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $rawSha = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $sha = $rawSha.Substring(0, 7)
          $prNumber = "${{ github.event.pull_request.number }}"
          $threshold = 0.01
          $l2Root = (Resolve-Path $l2Dir).Path

          $tableRows = ""
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($l2Root.Length).TrimStart('\', '/')
            $model = $rel -replace '\.txt$', '' -replace '\\', '/'
            $content = Get-Content $f.FullName -Raw
            $l2Match = [regex]::Match($content, 'Combined L2 \(stacked diffs\):\s+([\d.eE+-]+)\s+\(total_elems:\s+(\d+),.*?skipped_nonfinite:\s+(\d+)\)')
            $errMatch = [regex]::Match($content, '\[ERROR\]\s*(.+)')
            if ($l2Match.Success) {
              $l2val = [double]$l2Match.Groups[1].Value
              $elems = $l2Match.Groups[2].Value
              $skipped = $l2Match.Groups[3].Value
              $tableRows += "| $model | $l2val | $elems | $skipped |`n"
            } elseif ($errMatch.Success) {
              $reason = $errMatch.Groups[1].Value.Trim()
              $tableRows += "| $model | $reason | - | - |`n"
            } else {
              $tableRows += "| $model | error | - | - |`n"
            }
          }

          $header = "## L2 Accuracy Results (EP vs CPU)`n`n" +
                    "| Model | Combined L2 | Total Elems | Skipped NaN/Inf |`n" +
                    "|-------|------------|------------|----------------|`n"
          $footer = "`nThreshold: $threshold | Run: [${{ github.run_number }}]($runUrl) - Commit: ``$sha``"
          $summary = $header + $tableRows + $footer

          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          if ("${{ github.event_name }}" -eq "pull_request" -and $prNumber) {
            $marker = "<!-- morphizen-l2-results -->"
            $body = "$marker`n$summary"

            $commentsJson = gh api "repos/${{ github.repository }}/issues/$prNumber/comments" 2>$null
            $ghOk = ($LASTEXITCODE -eq 0)
            $existing = $null
            if ($ghOk -and $commentsJson) {
              $comments = $commentsJson | ConvertFrom-Json
              $found = $comments | Where-Object { $_.body -and $_.body.StartsWith($marker) } | Select-Object -First 1
              if ($found) { $existing = $found.id }
            }

            if ($ghOk -and $existing) {
              Write-Host "Updating existing L2 PR comment $existing"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" `
                -f body="$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to update L2 PR comment" }
            } elseif ($ghOk) {
              Write-Host "Creating new L2 PR comment"
              gh pr comment $prNumber -R "${{ github.repository }}" --body "$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to create L2 PR comment" }
            } else {
              Write-Host "WARNING: gh api unreachable, skipping L2 PR comment"
            }
          }

      # Parse QPS from result files and publish:
      #   - PR trigger  → post/update a PR comment via gh CLI (github-actions[bot])
      #   - other trigger → write to GITHUB_STEP_SUMMARY only
      - name: Publish perf results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $resultsDir = "gpu-test-package/results"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $rawSha = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $sha = $rawSha.Substring(0, 7)
          $prNumber = "${{ github.event.pull_request.number }}"

          # Helper: build table rows from a results dir.
          # Each file: extract Number of inferences per second / Session
          # creation / 1st infer / Avg CPU / Peak WS for the standard
          # 6-column format (Model | QPS | Session (s) | 1st Infer (ms) |
          # CPU% | Mem (MB)).
          function Get-PerfRows($dir) {
            $rows = ""
            foreach ($f in (Get-ChildItem "$dir/*.txt" -ErrorAction SilentlyContinue)) {
              $model = $f.BaseName -replace '\.onnx$', ''
              $content = Get-Content $f.FullName -Raw
              $qpsMatch = [regex]::Match($content, 'Number of inferences per second:\s+([\d.]+)')
              $sessMatch = [regex]::Match($content, 'Session creation time cost:\s+([\d.]+)\s+s')
              $firstMatch = [regex]::Match($content, 'First inference time cost:\s+(\d+)\s+ms')
              $cpuMatch = [regex]::Match($content, 'Avg CPU usage:\s+(\d+)\s+%')
              $memMatch = [regex]::Match($content, 'Peak working set size:\s+(\d+)\s+bytes')
              $sess = if ($sessMatch.Success) { $sessMatch.Groups[1].Value } else { "-" }
              $first = if ($firstMatch.Success) { $firstMatch.Groups[1].Value } else { "-" }
              $cpu = if ($cpuMatch.Success) { $cpuMatch.Groups[1].Value } else { "-" }
              $memMB = if ($memMatch.Success) { "{0:F0}" -f ([double]$memMatch.Groups[1].Value / 1MB) } else { "-" }
              if ($qpsMatch.Success) {
                $qps = "{0:F2}" -f [double]$qpsMatch.Groups[1].Value
                $rows += "| $model | $qps | $sess | $first | $cpu | $memMB |`n"
              } else {
                $rows += "| $model | failed | $sess | $first | $cpu | $memMB |`n"
              }
            }
            return $rows
          }

          # Build table rows from result files
          $tableRows = Get-PerfRows $resultsDir
          if (-not $tableRows) { $tableRows = "| (no results) | - | - | - | - | - |`n" }

          $perfHeader = "| Model | QPS | Session (s) | 1st Infer (ms) | CPU% | Mem (MB) |`n" +
                        "|-------|----:|----:|----:|----:|----:|`n"
          $header = "## MorphiZen EP Performance Results`n`n" + $perfHeader

          # EPContext export/import perf tables (full_model_seq128 only).
          $epctxExportRows = Get-PerfRows "gpu-test-package/results-epctx-export"
          $epctxImportRows = Get-PerfRows "gpu-test-package/results-epctx-import"
          $epctxSection = ""
          if ($epctxExportRows) {
            $epctxSection += "`n## EPContext Export Performance`n`n" + $perfHeader + $epctxExportRows
          }
          if ($epctxImportRows) {
            $epctxSection += "`n## EPContext Import Performance`n`n" + $perfHeader + $epctxImportRows
          }

          # --- OGA benchmark results ---
          $ogaRows = ""
          foreach ($f in (Get-ChildItem "oga-results/*.txt" -ErrorAction SilentlyContinue)) {
            $model = $f.BaseName
            $content = Get-Content $f.FullName -Raw
            $ttftMatch = [regex]::Match($content, 'Prompt processing \(time to first token\):\s*\n\s*avg \(us\):\s+([\d.]+)')
            $tpsMatch  = [regex]::Match($content, 'Token generation:\s*\n\s*avg \(us\):\s+([\d.]+)\s*\n\s*avg \(tokens/s\):\s+([\d.]+)')
            $memMatch  = [regex]::Match($content, 'Peak working set size \(bytes\):\s+(\d+)')
            $ttft = if ($ttftMatch.Success) { "{0:F1}" -f ([double]$ttftMatch.Groups[1].Value / 1000) } else { "-" }
            $tps  = if ($tpsMatch.Success) { "{0:F1}" -f [double]$tpsMatch.Groups[2].Value } else { "-" }
            $mem  = if ($memMatch.Success) { "{0:F2}" -f ([double]$memMatch.Groups[1].Value / 1GB) } else { "-" }
            # GPU peak sampled externally during the run (see OGA benchmark
            # step). Report the total (dedicated + shared): on the UMA APU the
            # WDDM dedicated/shared split drifts with memory pressure run-to-run,
            # but their sum -- the real footprint -- is stable.
            $gpuDed = [regex]::Match($content, '\[GPUMEM\]\s*Dedicated GPU memory:\s+(\d+)\s+bytes')
            $gpuSh  = [regex]::Match($content, '\[GPUMEM\]\s*Shared GPU memory:\s+(\d+)\s+bytes')
            $gpuGB = if ($gpuDed.Success -or $gpuSh.Success) {
              $tot = 0.0
              if ($gpuDed.Success) { $tot += [double]$gpuDed.Groups[1].Value }
              if ($gpuSh.Success) { $tot += [double]$gpuSh.Groups[1].Value }
              "{0:F2}" -f ($tot / 1GB)
            } else { "-" }
            $ogaRows += "| $model | 1 | 5 | 128 | 128 | $ttft | $tps | $mem | $gpuGB |`n"
          }
          $ogaSection = ""
          if ($ogaRows) {
            $ogaSection = "`n## OGA Benchmark Results`n`n" +
                          "| Model | Warmup | Reps | Prompt Len | Gen Tokens | TTFT (ms) | TPS | Peak Mem (GB) | GPU Mem (GB) |`n" +
                          "|-------|----:|----:|----:|----:|----:|----:|----:|----:|`n" +
                          $ogaRows
          }

          # --- OGA Python wheel smoke (benchmark_e2e.py) results ---
          $smokeRows = ""
          foreach ($f in (Get-ChildItem "oga-smoke-results/*.txt" -ErrorAction SilentlyContinue)) {
            $model = $f.BaseName
            $content = Get-Content $f.FullName -Raw
            $ppMatch = [regex]::Match($content, 'Average Prompt Processing Throughput \(per token\):\s+([\d.]+)')
            $tgMatch = [regex]::Match($content, 'Average Token Generation Throughput \(per token\):\s+([\d.]+)')
            $ttft = if ($ppMatch.Success) { "{0:F0}" -f (128.0 / [double]$ppMatch.Groups[1].Value * 1000) } else { "-" }
            $tps  = if ($tgMatch.Success) { "{0:F1}" -f [double]$tgMatch.Groups[1].Value } else { "-" }
            if ($tgMatch.Success) {
              $smokeRows += "| $model | $ttft | $tps |`n"
            } else {
              $smokeRows += "| $model | failed | - |`n"
            }
          }
          $smokeSection = ""
          if ($smokeRows) {
            $smokeSection = "`n## OGA Wheel Smoke (Python benchmark_e2e.py)`n`n" +
                            "| Model | TTFT (ms) | TPS |`n" +
                            "|-------|----:|----:|`n" +
                            $smokeRows
          }

          $footer = "`nRun: [${{ github.run_number }}]($runUrl) - Commit: ``$sha``"
          $summary = $header + $tableRows + $epctxSection + $ogaSection + $smokeSection + $footer

          # Always write to step summary and log
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          # On pull_request events, also post/update a PR comment via gh CLI.
          # Errors are non-fatal — step summary is already written above.
          if ("${{ github.event_name }}" -eq "pull_request" -and $prNumber) {
            $marker = "<!-- morphizen-perf-results -->"
            $body = "$marker`n$summary"

            # Find existing comment with marker using PowerShell JSON parsing (avoids jq escaping issues)
            $commentsJson = gh api "repos/${{ github.repository }}/issues/$prNumber/comments" 2>$null
            $ghOk = ($LASTEXITCODE -eq 0)
            $existing = $null
            if ($ghOk -and $commentsJson) {
              $comments = $commentsJson | ConvertFrom-Json
              $found = $comments | Where-Object { $_.body -and $_.body.StartsWith($marker) } | Select-Object -First 1
              if ($found) { $existing = $found.id }
            }

            if ($ghOk -and $existing) {
              Write-Host "Updating existing PR comment $existing"
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" `
                -f body="$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to update PR comment" }
            } elseif ($ghOk) {
              Write-Host "Creating new PR comment"
              gh pr comment $prNumber -R "${{ github.repository }}" --body "$body"
              if ($LASTEXITCODE -ne 0) { Write-Host "WARNING: Failed to create PR comment" }
            } else {
              Write-Host "WARNING: gh api unreachable, skipping PR comment"
            }
          }
