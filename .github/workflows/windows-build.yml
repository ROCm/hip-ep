name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, "release/**", "gpuep/releases/**"]

permissions:
  contents: read

jobs:
  build_required:
    uses: ./.github/workflows/build-required.yml

  prebuild:
    needs: build_required
    if: needs.build_required.outputs.run == 'true'
    uses: ./.github/workflows/windows-deps.yml

  build_real:
    needs: prebuild
    uses: ./.github/workflows/windows-build-real.yml
    with:
      llvm_cache_key: ${{ needs.prebuild.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}
      amdgpu_cache_key: ${{ needs.prebuild.outputs.amdgpu_cache_key }}
      oga_cache_key: ${{ needs.prebuild.outputs.oga_cache_key }}

  build_mock:
    needs: prebuild
    uses: ./.github/workflows/windows-build-mock.yml
    with:
      llvm_cache_key: ${{ needs.prebuild.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}

  # The required check is the inner name gpu_test / test. Skipping this
  # caller leaves that name unreported. A documentation-only diff still
  # runs the callee, which records success without the GPU suites.
  gpu_test:
    needs: [build_required, build_real]
    if: >-
      always() &&
      (needs.build_real.result == 'success' ||
       (needs.build_required.result == 'success' &&
        needs.build_required.outputs.run == 'false'))
    uses: ./.github/workflows/windows-gpu-test.yml
    with:
      docs_only: ${{ needs.build_required.outputs.run == 'false' }}
    # A callee's GITHUB_TOKEN is capped by the caller job, and the GPU job
    # posts perf / L2 results as PR comments.
    permissions:
      contents: read
      pull-requests: write
      actions: read

  gpu_test_strix:
    needs: build_real
    uses: ./.github/workflows/windows-gpu-test-strix.yml
    permissions:
      contents: read
      actions: read

  kernel_ut:
    needs: build_real
    uses: ./.github/workflows/windows-kernel-ut.yml
    permissions:
      contents: read
      pull-requests: write
      actions: read
