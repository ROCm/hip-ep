name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, "release/**", "gpuep/releases/**"]

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/windows-deps.yml

  build_real:
    needs: prebuild
    uses: ./.github/workflows/windows-build-real.yml
    with:
      llvm_cache_key: ${{ needs.prebuild.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}
      amdgpu_cache_key: ${{ needs.prebuild.outputs.amdgpu_cache_key }}
      oga_cache_key: ${{ needs.prebuild.outputs.oga_cache_key }}

  # Same real build as build_real, but with the default host toolchain (MSVC
  # cl.exe) rather than the clang-cl that job pins. See the header comment in
  # windows-build-msvc.yml for why neither build_real nor build_mock covers it.
  build_msvc:
    needs: prebuild
    uses: ./.github/workflows/windows-build-msvc.yml
    with:
      llvm_cache_key: ${{ needs.prebuild.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}

  build_mock:
    needs: prebuild
    uses: ./.github/workflows/windows-build-mock.yml
    with:
      llvm_cache_key: ${{ needs.prebuild.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}

  gpu_test:
    needs: build_real
    uses: ./.github/workflows/windows-gpu-test.yml
    # A callee's GITHUB_TOKEN is capped by the caller job, and the GPU job
    # posts perf / L2 results as PR comments.
    permissions:
      contents: read
      pull-requests: write
