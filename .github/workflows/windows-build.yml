name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, "release/**", "gpuep/releases/**"]

permissions:
  contents: read

jobs:
  # LLVM and ORT are built here once and restored by both build jobs, so a cold
  # cache pays for each of them once per ref instead of once per build job.
  deps:
    uses: ./.github/workflows/windows-deps.yml

  real:
    needs: deps
    uses: ./.github/workflows/windows-build-real.yml
    with:
      llvm_cache_key: ${{ needs.deps.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.deps.outputs.ort_cache_key }}
      onnxruntime_version: ${{ needs.deps.outputs.onnxruntime_version }}
      onnxruntime_pr_patches: ${{ needs.deps.outputs.onnxruntime_pr_patches }}

  mock:
    needs: deps
    uses: ./.github/workflows/windows-build-mock.yml
    with:
      llvm_cache_key: ${{ needs.deps.outputs.llvm_cache_key }}
      ort_cache_key: ${{ needs.deps.outputs.ort_cache_key }}

  gpu:
    needs: real
    uses: ./.github/workflows/windows-gpu-test.yml
    # A callee's GITHUB_TOKEN is capped by the caller job, and the GPU job
    # posts perf / L2 results as PR comments.
    permissions:
      contents: read
      pull-requests: write
