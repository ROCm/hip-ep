name: Windows Deps

# Prebuilds the two heavy from-source dependencies into cached install prefixes
# and returns their cache keys. Callers restore those prefixes with
# fail-on-cache-miss, so a green run here is what guarantees the caches exist.
on:
  workflow_call:
    outputs:
      llvm_cache_key:
        description: Cache key holding the LLVM/MLIR/LLD install prefix.
        value: ${{ jobs.llvm.outputs.cache_key }}
      ort_cache_key:
        description: Cache key holding the ONNX Runtime install prefix.
        value: ${{ jobs.ort.outputs.cache_key }}
      amdgpu_cache_key:
        description: Cache key holding the amdgpu-ep build artifacts.
        value: ${{ jobs.amdgpu.outputs.cache_key }}
      oga_cache_key:
        description: Cache key holding the OGA artifact set.
        value: ${{ jobs.oga.outputs.cache_key }}
      therock_cache_key:
        description: Cache key holding the self-built TheRock SDK distribution.
        value: ${{ jobs.therock-libraries.outputs.cache_key }}

permissions:
  contents: read

env:
  LLVM_TAG: llvmorg-22.1.0
  ONNXRUNTIME_VERSION: "1.27.0"
  ONNXRUNTIME_PR_PATCHES: ""
  OGA_VERSION: "0.14.0"
  OGA_PR_PATCHES: "2194"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  AMDGPU_EP_REF: "05eaa2a938f71e98b49bd1be3fb03720167be5cc"
  # Space-separated onnxruntime/onnxruntime-ep-amdgpu PR numbers applied on top
  # of AMDGPU_EP_REF. 102: forward Hip custom-op domains; 105: forward unknown /
  # Hip-owned provider options under the shared ep.<amdgpu>.* prefix.
  AMDGPU_PR_PATCHES: "102 105"
  ROCM_CMAKE_REF: "6a7c5b73b8882c74f8f7060e2633f230dabb7b63"
  LLVM_PROJECT_REF: "2904a87d4ddd4d3dd3aaed86fc38c2278b284fd3"
  ROCM_SYSTEMS_REF: "0658bf9fe1355f2ebdc26f4047966a6356e327bc"
  ROCM_LIBRARIES_REF: "ce54e74413a2686ec79522ed3724cd171cbc2df2"
  THEROCK_GPU_TARGETS: "gfx1151;gfx1152;gfx1150"
  HIPBLASLT_LOGIC_FILTER: ""

jobs:
  llvm:
    runs-on: windows-2022
    concurrency:
      group: deps-llvm-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=dep-llvm-${{ env.LLVM_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Probe llvm-install
        id: cache-llvm
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup Python 3.14
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-llvm-

      - name: Setup sccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build LLVM/MLIR/LLD from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SRC="${{ runner.workspace }}/llvm-project"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/llvm/llvm-project.git
          git -C "$SRC" fetch --depth 1 origin "${{ env.LLVM_TAG }}"
          git -C "$SRC" checkout FETCH_HEAD
          cmake -G Ninja -S "$SRC/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="${{ runner.workspace }}/llvm-install" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install

      - name: Save llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-${{ env.SCCACHE_KEY_DATE }}

  ort:
    runs-on: windows-2022
    concurrency:
      group: deps-ort-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=dep-ort-${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe ort-install
        id: cache-ort
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup Python 3.14
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Checkout ONNX Runtime v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Microsoft/onnxruntime
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          path: source-onnxruntime
          submodules: true
          fetch-depth: 1
          show-progress: false

      - name: Apply ONNX Runtime PR patches
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-onnxruntime
        env:
          ORT_PRS: ${{ env.ONNXRUNTIME_PR_PATCHES }}
        run: |
          $prs = $env:ORT_PRS.Trim()
          if (-not $prs) {
            Write-Host "ONNXRUNTIME_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "ort-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Build ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "${{ github.workspace }}\source-onnxruntime"
          call build.bat ^
            --config Release ^
            --build_shared_lib ^
            --parallel ^
            --compile_no_warning_as_error ^
            --skip_submodule_sync ^
            --build_dir "${{ runner.workspace }}\build-onnxruntime" ^
            --skip_tests ^
            --disable_memleak_checker ^
            --use_dml ^
            --cmake_generator Ninja ^
            --build_wheel

      - name: Install ORT into ort-install
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install "${{ runner.workspace }}/build-onnxruntime/Release" \
            --prefix "${{ runner.workspace }}/ort-install"
          # perf_test is not a cmake install target; copy manually so it lands
          # in ort-install (cached) rather than the ephemeral build directory.
          PERF_TEST=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in build tree"
            exit 1
          fi
          cp "$PERF_TEST" "${{ runner.workspace }}/ort-install/bin/"
          # DirectML.dll is not installed by cmake --install; copy manually.
          DML_DLL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -path "*/x64-win/DirectML.dll" -type f | head -1)
          if [ -z "$DML_DLL" ]; then
            echo "ERROR: DirectML.dll not found in build tree"
            exit 1
          fi
          cp "$DML_DLL" "${{ runner.workspace }}/ort-install/bin/"
          # Cache the cp314 ORT Python wheel inside ort-install so it
          # rides the same cache key as the rest of the ORT artifacts.
          # Output path: build-onnxruntime/Release/dist/onnxruntime_directml-1.27.0-cp314-cp314-win_amd64.whl
          ORT_WHEEL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ]; then
            echo "ERROR: onnxruntime_directml wheel not found in build tree"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/ort-install/wheels"
          cp "$ORT_WHEEL" "${{ runner.workspace }}/ort-install/wheels/"
          echo "Cached ORT wheel: $(basename "$ORT_WHEEL")"

      - name: Save ort-install
        if: steps.cache-ort.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.value }}

  amdgpu:
    needs: ort
    runs-on: windows-2022
    concurrency:
      group: deps-amdgpu-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Checkout deps manifest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source-hip-ep
          sparse-checkout: cmake
          fetch-depth: 1
          show-progress: false

      - name: Compute cache key
        id: key
        shell: bash
        working-directory: source-hip-ep
        run: |
          DEPS_HASH=$(git rev-parse --short=12 HEAD:cmake/deps.txt)
          EP_REF="${{ env.AMDGPU_EP_REF }}"
          AMDPR_KEY="${{ env.AMDGPU_PR_PATCHES }}"
          AMDPR_KEY="${AMDPR_KEY// /-}"
          echo "value=windows-amdgpu-${EP_REF:0:7}-amdpr${AMDPR_KEY}-deps${DEPS_HASH}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe amdgpu-artifacts
        id: cache-amdgpu
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/amdgpu-artifacts
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore ort-install
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ needs.ort.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.14
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Prepare sccache local cache
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Cache sccache directory
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-amdgpu-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-amdgpu-

      - name: Setup sccache
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: onnxruntime/onnxruntime-ep-amdgpu
          ref: ${{ env.AMDGPU_EP_REF }}
          path: source-amdgpu
          fetch-depth: 1
          show-progress: false

      - name: Apply amdgpu-ep PR patches
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-amdgpu
        env:
          AMDGPU_PRS: ${{ env.AMDGPU_PR_PATCHES }}
        run: |
          $prs = $env:AMDGPU_PRS.Trim()
          if (-not $prs) {
            Write-Host "AMDGPU_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/onnxruntime/onnxruntime-ep-amdgpu/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "amdgpu-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Fetch MIGraphX + TheRock SDKs
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPS="source-hip-ep/cmake/deps.txt"
          TMP=$(cygpath -u "$RUNNER_TEMP")
          WS=$(cygpath -u '${{ runner.workspace }}')
          fetch_dep() {
            local name="$1" dest="$2"
            local line url base
            line=$(grep -E "^${name};" "$DEPS")
            url=$(echo "$line" | cut -d';' -f2)
            base=$(echo "$line" | cut -d';' -f3)
            echo "[$name] $url/$base.tar.gz"
            curl -sSL --fail -o "$TMP/$base.tar.gz" "$url/$base.tar.gz"
            mkdir -p "$dest"
            ( cd "$TMP" && tar -xzf "$base.tar.gz" -C "$dest" --strip-components=1 )
          }
          fetch_dep migraphx_windows "$WS/migraphx-sdk"
          fetch_dep therock_windows "$WS/therock"
          test -f "$WS/migraphx-sdk/lib/cmake/migraphx/migraphx-config.cmake"
          test -f "$WS/migraphx-sdk/problem_cache.json"
          test -f "$WS/therock/lib/cmake/hip/hip-config.cmake"

      - name: Build amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The repo needs CMake >= 4.2 and uses 4.x-only syntax; the runner's
          # system cmake is older.
          python -m pip install -q "cmake>=4.2"
          CMAKE="$(python -c "import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake.exe'))")"
          echo "Using $("$CMAKE" --version | head -1)"
          MIGRAPHX_SDK="${{ runner.workspace }}/migraphx-sdk"
          python source-amdgpu/tools/ci_build/build.py \
            --build_dir "${{ runner.workspace }}/build-amdgpu" \
            --config Release \
            --cmake_generator Ninja \
            --cmake_path "$CMAKE" \
            --use_amdgpu \
            --onnxrt_home "${{ runner.workspace }}/ort-install" \
            --migraphx_home "$MIGRAPHX_SDK" \
            --hip_path "${{ runner.workspace }}/therock" \
            --build_wheel \
            --cmake_extra_defines \
              "MIGRAPHX_EP_PROBLEM_CACHE=$MIGRAPHX_SDK/problem_cache.json" \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          INSTALL="${{ runner.workspace }}/amdgpu-install"
          rm -rf "$INSTALL"
          "$CMAKE" --install "${{ runner.workspace }}/build-amdgpu/Release" --prefix "$INSTALL"

          ARTIFACTS="${{ runner.workspace }}/amdgpu-artifacts"
          rm -rf "$ARTIFACTS"
          mkdir -p "$ARTIFACTS/bin"
          WHEEL=$(find "${{ runner.workspace }}/build-amdgpu" -name 'onnxruntime_ep_amdgpu-*.whl' -type f | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: onnxruntime_ep_amdgpu wheel not found in build tree"
            exit 1
          fi
          cp "$WHEEL" "$ARTIFACTS/"
          echo "Cached $(basename "$WHEEL")"

          for f in "$INSTALL"/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              amd_comgr*|amdhip64*|hiprtc*|DirectML.dll) continue ;;
            esac
            cp "$f" "$ARTIFACTS/bin/"
          done
          test -f "$ARTIFACTS/bin/amdgpu-ep.dll"
          test -f "$ARTIFACTS/bin/problem_cache.json"
          echo "Cached $(ls -1 "$ARTIFACTS/bin" | wc -l) files into bin/"

      - name: Save amdgpu-artifacts
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/amdgpu-artifacts
          key: ${{ steps.key.outputs.value }}

  oga:
    needs: ort
    runs-on: windows-2022
    concurrency:
      group: deps-oga-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=oga-dml-mm2-${{ env.OGA_VERSION }}-pr${{ env.OGA_PR_PATCHES }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe oga-artifacts
        id: cache-oga
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore ort-install
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ needs.ort.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.14
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-oga-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-oga-

      - name: Setup sccache
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: microsoft/onnxruntime-genai
          ref: v${{ env.OGA_VERSION }}
          path: source-oga
          submodules: true
          fetch-depth: 1
          show-progress: false

      - name: Apply OGA PR patches
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-oga
        env:
          OGA_PRS: ${{ env.OGA_PR_PATCHES }}
        run: |
          $prs = $env:OGA_PRS.Trim()
          if (-not $prs) {
            Write-Host "OGA_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          # pull/<n>.patch is a format-patch series; apply with `git am` so that
          # intra-series file renames (morphizen_ep -> amdgpu) replay against the
          # correct intermediate tree. `git apply` flattens the series and chokes
          # on the rename whose pre-image only exists after an earlier commit.
          git config user.email "ci@rocm.amd.com"
          git config user.name "ROCm CI"
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime-genai/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "oga-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git am --3way --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              git am --abort
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Prepare ORT_HOME for OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ORT_HOME="${{ runner.workspace }}/oga-ort-home"
          mkdir -p "$ORT_HOME/include" "$ORT_HOME/lib"
          PREBUILT="${{ runner.workspace }}/ort-install"
          cp -r "$PREBUILT/include/onnxruntime/"* "$ORT_HOME/include/"
          cp "$PREBUILT/lib/"onnxruntime*.lib "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime.dll" "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" "$ORT_HOME/lib/"
          echo "ORT_HOME=$ORT_HOME" >> "$GITHUB_ENV"

      - name: Build OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python "${{ github.workspace }}/source-oga/build.py" \
            --config Release \
            --cmake_generator Ninja \
            --use_dml \
            --ort_home "$ORT_HOME" \
            --skip_tests --skip_examples \
            --parallel \
            --build_dir "${{ runner.workspace }}/build-oga" \
            --cmake_extra_defines \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          mkdir -p "${{ runner.workspace }}/oga-artifacts"
          OGA_OUT="${{ runner.workspace }}/build-oga/Release"
          cp "$OGA_OUT/benchmark/c/model_benchmark.exe" "${{ runner.workspace }}/oga-artifacts/"
          cp "$OGA_OUT/onnxruntime-genai.dll" "${{ runner.workspace }}/oga-artifacts/"
          # Cache the cp314 OGA Python wheel alongside the other OGA artifacts.
          # Output path: build-oga/Release/wheel/onnxruntime_genai_directml-0.13.0.dev0-cp314-cp314-win_amd64.whl
          OGA_WHEEL=$(find "${{ runner.workspace }}/build-oga" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: onnxruntime_genai_directml wheel not found in build tree"
            exit 1
          fi
          cp "$OGA_WHEEL" "${{ runner.workspace }}/oga-artifacts/"
          echo "Cached OGA wheel: $(basename "$OGA_WHEEL")"

          # Cache the Python e2e benchmark scripts (benchmark_e2e.py + its metrics
          # helper) so the gpu-test wheel smoke can run them without an OGA source
          # checkout (which only happens on a cache miss).
          mkdir -p "${{ runner.workspace }}/oga-artifacts/benchmark-python"
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_e2e.py" \
             "${{ github.workspace }}/source-oga/benchmark/python/metrics.py" \
             "${{ runner.workspace }}/oga-artifacts/benchmark-python/"

          # build.py --skip_examples leaves examples/c unbuilt. Build only
          # model_mm (the multimodal example used by VL model CI) as a standalone
          # cmake project against the just-built OGA lib + ORT_HOME. build.py's
          # build_examples ignores CXXFLAGS, so set -DCMAKE_CXX_FLAGS=-FS here to
          # force synchronous compiler-PDB writes (parallel model_mm.cpp /
          # common.cpp otherwise clash on vc140.pdb -> C1041).
          cmake -S "${{ github.workspace }}/source-oga/examples/c" \
            -B "${{ runner.workspace }}/build-oga-examples" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODEL_MM=ON -DCMAKE_CXX_FLAGS=-FS \
            -DORT_INCLUDE_DIR="$ORT_HOME/include" \
            -DORT_LIB_DIR="$ORT_HOME/lib" \
            -DOGA_INCLUDE_DIR="${{ github.workspace }}/source-oga/src" \
            -DOGA_LIB_DIR="$OGA_OUT"
          cmake --build "${{ runner.workspace }}/build-oga-examples" --target model_mm
          cp "${{ runner.workspace }}/build-oga-examples/model_mm.exe" \
            "${{ runner.workspace }}/oga-artifacts/"

          # benchmark_multimodal.py drives model_mm for the VL benchmark.
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_multimodal.py" \
            "${{ runner.workspace }}/oga-artifacts/"

      - name: Save oga-artifacts
        if: steps.cache-oga.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-oga.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-oga-${{ env.SCCACHE_KEY_DATE }}

  therock-llvm:
    runs-on: windows-2022
    timeout-minutes: 360
    concurrency:
      group: deps-therock-llvm-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=therock-llvm-${LLVM_PROJECT_REF:0:12}-cmake${ROCM_CMAKE_REF:0:7}" >> "$GITHUB_OUTPUT"

      - name: Probe therock-llvm prefix
        id: cache-llvm
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup Python 3.12
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Setup MSVC environment
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-therock-llvm-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-therock-llvm-

      - name: Setup sccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout rocm-cmake
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-cmake
          ref: ${{ env.ROCM_CMAKE_REF }}
          path: source-rocm-cmake
          fetch-depth: 1
          show-progress: false

      - name: Checkout llvm-project
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/llvm-project
          ref: ${{ env.LLVM_PROJECT_REF }}
          path: source-llvm-project
          fetch-depth: 1
          show-progress: false

      - name: Report disk before build
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: df -h / /c 2>/dev/null || true

      - name: Build rocm-cmake
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          cmake -S source-rocm-cmake -B "${{ runner.workspace }}/build-rocm-cmake" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build "${{ runner.workspace }}/build-rocm-cmake" --target install

      - name: Build LLVM (clang + lld, AMDGPU/X86/SPIRV)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          # Project/target selection mirrors AMD's build: their configure log
          # shows clang + clang-tools-extra + lld enabled, bolt/lldb/mlir/polly
          # disabled, and "Targeting AMDGPU / X86 / SPIRV".
          cmake -S source-llvm-project/llvm -B "${{ runner.workspace }}/build-llvm-amd" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;X86;SPIRV" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm-amd" --target install

      - name: Build AMDDeviceLibs + amd_comgr + hipcc
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          SRC="${{ github.workspace }}/source-llvm-project"
          # These three live in the same repo as llvm/ and are built against the
          # LLVM that was just installed.
          for comp in device-libs comgr hipcc; do
            cmake -S "$SRC/amd/$comp" -B "${{ runner.workspace }}/build-amd-$comp" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DCMAKE_PREFIX_PATH="$PREFIX" \
              -DLLVM_DIR="$PREFIX/lib/cmake/llvm" \
              -DClang_DIR="$PREFIX/lib/cmake/clang" \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            cmake --build "${{ runner.workspace }}/build-amd-$comp" --target install
          done

      - name: Verify prefix has the pieces downstream stages need
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          for f in bin/clang.exe bin/lld.exe amdgcn/bitcode; do
            if [ ! -e "$PREFIX/$f" ]; then
              echo "ERROR: $PREFIX/$f missing after the LLVM stage"
              ls -1 "$PREFIX/bin" | head -40 || true
              exit 1
            fi
          done
          du -sh "$PREFIX" || true

      - name: Report disk after build
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: df -h / /c 2>/dev/null || true

      - name: Save therock-llvm prefix
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-therock-llvm-${{ env.SCCACHE_KEY_DATE }}

  therock-hip-runtime:
    needs: therock-llvm
    runs-on: windows-2022
    timeout-minutes: 240
    concurrency:
      group: deps-therock-hip-runtime-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=therock-hipruntime-${ROCM_SYSTEMS_REF:0:12}-on-${{ needs.therock-llvm.outputs.cache_key }}" >> "$GITHUB_OUTPUT"

      - name: Probe therock-hip-runtime prefix
        id: cache-hip
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore therock-llvm prefix
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ needs.therock-llvm.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.12
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Setup MSVC environment
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-therock-hip-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-therock-hip-

      - name: Setup sccache
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout rocm-systems
        if: steps.cache-hip.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: ${{ env.ROCM_SYSTEMS_REF }}
          path: source-rocm-systems
          # ~7 GB monorepo. projects/hip is HIP_COMMON_DIR; projects/rocr-runtime
          # is picked up by rocclr as a subdirectory build of hsa-runtime64
          # (see the AMD_COMPUTE_WIN note in the build step).
          sparse-checkout: |
            shared
            projects/clr
            projects/hip
            projects/rocr-runtime
          fetch-depth: 1
          show-progress: false

      # shared/kpack does find_package(msgpack-cxx REQUIRED) and
      # find_package(zstd REQUIRED). Flags copied from AMD's build -- the
      # static-CRT and static-lib settings have to match the consumer.
      - name: Install zstd and msgpack via cget
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # hipamd's configure imports CppHeaderParser to generate its API headers.
          python -m pip install -q cget CppHeaderParser
          DEPS="${{ runner.workspace }}/hipruntime-deps"
          cget install facebook/zstd@v1.5.7 -X subdir -DCMAKE_DIR=build/cmake \
            -DZSTD_USE_STATIC_RUNTIME=On -DBUILD_TESTING=Off -DZSTD_BUILD_TESTS=Off \
            -DZSTD_BUILD_STATIC=On -DZSTD_BUILD_SHARED=Off -DBUILD_SHARED_LIBS=Off \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 --build-type Release --insecure -G Ninja -p "$DEPS"
          cget install msgpack/msgpack-c@cpp-7.0.0 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DMSGPACK_CXX17=ON \
            -DMSGPACK_BUILD_TESTS=Off -DMSGPACK_BUILD_DOCS=OFF -DMSGPACK_USE_BOOST=OFF \
            -DBUILD_SHARED_LIBS=OFF --build-type Release --insecure -G Ninja -p "$DEPS"

      - name: Build rocm-kpack and hipRuntime
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Forward slashes throughout: hipamd runs hip_embed_pch.sh via sh -c,
          # and a backslash path like D:\a\hip-ep loses its separators to shell
          # escaping ("\a" becomes a bell character) before clang ever sees it.
          PREFIX=$(cygpath -m "${{ runner.workspace }}/therock-prefix")
          DEPS=$(cygpath -m "${{ runner.workspace }}/hipruntime-deps")
          SRC=$(cygpath -m "${{ github.workspace }}/source-rocm-systems")
          export HIP_PATH="$PREFIX"
          export ROCM_PATH="$PREFIX"

          # Same order AMD uses: kpack first, then the HIP runtime out of clr.
          cmake -S "$SRC/shared/kpack" -B "${{ runner.workspace }}/build-kpack" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$DEPS" \
            -DROCM_PATH="$PREFIX" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-kpack" --target install

          # clr builds nothing unless a runtime is selected, and it hard-fails
          # without HIP_COMMON_DIR. HIP_PLATFORM is passed explicitly because
          # the auto-detect path shells out to hipconfig.
          #
          # rocclr/cmake/ROCclrHSA.cmake takes one of two paths: when
          # projects/rocr-runtime is present next to clr it builds hsa-runtime64
          # as a subdirectory, otherwise it falls back to find_package and fails
          # because nothing installs that package. AMD_COMPUTE_WIN supplies the
          # Windows libelf and SC paths that build needs.
          #
          # HIP_LLVM_ROOT has to be explicit: hipamd derives it by probing for
          # "<root>/bin/clang", which never matches on Windows where the file is
          # clang.exe, so it would fall through to the <root>/lib/llvm layout
          # that AMD's ROCm install uses and this prefix does not.
          #
          # __HIP_ENABLE_PCH defaults ON but AMD's own build never runs it (no
          # trace of hip_embed_pch.sh in their logs), and on Windows it drives
          # clang over the MSVC headers in GNU driver mode, which does not parse.
          # It only precompiles headers for runtime compilation.
          cmake -S "$SRC/projects/clr" -B "${{ runner.workspace }}/build-clr" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$DEPS" \
            -DROCM_PATH="$PREFIX" \
            -DCLR_BUILD_HIP=ON \
            -DCLR_BUILD_OCL=OFF \
            -DHIP_COMMON_DIR="$SRC/projects/hip" \
            -DHIP_PLATFORM=amd \
            -DHIP_LLVM_ROOT="$PREFIX" \
            -D__HIP_ENABLE_PCH=OFF \
            -DAMD_COMPUTE_WIN="$SRC/shared/amdgpu-windows-interop" \
            -DGPU_TARGETS="${{ env.THEROCK_GPU_TARGETS }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-clr" --target install

      - name: Verify HIP runtime landed in the prefix
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          if ! ls "$PREFIX"/bin/amdhip64*.dll >/dev/null 2>&1; then
            echo "ERROR: amdhip64*.dll missing after the hipRuntime stage"
            ls -1 "$PREFIX/bin" | head -40 || true
            exit 1
          fi
          du -sh "$PREFIX" || true

      - name: Save therock-hip-runtime prefix
        if: steps.cache-hip.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-hip.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-therock-hip-${{ env.SCCACHE_KEY_DATE }}

  therock-libraries:
    needs: therock-hip-runtime
    runs-on: windows-2022
    timeout-minutes: 240
    concurrency:
      group: deps-therock-libraries-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: |
          FILTER_TAG=$(printf '%s' "${{ env.HIPBLASLT_LOGIC_FILTER }}" | tr -c 'A-Za-z0-9' '-' | cut -c1-24)
          [ -n "$FILTER_TAG" ] || FILTER_TAG=full
          echo "value=therock-dist-${ROCM_LIBRARIES_REF:0:12}-logic${FILTER_TAG}-on-${{ needs.therock-hip-runtime.outputs.cache_key }}" >> "$GITHUB_OUTPUT"

      - name: Probe therock-dist
        id: cache-dist
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore therock-hip-runtime prefix
        if: steps.cache-dist.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ needs.therock-hip-runtime.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.12
        if: steps.cache-dist.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # TensileLite runs during the hipBLASLt build; AMD validates it on 3.12.
          python-version: "3.12"

      - name: Setup MSVC environment
        if: steps.cache-dist.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Checkout rocm-libraries
        if: steps.cache-dist.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-libraries
          ref: ${{ env.ROCM_LIBRARIES_REF }}
          path: source-rocm-libraries
          sparse-checkout: |
            shared
            projects/hipblas-common
            projects/hipblaslt
          fetch-depth: 1
          show-progress: false

      - name: Drop Tensile logic for other architectures
        if: steps.cache-dist.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOGIC="${{ github.workspace }}/source-rocm-libraries/projects/hipblaslt/library/src/amd_detail/rocblaslt/src/Tensile/Logic/asm_full"
          if [ ! -d "$LOGIC" ]; then
            echo "ERROR: Tensile logic directory not found at $LOGIC"
            exit 1
          fi
          KEEP="${{ env.THEROCK_GPU_TARGETS }}"
          echo "Keeping logic for: $KEEP"
          for d in "$LOGIC"/*/; do
            name=$(basename "$d")
            case ";$KEEP;" in
              *";$name;"*) echo "  keep $name" ;;
              *) rm -rf "$d" ;;
            esac
          done
          ls -1 "$LOGIC"
          du -sh "${{ github.workspace }}/source-rocm-libraries/projects/hipblaslt" || true

      - name: Install zlib and msgpack via cget
        if: steps.cache-dist.outputs.cache-hit != 'true'
        shell: bash
        working-directory: source-rocm-libraries/projects/hipblaslt
        run: |
          set -euo pipefail
          # TensileLite runs during the hipBLASLt build. Installed explicitly
          # rather than from requirements.txt, which also pins cmake<4 and would
          # shadow the runner's toolchain.
          python -m pip install -q cget invoke PyYAML joblib packaging msgpack \
            simplejson ujson orjson yappi numpy
          DEPS="${{ runner.workspace }}/hipblaslt-deps"
          # Versions and flags copied from AMD's build; the static-CRT setting
          # has to match hipBLASLt itself or the link fails.
          cget install madler/zlib@v1.3.1 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DZLIB_BUILD_EXAMPLES=Off \
            --build-type Release --insecure -G Ninja -p "$DEPS"
          cget install msgpack/msgpack-c@cpp-7.0.0 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DMSGPACK_CXX17=ON \
            -DMSGPACK_BUILD_TESTS=Off -DMSGPACK_BUILD_DOCS=OFF -DMSGPACK_USE_BOOST=OFF \
            -DBUILD_SHARED_LIBS=OFF --build-type Release --insecure -G Ninja -p "$DEPS"

      - name: Build hipBLAS-Common and hipBLASLt
        if: steps.cache-dist.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          DEPS="${{ runner.workspace }}/hipblaslt-deps"
          SRC="${{ github.workspace }}/source-rocm-libraries"
          # AMD's dist ships clang.exe but no clang++.exe; when self-building we
          # have the full LLVM install, which does provide clang++.
          CXX="$PREFIX/bin/clang++.exe"
          [ -f "$CXX" ] || CXX="$PREFIX/bin/clang.exe"

          cmake -S "$SRC/projects/hipblas-common" -B "${{ runner.workspace }}/build-hipblas-common" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$DEPS" \
            -DROCM_PATH="$PREFIX"
          cmake --build "${{ runner.workspace }}/build-hipblas-common" --target install

          LOGIC_ARGS=()
          if [ -n "${{ env.HIPBLASLT_LOGIC_FILTER }}" ]; then
            LOGIC_ARGS+=("-DTENSILELITE_LOGIC_FILTER=${{ env.HIPBLASLT_LOGIC_FILTER }}")
          fi
          # BLIS and OpenMP default to ON and are REQUIRED once enabled. AMD's
          # build has both; this one has neither (the LLVM stage does not build
          # an OpenMP runtime). Both only serve host-side paths -- BLIS is the
          # CPU reference used by the clients that are already disabled here.
          cmake -S "$SRC/projects/hipblaslt" -B "${{ runner.workspace }}/build-hipblaslt" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$DEPS" \
            -DCMAKE_C_COMPILER="$PREFIX/bin/clang.exe" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DROCM_PATH="$PREFIX" \
            -DHIP_PATH="$PREFIX" \
            -DGPU_TARGETS="${{ env.THEROCK_GPU_TARGETS }}" \
            -DTENSILELITE_BUILD_TESTING=OFF \
            -DHIPBLASLT_BUILD_TESTING=OFF \
            -DHIPBLASLT_ENABLE_CLIENT=OFF \
            -DHIPBLASLT_ENABLE_BLIS=OFF \
            -DHIPBLASLT_ENABLE_OPENMP=OFF \
            "${LOGIC_ARGS[@]}"
          cmake --build "${{ runner.workspace }}/build-hipblaslt" --target install

      - name: Verify the assembled SDK
        if: steps.cache-dist.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ runner.workspace }}/therock-prefix"
          # Everything windows-build-real.yml copies out of the SDK when it
          # stages the GPU test package, plus what hip-ep's find_package calls
          # need. hip-ep only looks for hip, hipblaslt and LLVM -- MIOpen,
          # rocBLAS and composable_kernel ship in AMD's dist but go unused.
          FAIL=0
          for f in bin/clang.exe bin/lld.exe bin/hipcc.bat bin/clang-offload-bundler.exe \
                   bin/hipblaslt.dll amdgcn/bitcode \
                   lib/cmake/hip/hip-config.cmake \
                   lib/cmake/hip-lang/hip-lang-config.cmake \
                   lib/cmake/hipblaslt lib/cmake/AMDDeviceLibs lib/cmake/amd_comgr; do
            [ -e "$PREFIX/$f" ] || { echo "MISSING: $f"; FAIL=1; }
          done
          ls "$PREFIX"/bin/amdhip64*.dll >/dev/null 2>&1 || { echo "MISSING: bin/amdhip64*.dll"; FAIL=1; }
          ls "$PREFIX"/bin/amd_comgr*.dll >/dev/null 2>&1 || { echo "MISSING: bin/amd_comgr*.dll"; FAIL=1; }
          ls "$PREFIX"/bin/hiprtc*.dll >/dev/null 2>&1 || { echo "MISSING: bin/hiprtc*.dll"; FAIL=1; }
          for arch in $(echo "${{ env.THEROCK_GPU_TARGETS }}" | tr ';' ' '); do
            d="$PREFIX/bin/hipblaslt/library/$arch"
            if [ -d "$d" ]; then
              echo "hipblaslt library/$arch: $(ls -1 "$d" | wc -l) files, $(du -sh "$d" | cut -f1)"
            else
              echo "MISSING: bin/hipblaslt/library/$arch"; FAIL=1
            fi
          done
          du -sh "$PREFIX"
          [ "$FAIL" -eq 0 ] || { echo "SDK is incomplete -- see MISSING lines above"; exit 1; }

      - name: Save therock-dist
        if: steps.cache-dist.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/therock-prefix
          key: ${{ steps.key.outputs.value }}
