name: Windows Deps

# Prebuilds the two heavy from-source dependencies into cached install prefixes
# and returns their cache keys. Callers restore those prefixes with
# fail-on-cache-miss, so a green run here is what guarantees the caches exist.
on:
  workflow_call:
    outputs:
      llvm_cache_key:
        description: Cache key holding the LLVM/MLIR/LLD install prefix.
        value: ${{ jobs.llvm.outputs.cache_key }}
      ort_cache_key:
        description: Cache key holding the ONNX Runtime install prefix.
        value: ${{ jobs.ort.outputs.cache_key }}
      amdgpu_cache_key:
        description: Cache key holding the amdgpu-ep build artifacts.
        value: ${{ jobs.amdgpu.outputs.cache_key }}
      oga_cache_key:
        description: Cache key holding the OGA artifact set.
        value: ${{ jobs.oga.outputs.cache_key }}

permissions:
  contents: read

env:
  LLVM_TAG: llvmorg-22.1.0
  ONNXRUNTIME_VERSION: "1.27.0"
  ONNXRUNTIME_PR_PATCHES: ""
  OGA_VERSION: "0.14.0"
  OGA_PR_PATCHES: "2194"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  AMDGPU_EP_REF: "05eaa2a938f71e98b49bd1be3fb03720167be5cc"
  # Space-separated onnxruntime/onnxruntime-ep-amdgpu PR numbers applied on top
  # of AMDGPU_EP_REF. 105: forward unknown / Hip-owned provider options through
  # the AMDGPU umbrella into the Hip backend under the shared ep.<amdgpu>.* prefix.
  AMDGPU_PR_PATCHES: "105"

jobs:
  llvm:
    runs-on: windows-2022
    concurrency:
      group: deps-llvm-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=dep-llvm-${{ env.LLVM_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Probe llvm-install
        id: cache-llvm
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup Python 3.14
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-llvm-

      - name: Setup sccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build LLVM/MLIR/LLD from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SRC="${{ runner.workspace }}/llvm-project"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/llvm/llvm-project.git
          git -C "$SRC" fetch --depth 1 origin "${{ env.LLVM_TAG }}"
          git -C "$SRC" checkout FETCH_HEAD
          cmake -G Ninja -S "$SRC/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="${{ runner.workspace }}/llvm-install" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install

      - name: Save llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-${{ env.SCCACHE_KEY_DATE }}

  ort:
    runs-on: windows-2022
    concurrency:
      group: deps-ort-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=dep-ort-${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe ort-install
        id: cache-ort
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup Python 3.14
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Checkout ONNX Runtime v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Microsoft/onnxruntime
          ref: v${{ env.ONNXRUNTIME_VERSION }}
          path: source-onnxruntime
          submodules: true
          fetch-depth: 1
          show-progress: false

      - name: Apply ONNX Runtime PR patches
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-onnxruntime
        env:
          ORT_PRS: ${{ env.ONNXRUNTIME_PR_PATCHES }}
        run: |
          $prs = $env:ORT_PRS.Trim()
          if (-not $prs) {
            Write-Host "ONNXRUNTIME_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "ort-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Build ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "${{ github.workspace }}\source-onnxruntime"
          call build.bat ^
            --config Release ^
            --build_shared_lib ^
            --parallel ^
            --compile_no_warning_as_error ^
            --skip_submodule_sync ^
            --build_dir "${{ runner.workspace }}\build-onnxruntime" ^
            --skip_tests ^
            --disable_memleak_checker ^
            --use_dml ^
            --cmake_generator Ninja ^
            --build_wheel

      - name: Install ORT into ort-install
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --install "${{ runner.workspace }}/build-onnxruntime/Release" \
            --prefix "${{ runner.workspace }}/ort-install"
          # perf_test is not a cmake install target; copy manually so it lands
          # in ort-install (cached) rather than the ephemeral build directory.
          PERF_TEST=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in build tree"
            exit 1
          fi
          cp "$PERF_TEST" "${{ runner.workspace }}/ort-install/bin/"
          # DirectML.dll is not installed by cmake --install; copy manually.
          DML_DLL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -path "*/x64-win/DirectML.dll" -type f | head -1)
          if [ -z "$DML_DLL" ]; then
            echo "ERROR: DirectML.dll not found in build tree"
            exit 1
          fi
          cp "$DML_DLL" "${{ runner.workspace }}/ort-install/bin/"
          # Cache the cp314 ORT Python wheel inside ort-install so it
          # rides the same cache key as the rest of the ORT artifacts.
          # Output path: build-onnxruntime/Release/dist/onnxruntime_directml-1.27.0-cp314-cp314-win_amd64.whl
          ORT_WHEEL=$(find "${{ runner.workspace }}/build-onnxruntime" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ]; then
            echo "ERROR: onnxruntime_directml wheel not found in build tree"
            exit 1
          fi
          mkdir -p "${{ runner.workspace }}/ort-install/wheels"
          cp "$ORT_WHEEL" "${{ runner.workspace }}/ort-install/wheels/"
          echo "Cached ORT wheel: $(basename "$ORT_WHEEL")"

      - name: Save ort-install
        if: steps.cache-ort.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.key.outputs.value }}

  amdgpu:
    needs: ort
    runs-on: windows-2022
    concurrency:
      group: deps-amdgpu-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Checkout deps manifest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source-hip-ep
          sparse-checkout: cmake
          fetch-depth: 1
          show-progress: false

      - name: Compute cache key
        id: key
        shell: bash
        working-directory: source-hip-ep
        run: |
          DEPS_HASH=$(git rev-parse --short=12 HEAD:cmake/deps.txt)
          EP_REF="${{ env.AMDGPU_EP_REF }}"
          echo "value=windows-amdgpu-${EP_REF:0:7}-amdpr${{ env.AMDGPU_PR_PATCHES }}-deps${DEPS_HASH}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe amdgpu-artifacts
        id: cache-amdgpu
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/amdgpu-artifacts
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore ort-install
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ needs.ort.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.14
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Prepare sccache local cache
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Cache sccache directory
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-amdgpu-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-amdgpu-

      - name: Setup sccache
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: onnxruntime/onnxruntime-ep-amdgpu
          ref: ${{ env.AMDGPU_EP_REF }}
          path: source-amdgpu
          fetch-depth: 1
          show-progress: false

      - name: Apply amdgpu-ep PR patches
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-amdgpu
        env:
          AMDGPU_PRS: ${{ env.AMDGPU_PR_PATCHES }}
        run: |
          $prs = $env:AMDGPU_PRS.Trim()
          if (-not $prs) {
            Write-Host "AMDGPU_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/onnxruntime/onnxruntime-ep-amdgpu/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "amdgpu-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git apply --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Fetch MIGraphX + TheRock SDKs
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPS="source-hip-ep/cmake/deps.txt"
          TMP=$(cygpath -u "$RUNNER_TEMP")
          WS=$(cygpath -u '${{ runner.workspace }}')
          fetch_dep() {
            local name="$1" dest="$2"
            local line url base
            line=$(grep -E "^${name};" "$DEPS")
            url=$(echo "$line" | cut -d';' -f2)
            base=$(echo "$line" | cut -d';' -f3)
            echo "[$name] $url/$base.tar.gz"
            curl -sSL --fail -o "$TMP/$base.tar.gz" "$url/$base.tar.gz"
            mkdir -p "$dest"
            ( cd "$TMP" && tar -xzf "$base.tar.gz" -C "$dest" --strip-components=1 )
          }
          fetch_dep migraphx_windows "$WS/migraphx-sdk"
          fetch_dep therock_windows "$WS/therock"
          test -f "$WS/migraphx-sdk/lib/cmake/migraphx/migraphx-config.cmake"
          test -f "$WS/migraphx-sdk/problem_cache.json"
          test -f "$WS/therock/lib/cmake/hip/hip-config.cmake"

      - name: Build amdgpu-ep
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The repo needs CMake >= 4.2 and uses 4.x-only syntax; the runner's
          # system cmake is older.
          python -m pip install -q "cmake>=4.2"
          CMAKE="$(python -c "import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake.exe'))")"
          echo "Using $("$CMAKE" --version | head -1)"
          MIGRAPHX_SDK="${{ runner.workspace }}/migraphx-sdk"
          python source-amdgpu/tools/ci_build/build.py \
            --build_dir "${{ runner.workspace }}/build-amdgpu" \
            --config Release \
            --cmake_generator Ninja \
            --cmake_path "$CMAKE" \
            --use_amdgpu \
            --onnxrt_home "${{ runner.workspace }}/ort-install" \
            --migraphx_home "$MIGRAPHX_SDK" \
            --hip_path "${{ runner.workspace }}/therock" \
            --build_wheel \
            --cmake_extra_defines \
              "MIGRAPHX_EP_PROBLEM_CACHE=$MIGRAPHX_SDK/problem_cache.json" \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          INSTALL="${{ runner.workspace }}/amdgpu-install"
          rm -rf "$INSTALL"
          "$CMAKE" --install "${{ runner.workspace }}/build-amdgpu/Release" --prefix "$INSTALL"

          ARTIFACTS="${{ runner.workspace }}/amdgpu-artifacts"
          rm -rf "$ARTIFACTS"
          mkdir -p "$ARTIFACTS/bin"
          WHEEL=$(find "${{ runner.workspace }}/build-amdgpu" -name 'onnxruntime_ep_amdgpu-*.whl' -type f | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: onnxruntime_ep_amdgpu wheel not found in build tree"
            exit 1
          fi
          cp "$WHEEL" "$ARTIFACTS/"
          echo "Cached $(basename "$WHEEL")"

          for f in "$INSTALL"/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              amd_comgr*|amdhip64*|hiprtc*|DirectML.dll) continue ;;
            esac
            cp "$f" "$ARTIFACTS/bin/"
          done
          test -f "$ARTIFACTS/bin/amdgpu-ep.dll"
          test -f "$ARTIFACTS/bin/problem_cache.json"
          echo "Cached $(ls -1 "$ARTIFACTS/bin" | wc -l) files into bin/"

      - name: Save amdgpu-artifacts
        if: steps.cache-amdgpu.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/amdgpu-artifacts
          key: ${{ steps.key.outputs.value }}

  oga:
    needs: ort
    runs-on: windows-2022
    concurrency:
      group: deps-oga-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.value }}

    steps:
      - name: Compute cache key
        id: key
        shell: bash
        run: echo "value=oga-dml-mm2-${{ env.OGA_VERSION }}-pr${{ env.OGA_PR_PATCHES }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}" >> "$GITHUB_OUTPUT"

      - name: Probe oga-artifacts
        id: cache-oga
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Restore ort-install
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ needs.ort.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Setup Python 3.14
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-oga-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-oga-

      - name: Setup sccache
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: microsoft/onnxruntime-genai
          ref: v${{ env.OGA_VERSION }}
          path: source-oga
          submodules: true
          fetch-depth: 1
          show-progress: false

      - name: Apply OGA PR patches
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}\source-oga
        env:
          OGA_PRS: ${{ env.OGA_PR_PATCHES }}
        run: |
          $prs = $env:OGA_PRS.Trim()
          if (-not $prs) {
            Write-Host "OGA_PR_PATCHES is empty; nothing to apply"
            exit 0
          }
          # pull/<n>.patch is a format-patch series; apply with `git am` so that
          # intra-series file renames (morphizen_ep -> amdgpu) replay against the
          # correct intermediate tree. `git apply` flattens the series and chokes
          # on the rename whose pre-image only exists after an earlier commit.
          git config user.email "ci@rocm.amd.com"
          git config user.name "ROCm CI"
          foreach ($pr in $prs -split '\s+') {
            if (-not $pr) { continue }
            $url = "https://github.com/microsoft/onnxruntime-genai/pull/$pr.patch"
            $tmp = Join-Path $env:RUNNER_TEMP "oga-pr-$pr.patch"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            Write-Host "Applying PR #$pr"
            git am --3way --whitespace=nowarn $tmp
            if ($LASTEXITCODE -ne 0) {
              git am --abort
              throw "PR #$pr failed to apply (exit $LASTEXITCODE)"
            }
          }

      - name: Prepare ORT_HOME for OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ORT_HOME="${{ runner.workspace }}/oga-ort-home"
          mkdir -p "$ORT_HOME/include" "$ORT_HOME/lib"
          PREBUILT="${{ runner.workspace }}/ort-install"
          cp -r "$PREBUILT/include/onnxruntime/"* "$ORT_HOME/include/"
          cp "$PREBUILT/lib/"onnxruntime*.lib "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime.dll" "$ORT_HOME/lib/"
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" "$ORT_HOME/lib/"
          echo "ORT_HOME=$ORT_HOME" >> "$GITHUB_ENV"

      - name: Build OGA
        if: steps.cache-oga.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python "${{ github.workspace }}/source-oga/build.py" \
            --config Release \
            --cmake_generator Ninja \
            --use_dml \
            --ort_home "$ORT_HOME" \
            --skip_tests --skip_examples \
            --parallel \
            --build_dir "${{ runner.workspace }}/build-oga" \
            --cmake_extra_defines \
              CMAKE_C_COMPILER_LAUNCHER=sccache \
              CMAKE_CXX_COMPILER_LAUNCHER=sccache

          mkdir -p "${{ runner.workspace }}/oga-artifacts"
          OGA_OUT="${{ runner.workspace }}/build-oga/Release"
          cp "$OGA_OUT/benchmark/c/model_benchmark.exe" "${{ runner.workspace }}/oga-artifacts/"
          cp "$OGA_OUT/onnxruntime-genai.dll" "${{ runner.workspace }}/oga-artifacts/"
          # Cache the cp314 OGA Python wheel alongside the other OGA artifacts.
          # Output path: build-oga/Release/wheel/onnxruntime_genai_directml-0.13.0.dev0-cp314-cp314-win_amd64.whl
          OGA_WHEEL=$(find "${{ runner.workspace }}/build-oga" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: onnxruntime_genai_directml wheel not found in build tree"
            exit 1
          fi
          cp "$OGA_WHEEL" "${{ runner.workspace }}/oga-artifacts/"
          echo "Cached OGA wheel: $(basename "$OGA_WHEEL")"

          # Cache the Python e2e benchmark scripts (benchmark_e2e.py + its metrics
          # helper) so the gpu-test wheel smoke can run them without an OGA source
          # checkout (which only happens on a cache miss).
          mkdir -p "${{ runner.workspace }}/oga-artifacts/benchmark-python"
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_e2e.py" \
             "${{ github.workspace }}/source-oga/benchmark/python/metrics.py" \
             "${{ runner.workspace }}/oga-artifacts/benchmark-python/"

          # build.py --skip_examples leaves examples/c unbuilt. Build only
          # model_mm (the multimodal example used by VL model CI) as a standalone
          # cmake project against the just-built OGA lib + ORT_HOME. build.py's
          # build_examples ignores CXXFLAGS, so set -DCMAKE_CXX_FLAGS=-FS here to
          # force synchronous compiler-PDB writes (parallel model_mm.cpp /
          # common.cpp otherwise clash on vc140.pdb -> C1041).
          cmake -S "${{ github.workspace }}/source-oga/examples/c" \
            -B "${{ runner.workspace }}/build-oga-examples" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODEL_MM=ON -DCMAKE_CXX_FLAGS=-FS \
            -DORT_INCLUDE_DIR="$ORT_HOME/include" \
            -DORT_LIB_DIR="$ORT_HOME/lib" \
            -DOGA_INCLUDE_DIR="${{ github.workspace }}/source-oga/src" \
            -DOGA_LIB_DIR="$OGA_OUT"
          cmake --build "${{ runner.workspace }}/build-oga-examples" --target model_mm
          cp "${{ runner.workspace }}/build-oga-examples/model_mm.exe" \
            "${{ runner.workspace }}/oga-artifacts/"

          # benchmark_multimodal.py drives model_mm for the VL benchmark.
          cp "${{ github.workspace }}/source-oga/benchmark/python/benchmark_multimodal.py" \
            "${{ runner.workspace }}/oga-artifacts/"

      - name: Save oga-artifacts
        if: steps.cache-oga.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.key.outputs.value }}

      - name: Save sccache directory
        if: always() && steps.cache-oga.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-oga-${{ env.SCCACHE_KEY_DATE }}
