name: Windows GPU Test (Strix)

# Runs OGA model_benchmark on the self-hosted Strix box against the
# gpu-test-package artifact of the same run, using public Hugging Face exports
# from docs/models.json, and gates TTFT / TPS against the latest main baseline.

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: Strix
    concurrency:
      group: gpu-test-strix-${{ github.ref }}
      cancel-in-progress: false

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      STRIX_HF_MODELS: "amd/Gemma3-4B-it_gpuep_1.0_gpu_128 amd/Qwen3.5-9B_gpuep_1.0_gpu_128"

    steps:
      - name: Clean workspace
        shell: cmd
        run: |
          taskkill /f /im model_benchmark.exe >nul 2>&1 || ver >nul
          if exist gpu-test-package rd /s /q gpu-test-package
          if exist hf-venv rd /s /q hf-venv
          if exist strix-oga-results rd /s /q strix-oga-results
          if exist main-strix-baseline rd /s /q main-strix-baseline
          if exist strix-perf-results rd /s /q strix-perf-results

      - name: Download GPU test package
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-package
          path: gpu-test-package

      - name: Setup Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Download models from Hugging Face
        shell: pwsh
        env:
          HF_HOME: ${{ runner.workspace }}\hf-home
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $venv = "$PWD\hf-venv"
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --quiet "huggingface_hub>=0.34"
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] huggingface_hub install failed"; exit 1 }
          $modelRoot = "${{ runner.workspace }}\hf-models"
          foreach ($repo in ($env:STRIX_HF_MODELS -split '\s+' | Where-Object { $_ })) {
            $dir = Join-Path $modelRoot $repo.Split('/')[1]
            Write-Host "=== hf download $repo -> $dir ==="
            & "$venv\Scripts\hf.exe" download $repo --local-dir $dir
            if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] download failed: $repo"; exit 1 }
          }

      - name: Run OGA benchmark
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $pkgBin = Join-Path $PWD "gpu-test-package\bin"
          $env:PATH = "$pkgBin;$env:PATH"
          $benchmark = Join-Path $pkgBin "model_benchmark.exe"
          if (-not (Test-Path $benchmark)) { Write-Host "[ERROR] model_benchmark.exe not found"; exit 1 }

          New-Item -ItemType Directory -Force -Path "strix-oga-results" | Out-Null
          $modelRoot = "${{ runner.workspace }}\hf-models"
          $failed = 0
          foreach ($repo in ($env:STRIX_HF_MODELS -split '\s+' | Where-Object { $_ })) {
            $name = $repo.Split('/')[1]
            $outFile = "strix-oga-results\$name.txt"
            Write-Host "=== OGA Benchmark: $name ==="
            & $benchmark -i (Join-Path $modelRoot $name) -l 2048 -g 128 -r 5 -w 1 -b 1 -v 2>&1 |
              Tee-Object -FilePath $outFile
            if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] model_benchmark failed: $name"; $failed = 1 }
          }
          exit $failed

      - name: Download main Strix baseline
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $repo = "${{ github.repository }}"
          $currentRun = "${{ github.run_id }}"
          $baselineDir = "main-strix-baseline"

          function Test-CompleteBaseline($path) {
            $data = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $entries = @($data.PSObject.Properties | ForEach-Object { $_.Value })
            if ($entries.Count -eq 0) {
              return $false
            }
            foreach ($e in $entries) {
              if ($null -eq $e.ttft_ms -or $null -eq $e.tps) {
                return $false
              }
            }
            return $true
          }

          $runsJson = gh run list -R $repo --workflow "Windows Build" --branch main --event push --status success --limit 20 --json databaseId,headSha,url 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $runsJson) {
            Write-Host "WARNING: gh run list failed, no main Strix baseline"
            exit 0
          }
          foreach ($run in @($runsJson | ConvertFrom-Json)) {
            if ("$($run.databaseId)" -eq $currentRun) {
              continue
            }
            $artsJson = gh api "repos/$repo/actions/runs/$($run.databaseId)/artifacts" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $artsJson) {
              continue
            }
            $art = @(($artsJson | ConvertFrom-Json).artifacts) | Where-Object { $_.name -eq "strix-perf-results" -and -not $_.expired } | Select-Object -First 1
            if (-not $art) {
              continue
            }
            New-Item -ItemType Directory -Force -Path $baselineDir | Out-Null
            gh run download $run.databaseId -R $repo -n strix-perf-results -D $baselineDir 2>$null
            if ((Test-Path -LiteralPath "$baselineDir/perf-results.json") -and (Test-CompleteBaseline "$baselineDir/perf-results.json")) {
              $sha7 = $run.headSha.Substring(0, 7)
              Set-Content -LiteralPath "$baselineDir/source.md" -Value "run [$($run.databaseId)]($($run.url)) - ``$sha7``"
              Write-Host "Main Strix baseline: run $($run.databaseId) ($sha7)"
              exit 0
            }
            Remove-Item -LiteralPath $baselineDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "No main Strix baseline found"
          exit 0

      - name: Check TTFT / TPS vs main
        if: always()
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $gate = ($eventName -eq "pull_request") -or ($eventName -eq "merge_group")
          $threshold = 0.20

          $mainPerf = $null
          $mainNote = "unavailable"
          if (Test-Path -LiteralPath "main-strix-baseline/perf-results.json") {
            $mainPerf = Get-Content -LiteralPath "main-strix-baseline/perf-results.json" -Raw | ConvertFrom-Json
            $mainNote = (Get-Content -LiteralPath "main-strix-baseline/source.md" -Raw).Trim()
          }

          function Format-Num($v) {
            if ($null -eq $v) {
              return "-"
            }
            return "{0:F1}" -f [double]$v
          }

          function Format-Delta($cur, $base) {
            if ($null -eq $cur -or $null -eq $base -or [double]$base -eq 0) {
              return "-"
            }
            return "{0:+0.0;-0.0;0.0}%" -f (([double]$cur - [double]$base) / [double]$base * 100)
          }

          $thisPerf = [ordered]@{}
          $rows = ""
          $missing = @()
          $regressions = @()
          foreach ($repo in ($env:STRIX_HF_MODELS -split '\s+' | Where-Object { $_ })) {
            $model = $repo.Split('/')[1]
            $file = "strix-oga-results/$model.txt"
            $content = if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file -Raw } else { "" }
            $ttftMatch = [regex]::Match($content, 'Prompt processing \(time to first token\):\s*\n\s*avg \(us\):\s+([\d.]+)')
            $tpsMatch = [regex]::Match($content, 'Token generation:\s*\n\s*avg \(us\):\s+([\d.]+)\s*\n\s*avg \(tokens/s\):\s+([\d.]+)')
            $memMatch = [regex]::Match($content, 'Peak working set size:\s+(\d+)\s+bytes')
            $ttft = if ($ttftMatch.Success) { [double]$ttftMatch.Groups[1].Value / 1000 } else { $null }
            $tps = if ($tpsMatch.Success) { [double]$tpsMatch.Groups[2].Value } else { $null }
            $mem = if ($memMatch.Success) { "{0:F2}" -f ([double]$memMatch.Groups[1].Value / 1GB) } else { "-" }
            if ($null -eq $ttft -or $null -eq $tps) {
              $missing += $model
            }
            $thisPerf[$model] = [ordered]@{ ttft_ms = $ttft; tps = $tps }

            $base = $null
            if ($null -ne $mainPerf -and $mainPerf.PSObject.Properties[$model]) {
              $base = $mainPerf.PSObject.Properties[$model].Value
            }
            $baseTtft = if ($base) { $base.ttft_ms } else { $null }
            $baseTps = if ($base) { $base.tps } else { $null }
            $ttftDelta = Format-Delta $ttft $baseTtft
            $tpsDelta = Format-Delta $tps $baseTps
            if ($null -ne $ttft -and $null -ne $baseTtft -and $ttft -gt [double]$baseTtft * (1 + $threshold)) {
              $ttftDelta += " FAIL"
              $regressions += "$model TTFT $(Format-Num $ttft) ms vs main $(Format-Num $baseTtft) ms"
            }
            if ($null -ne $tps -and $null -ne $baseTps -and $tps -lt [double]$baseTps * (1 - $threshold)) {
              $tpsDelta += " FAIL"
              $regressions += "$model TPS $(Format-Num $tps) vs main $(Format-Num $baseTps)"
            }
            $rows += "| $model | $(Format-Num $ttft) | $(Format-Num $baseTtft) | $ttftDelta | $(Format-Num $tps) | $(Format-Num $baseTps) | $tpsDelta | $mem |`n"
          }

          New-Item -ItemType Directory -Force -Path "strix-perf-results" | Out-Null
          $thisPerf | ConvertTo-Json -Depth 3 | Set-Content -Path "strix-perf-results/perf-results.json" -Encoding utf8

          $pct = "{0:F0}" -f ($threshold * 100)
          $summary = "## Strix OGA Benchmark (prompt 2048, gen 128)`n`n" +
                     "Baseline: $mainNote | Gate: TTFT +$pct% / TPS -$pct%`n`n" +
                     "| Model | TTFT (ms) | Main | Delta | TPS | Main | Delta | Peak Mem (GB) |`n" +
                     "|-------|----:|----:|----:|----:|----:|----:|----:|`n" +
                     $rows
          if ($null -eq $mainPerf) {
            $summary += "`nPerf gate skipped: no main Strix baseline.`n"
          }
          $summary += "`nRun: [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          $fail = $false
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: TTFT / TPS not found for: $($missing -join ', ')"
            $fail = $true
          }
          if ($regressions.Count -gt 0) {
            $regressions | Write-Host
            if ($gate) {
              Write-Host "ERROR: TTFT / TPS regressed more than $pct% vs main"
              $fail = $true
            }
          }
          if ($fail) {
            exit 1
          }

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-perf-results
          path: strix-perf-results/perf-results.json
          if-no-files-found: ignore
