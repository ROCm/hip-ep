name: Windows Ring Attention Test

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: StrixHalo
    timeout-minutes: 30
    concurrency:
      group: ring-test-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          show-progress: false

      - name: Download runtime dependencies
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-package
          path: ring-package

      - name: Download Ring-enabled libraries
        uses: actions/download-artifact@v4
        with:
          name: ring-test-overlay
          path: ring-overlay

      # Match the CPython ABI used to build the packaged ORT wheel.
      - name: Setup Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install Ring overlay and numeric test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item ring-overlay/bin/*.dll ring-package/bin/ -Force
          Copy-Item ring-overlay/lib/*.lib ring-package/lib/ -Force
          python -m venv ring-test-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$PWD/ring-test-venv/Scripts/python.exe"
          $ort = @(Get-ChildItem ring-package/wheels/onnxruntime_directml-*.whl)
          if ($ort.Count -ne 1) { throw 'Expected exactly one packaged ORT wheel' }
          & $py -m pip install $ort[0].FullName numpy onnx pytest ml_dtypes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Ring dispatch and ONNX correctness
        shell: pwsh
        run: |
          & ring-test-venv/Scripts/python.exe test/numeric/run_ring_ci.py --package ring-package --output ring-results
          exit $LASTEXITCODE

      - name: Upload Ring test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-test-results
          path: ring-results/
          if-no-files-found: warn
          retention-days: 3
