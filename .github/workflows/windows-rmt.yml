name: Windows RMT Build

# Optional rocMLIR package. This workflow is separate from Windows Build so it
# is not part of that required check. Jobs use continue-on-error: a rocMLIR
# failure leaves the pull request mergeable, and a success uploads
# gpu-test-package-rmt. Do not add this workflow to the required status checks.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/**", "gpuep/releases/**"]

permissions:
  contents: read

jobs:
  prebuild:
    continue-on-error: true
    uses: ./.github/workflows/windows-deps.yml

  llvm_amdgpu:
    continue-on-error: true
    runs-on: windows-2022
    concurrency:
      group: deps-llvm-amdgpu-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      SCCACHE_CACHE_SIZE: "200M"

    steps:
      - name: Checkout deps manifest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source-hip-ep
          sparse-checkout: cmake
          fetch-depth: 1
          show-progress: false

      - name: Compute cache key
        id: key
        shell: bash
        working-directory: source-hip-ep
        run: |
          set -euo pipefail
          LINE=$(grep -E '^rocmlirtriton;' cmake/deps.txt)
          RT_URL=$(echo "$LINE" | cut -d';' -f2)
          RT_COMMIT=$(echo "$LINE" | cut -d';' -f3)
          echo "url=$RT_URL" >> "$GITHUB_OUTPUT"
          echo "commit=$RT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "cache_key=dep-llvm-rocmlirtriton-amdgpu-${RT_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Probe llvm-install
        id: cache-llvm
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.cache_key }}
          lookup-only: true

      - name: Setup Python 3.14
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Setup MSVC environment
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-amdgpu-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-deps-llvm-amdgpu-

      - name: Setup sccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build LLVM/MLIR/LLD with AMDGPU
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # rocMLIR links the AMDGPU backend. The required Windows LLVM prefix
          # is X86-only, so this job keeps a separate install.
          SRC="${{ runner.workspace }}/rocmlirTriton"
          git init "$SRC"
          git -C "$SRC" remote add origin "${{ steps.key.outputs.url }}"
          git -C "$SRC" fetch --depth 1 origin "${{ steps.key.outputs.commit }}"
          git -C "$SRC" checkout FETCH_HEAD
          cmake -G Ninja -S "$SRC/external/llvm-project/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86;AMDGPU" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="${{ runner.workspace }}/llvm-install" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install

      - name: Save llvm-install
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.key.outputs.cache_key }}

      - name: Save sccache directory
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-deps-llvm-amdgpu-${{ env.SCCACHE_KEY_DATE }}

  build_rmt:
    needs: [prebuild, llvm_amdgpu]
    if: needs.prebuild.result == 'success' && needs.llvm_amdgpu.result == 'success'
    continue-on-error: true
    uses: ./.github/workflows/windows-build-real.yml
    with:
      llvm_cache_key: ${{ needs.llvm_amdgpu.outputs.cache_key }}
      ort_cache_key: ${{ needs.prebuild.outputs.ort_cache_key }}
      amdgpu_cache_key: ${{ needs.prebuild.outputs.amdgpu_cache_key }}
      oga_cache_key: ${{ needs.prebuild.outputs.oga_cache_key }}
      rocmlir: "ON"
      package_name: gpu-test-package-rmt
      dll_sizes_name: dll-sizes-rmt
      wheel_name: hip-python-package-rmt
      concurrency_group: build-windows-rmt
