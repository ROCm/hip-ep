name: Windows RMT Build

# Optional rocMLIR package. Kept as its own workflow so its long LLVM and
# hip-ep build does not keep the Windows Build run in progress. This workflow
# runs the same deps prebuild first. A documentation or Jekyll diff on a
# pull request skips that prebuild. Pushes always build it. The deps jobs
# share per-commit concurrency groups with Windows Build and do not cancel
# an in-progress deps job, so a cold cache is built once per commit and
# this build restores it afterwards.
# LLVM, ORT, amdgpu and OGA fall back to the artifacts this run's prebuild
# uploaded.
# Not part of the merge queue.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/**", "gpuep/releases/**"]

permissions:
  contents: read

jobs:
  build_required:
    uses: ./.github/workflows/build-required.yml

  prebuild:
    needs: build_required
    if: needs.build_required.outputs.run == 'true'
    uses: ./.github/workflows/windows-deps.yml
    with:
      llvm_extra_targets: AMDGPU

  # Job-level continue-on-error keeps the run green but still marks this
  # check failed on the PR. Each step therefore continues on error and is
  # skipped once an earlier step with an id has failed; the final step turns
  # a failure into a warning. Steps whose failure is harmless have no id.
  build:
    needs: prebuild
    runs-on: windows-2022
    continue-on-error: true
    concurrency:
      group: windows-rmt-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      HIP_ARCHITECTURES: "gfx11-generic;gfx1170"
      SCCACHE_CACHE_SIZE: "200M"
      ONNXRUNTIME_VERSION: "1.31.0"
      ONNXRUNTIME_PR_PATCHES: ""
      OGA_VERSION: "0.19.0"
      OGA_PR_PATCHES: "2875"
      AMDGPU_EP_REF: "f3dccce2a142567da050da1032617fb39db4086a"
      AMDGPU_PR_PATCHES: ""

    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          show-progress: false

      - name: Resolve dependency cache keys
        id: deps
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DEPS_HASH=$(git rev-parse --short=12 HEAD:cmake/deps.txt)
          EP_REF="${{ env.AMDGPU_EP_REF }}"
          AMDPR_KEY="${{ env.AMDGPU_PR_PATCHES }}"
          AMDPR_KEY="${AMDPR_KEY// /-}"
          # Keys from this run's prebuild. Recompute only if an output is empty.
          LLVM_KEY="${{ needs.prebuild.outputs.llvm_cache_key }}"
          ORT_KEY="${{ needs.prebuild.outputs.ort_cache_key }}"
          AMD_KEY="${{ needs.prebuild.outputs.amdgpu_cache_key }}"
          OGA_KEY="${{ needs.prebuild.outputs.oga_cache_key }}"
          if [ -z "$LLVM_KEY" ]; then
            LINE=$(grep -E '^llvm_project;' cmake/deps.txt)
            LLVM_URL=$(echo "$LINE" | cut -d';' -f2)
            LLVM_REF=$(echo "$LINE" | cut -d';' -f3)
            LLVM_COMMIT=$(git ls-remote "$LLVM_URL" "refs/heads/$LLVM_REF" | awk '{print $1}')
            if [ -z "$LLVM_COMMIT" ]; then
              echo "ERROR: no tip for $LLVM_URL refs/heads/$LLVM_REF" >&2
              exit 1
            fi
            LLVM_KEY="windows-llvm-AMDGPU-dist-${LLVM_COMMIT}"
          fi
          if [ -z "$ORT_KEY" ]; then
            ORT_KEY="dep-ort-${{ env.ONNXRUNTIME_VERSION }}-ortpr-${{ env.ONNXRUNTIME_PR_PATCHES }}"
          fi
          if [ -z "$AMD_KEY" ]; then
            AMD_KEY="windows-amdgpu-${EP_REF:0:7}-amdpr${AMDPR_KEY}-deps${DEPS_HASH}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}"
          fi
          if [ -z "$OGA_KEY" ]; then
            OGA_KEY="windows-oga-${{ env.OGA_VERSION }}-pr${{ env.OGA_PR_PATCHES }}-ort${{ env.ONNXRUNTIME_VERSION }}-ortpr${{ env.ONNXRUNTIME_PR_PATCHES }}"
          fi
          echo "llvm=$LLVM_KEY" >> "$GITHUB_OUTPUT"
          echo "ort=$ORT_KEY" >> "$GITHUB_OUTPUT"
          echo "amdgpu=$AMD_KEY" >> "$GITHUB_OUTPUT"
          echo "oga=$OGA_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore ort-install
        id: restore-ort
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/ort-install
          key: ${{ steps.deps.outputs.ort }}

      - name: Download ort-install
        id: download-ort
        if: ${{ !contains(steps.*.outcome, 'failure') && steps.restore-ort.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.deps.outputs.ort }}
          path: ${{ runner.workspace }}/ort-install

      # Caches are the fast path. The prebuild always uploads this run's copy,
      # so download-artifact still works after a later cache eviction.
      - name: Restore amdgpu-artifacts
        id: restore-amdgpu
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/amdgpu-artifacts
          key: ${{ steps.deps.outputs.amdgpu }}

      - name: Download amdgpu-artifacts
        id: download-amdgpu
        if: ${{ !contains(steps.*.outcome, 'failure') && steps.restore-amdgpu.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.deps.outputs.amdgpu }}
          path: ${{ runner.workspace }}/amdgpu-artifacts

      - name: Restore oga-artifacts
        id: restore-oga
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/oga-artifacts
          key: ${{ steps.deps.outputs.oga }}

      - name: Download oga-artifacts
        id: download-oga
        if: ${{ !contains(steps.*.outcome, 'failure') && steps.restore-oga.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.deps.outputs.oga }}
          path: ${{ runner.workspace }}/oga-artifacts

      - name: Restore llvm-install
        id: restore-llvm
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/llvm-install
          key: ${{ steps.deps.outputs.llvm }}

      - name: Download llvm-install
        id: download-llvm
        if: ${{ !contains(steps.*.outcome, 'failure') && steps.restore-llvm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.deps.outputs.llvm }}
          path: ${{ runner.workspace }}/llvm-install

      - name: Setup Python 3.14
        id: setup-python
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Install pip dependencies
        id: pip
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: pip install lit requests

      # Put cl.exe and ninja.exe (bundled with VS) into PATH
      - name: Setup MSVC environment
        id: msvc
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Prepare sccache local cache
        id: sccache-env
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache directory
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-rmt-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: |
            sccache-windows-rmt-

      - name: Setup sccache
        id: sccache
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build hip-ep
        id: build
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          python build.py \
            --config Release \
            --cmake_generator Ninja \
            --hip_arch "${{ env.HIP_ARCHITECTURES }}" \
            --cmake_prefix_path "${{ runner.workspace }}/ort-install;${{ runner.workspace }}/llvm-install" \
            --cmake_extra_defines CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            --cmake_extra_defines ENABLE_ROCMLIRTRITON=ON

      # -----------------------------------------------------------------------
      # Stage GPU test package:
      #   staging/bin/    – executables + DLLs needed at runtime on the GPU box
      #   staging/models/ – ONNX test model
      #   staging/morphizen_config.json
      # -----------------------------------------------------------------------
      - name: Stage GPU test package
        id: stage
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p staging/bin staging/lib

          # onnxruntime_perf_test.exe + onnxruntime.dll – from ort-install
          PREBUILT="${{ runner.workspace }}/ort-install"
          PERF_TEST=$(find "$PREBUILT" -name "onnxruntime_perf_test.exe" -type f | head -1)
          if [ -z "$PERF_TEST" ]; then
            echo "ERROR: onnxruntime_perf_test.exe not found in $PREBUILT"
            exit 1
          fi
          cp "$PERF_TEST" staging/bin/

          # ORT DLLs + DirectML.dll – from the install prefix
          cp "$PREBUILT/bin/onnxruntime.dll" staging/bin/
          cp "$PREBUILT/bin/onnxruntime_providers_shared.dll" staging/bin/
          cp "$PREBUILT/bin/DirectML.dll" staging/bin/

          # MorphiZen EP DLL + per-arch custom_kernels_gfx<arch>.dll + other
          # install DLLs/EXEs (kernel DLL must sit next to the EP DLL so
          # LlvmIrJit's GetModuleFileName-anchored Load finds it).
          cp "${{ runner.workspace }}/install/bin/"*.dll staging/bin/ 2>/dev/null || true
          cp "${{ runner.workspace }}/install/bin/"*.exe staging/bin/ 2>/dev/null || true

          cp "${{ runner.workspace }}/amdgpu-artifacts/bin/"* staging/bin/

          # Smoke: every per-arch kernel DLL must be present in staging/bin/
          # (LlvmIrJit dlopens custom_kernels_<gcnArchName>.dll at runtime).
          # Failure here means the install rule in lib/Runtime/Kernels/CMakeLists.txt
          # regressed or HIP_ARCHITECTURES was trimmed.
          IFS=';' read -ra HIP_ARCHS <<< "${{ env.HIP_ARCHITECTURES }}"
          for arch in "${HIP_ARCHS[@]}"; do
            KERNEL_DLL="staging/bin/custom_kernels_${arch}.dll"
            if [ ! -f "$KERNEL_DLL" ]; then
              echo "ERROR: $KERNEL_DLL missing from install (HIP_ARCHITECTURES=${{ env.HIP_ARCHITECTURES }})"
              ls -1 "${{ runner.workspace }}/install/bin/" || true
              exit 1
            fi
            echo "OK: $(basename "$KERNEL_DLL") present"
          done

          # Standalone kernel unit tests (BUILD_HIP_KERNEL_UNIT_TESTS, on by default).
          # hipdnn-kernel-ut.exe already came with install/bin/*.exe; its leaves
          # live in install/bin/kernel-tests/<arch>/. Staged so a GPU job can run
          # the controller from bin/; this workflow does not run them.
          if [ ! -f staging/bin/hipdnn-kernel-ut.exe ]; then
            echo "ERROR: hipdnn-kernel-ut.exe missing from install/bin/"
            exit 1
          fi
          cp -a "${{ runner.workspace }}/install/bin/kernel-tests" staging/bin/
          for arch in "${HIP_ARCHS[@]}"; do
            n=$(ls staging/bin/kernel-tests/"$arch"/hipdnn-kernel-ut-*.exe 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "ERROR: no kernel unit-test executables in kernel-tests/$arch/"
              exit 1
            fi
            echo "OK: kernel-tests/$arch has $n kernel unit-test executables"
          done

          # Import libraries that get bundled into the MorphiZen JIT-linker
          # path. Kept as a glob so the set evolves with the install rules
          # without touching this workflow each time.
          cp "${{ runner.workspace }}/install/lib/"*.lib staging/lib/ 2>/dev/null || true

          THEROCK_DIR="../build/$(basename "$PWD")/_therock"
          for pat in amdhip64_7.dll 'amd_comgr*.dll' \
                     hipblaslt.dll libhipblaslt.dll tensilelite-host.dll 'hiprtc*.dll'; do
            cp $THEROCK_DIR/bin/$pat staging/bin/ 2>/dev/null || true
          done
          cp -r "$THEROCK_DIR/bin/hipblaslt" staging/bin/ 2>/dev/null || true
          for pat in 'amdhip64*.lib' hipblaslt.lib libhipblaslt.dll.a; do
            cp $THEROCK_DIR/lib/$pat staging/lib/ 2>/dev/null || true
          done

          # MorphiZen EP config
          cp etc/morphizen_config.json staging/

          # ---------------------------------------------------------------
          # Package MSVC/WinSDK release CRT import libraries for lld-link.
          # The MorphiZen JIT compiler links against the release CRT (/MD),
          # so the GPU test machine does not need VS Build Tools installed.
          # ilammy/msvc-dev-cmd (already run above) sets VCToolsInstallDir,
          # WindowsSdkDir, and WindowsSDKVersion in the environment.
          # ---------------------------------------------------------------
          MSVC_LIB="$(cygpath -u "$VCToolsInstallDir")/lib/x64"
          UCRT_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/ucrt/x64"
          UM_LIB="$(cygpath -u "$WindowsSdkDir")/Lib/${WindowsSDKVersion}/um/x64"
          echo "MSVC lib: $MSVC_LIB"
          echo "UCRT lib: $UCRT_LIB"
          echo "UM lib:   $UM_LIB"
          for lib in msvcrt.lib ucrt.lib vcruntime.lib oldnames.lib \
                     libcpmt.lib libcmt.lib kernel32.lib user32.lib; do
            src=$(find "$MSVC_LIB" "$UCRT_LIB" "$UM_LIB" \
                    -maxdepth 1 -iname "$lib" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp "$src" staging/lib/
              echo "  Packaged: $lib <- $src"
            else
              echo "  WARNING: $lib not found"
            fi
          done

          # ---------------------------------------------------------------
          # OGA artifacts: model_benchmark.exe + onnxruntime-genai.dll, plus
          # model_mm.exe + benchmark_multimodal.py for the VL model tests.
          # ---------------------------------------------------------------
          cp "${{ runner.workspace }}/oga-artifacts/model_benchmark.exe" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/onnxruntime-genai.dll" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/model_mm.exe" staging/bin/
          cp "${{ runner.workspace }}/oga-artifacts/benchmark_multimodal.py" staging/bin/

          # ---------------------------------------------------------------
          # Python wheels (ORT + OGA cp314) bundled into the artifact under
          # staging/wheels/. Both are cached inside ort-install / oga-artifacts,
          # so cache hits restore them without rebuilding ORT / OGA.
          # ---------------------------------------------------------------
          mkdir -p staging/wheels
          ORT_WHEEL=$(find "${{ runner.workspace }}/ort-install/wheels" \
            -name "onnxruntime_directml-*.whl" -type f | head -1)
          OGA_WHEEL=$(find "${{ runner.workspace }}/oga-artifacts" \
            -name "onnxruntime_genai_directml-*.whl" -type f | head -1)
          if [ -z "$ORT_WHEEL" ] || [ -z "$OGA_WHEEL" ]; then
            echo "ERROR: cp314 wheel(s) missing from cache"
            echo "  ORT: $ORT_WHEEL"
            echo "  OGA: $OGA_WHEEL"
            exit 1
          fi
          cp "$ORT_WHEEL" staging/wheels/
          cp "$OGA_WHEEL" staging/wheels/

          echo "=== Binary sizes ==="
          ls -lh staging/bin/hipgpu.dll staging/bin/custom_kernels*.dll 2>/dev/null || true

          mkdir -p dll-sizes
          python -c 'import glob,json,os; b="staging/bin"; d={}; p=os.path.join(b,"hipgpu.dll"); d.update({"hipgpu.dll": os.path.getsize(p)} if os.path.isfile(p) else {}); d.update({os.path.basename(x): os.path.getsize(x) for x in sorted(glob.glob(os.path.join(b,"custom_kernels*.dll")))}); open("dll-sizes/dll-sizes.json","w",encoding="utf-8",newline="\n").write(json.dumps(d,indent=2)+"\n"); print(open("dll-sizes/dll-sizes.json",encoding="utf-8").read())'

          # Marker consumed by windows-gpu-test.yml. Absent means the native
          # smoke tests skip; present only when this build opted in.
          CACHE="../build/$(basename "$PWD")/CMakeCache.txt"
          if grep -q '^HIPDNN_EP_ENABLE_NATIVE_ARTIFACTS:BOOL=ON$' "$CACHE"; then
            echo "Native artifacts enabled; GPU native smoke tests will run"
            touch staging/native-artifacts.enabled
          else
            echo "Native artifacts disabled; GPU native smoke tests will skip"
          fi

          echo "=== Staged package contents ==="
          find staging/ -type f | sort

      - name: Upload GPU test package
        id: upload
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-package-rmt
          path: staging/
          retention-days: ${{ (github.ref == 'refs/heads/main' || contains(github.ref, 'release')) && 90 || 3 }}

      # Saved from main only; pull requests restore the main entry. A failed
      # build still leaves useful objects, but a skipped one has no directory.
      - name: Save sccache directory
        if: ${{ always() && github.ref_name == 'main' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-windows-rmt-${{ env.SCCACHE_KEY_DATE }}

      - name: Report optional build failure
        if: ${{ contains(steps.*.outcome, 'failure') }}
        shell: bash
        run: echo "::warning title=Windows RMT Build::The optional RMT build failed; see the first failed step above."
