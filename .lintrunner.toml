# Configuration for lintrunner https://github.com/suo/lintrunner
#
# To format local changes:
#
# ```bash
# lintrunner -a
# ```
#
# To format all files:
#
# ```bash
# lintrunner -a --all-files
# ```
#
# To read more about lintrunner, see [wiki](https://github.com/pytorch/pytorch/wiki/lintrunner).
# To update an existing linting rule or create a new one, modify this file or create a
# new adapter following examples in https://github.com/justinchuby/lintrunner-adapters.

merge_base_with = 'origin/main'

[[linter]]
code = 'RUFF'
include_patterns = [
    '**/*.py',
    '**/*.pyi',
]
exclude_patterns = [
    # Hand-written GPU kernels. They are first-party code, but kept
    # formatter-exempt (as they were under 3rd-party/ before the relocation)
    # so the move stays a pure relocation instead of a whole-tree reformat.
    # Drop this entry to bring the kernels under clang-format/ruff once their
    # permanent home is settled.
    'lib/Runtime/Kernels/**',
]
command = [
    'python',
    '-m',
    'lintrunner_adapters',
    'run',
    'ruff_linter',
    '@{{PATHSFILE}}'
]
is_formatter = true


[[linter]]
code = 'RUFF-FORMAT'
include_patterns = [
    '**/*.py',
]
exclude_patterns = [
    # First-party GPU kernels, kept formatter-exempt; see the RUFF block above.
    'lib/Runtime/Kernels/**',
]
command = [
    'python',
    '-m',
    'lintrunner_adapters',
    'run',
    'ruff_format_linter',
    '--',
    '@{{PATHSFILE}}'
]
is_formatter = true

[[linter]]
code = 'CLANGFORMAT'
include_patterns = [
    '**/*.h',
    '**/*.cc',
    '**/*.hpp',
    '**/*.cpp',
]
exclude_patterns = [
    # First-party GPU kernels, kept formatter-exempt; see the RUFF block above.
    'lib/Runtime/Kernels/**',
]
command = [
    'python',
    '-m',
    'lintrunner_adapters',
    'run',
    'clangformat_linter',
    '--binary=clang-format',
    '--fallback',
    '--',
    '@{{PATHSFILE}}'
]
is_formatter = true
