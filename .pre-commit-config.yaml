# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Files under `patches/**/*.patch` are auto-generated `git format-patch`
# outputs that we apply verbatim onto third-party source trees in CI (see
# patches/onnxruntime/README.md). Reformatting them -- stripping trailing
# whitespace from empty-context diff lines, stripping the BOM that some
# `git format-patch` shells emit on Windows, or fixing the final-newline
# convention -- breaks `git apply`. Exclude this directory from the
# whitespace / EOF / BOM hooks so the patches stay byte-exact.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^patches/.*\.patch$
    -   id: end-of-file-fixer
        exclude: ^patches/.*\.patch$
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: fix-byte-order-marker
        exclude: ^patches/.*\.patch$
    -   id: mixed-line-ending
        exclude: ^patches/.*\.patch$
    -   id: check-merge-conflict
-   repo: local
    hooks:
    -   id: lintrunner
        name: lintrunner
        entry: lintrunner
        language: python
        additional_dependencies:
          - lintrunner==0.12.7
          - lintrunner-adapters==0.12.4
          - ruff==0.11.9
          - clang-format==16.0.1
        types: [file]
        args: [--apply-patches]
        require_serial: true
    -   id: licenseheaders
        name: licenseheaders
        entry: python -m licenseheaders
        args: [-t,./LICENSES/license.txt,-x,3rd-party/*,-s,./LICENSES/settings.json,-f]
        language: python
        additional_dependencies: [licenseheaders==0.8.8]
        types: [file]
