# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
    -   id: check-merge-conflict
-   repo: local
    hooks:
    -   id: lintrunner
        name: lintrunner
        entry: lintrunner
        language: python
        additional_dependencies:
          - lintrunner==0.12.7
          - lintrunner-adapters==0.12.4
          - ruff==0.11.9
          - clang-format==16.0.1
        types: [file]
        args: [--apply-patches]
        require_serial: true
    -   id: licenseheaders
        name: licenseheaders
        entry: python -m licenseheaders
        # -x excludes paths from license-header insertion. lib/Runtime/Kernels/*
        # (the hand-written GPU kernels) keeps its existing headers untouched, as
        # it did under 3rd-party/ before the relocation; pair with the matching
        # formatter exemptions in .lintrunner.toml.
        args: [-t,./LICENSES/license.txt,-x,3rd-party/*,lib/Runtime/Kernels/*,-s,./LICENSES/settings.json,-f]
        language: python
        additional_dependencies: [licenseheaders==0.8.8]
        types: [file]
