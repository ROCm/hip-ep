# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
    -   id: check-merge-conflict
-   repo: local
    hooks:
    -   id: lintrunner
        name: lintrunner
        entry: lintrunner
        language: python
        additional_dependencies:
          - lintrunner==0.12.7
          - lintrunner-adapters==0.12.4
          - ruff==0.11.9
          - clang-format==16.0.1
        types: [file]
        args: [--apply-patches]
        require_serial: true
    -   id: licenseheaders
        name: licenseheaders
        entry: python -m licenseheaders
        # -x excludes paths from license-header insertion. morphizen/* (the
        # vendored subtree) keeps its own upstream copyright headers, and
        # lib/Runtime/Kernels/* (the hand-written GPU kernels) keeps its existing
        # headers untouched. .claude/agents/* must start with YAML frontmatter for
        # the agent loader to parse them, so a header comment cannot be prepended.
        args: [-t,./LICENSES/license.txt,-x,morphizen/*,lib/Runtime/Kernels/*,.claude/agents/*,-s,./LICENSES/settings.json,-f]
        language: python
        additional_dependencies: [licenseheaders==0.8.8]
        types: [file]
