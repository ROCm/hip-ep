syntax = "proto3";

package mlir_metadata;

// Minimal metadata for MLIR compiled artifacts
message Metadata {
  string artifact_filename = 1;
  repeated Output outputs = 2;
  repeated Input inputs = 3;
  // True when the artifact was compiled in output-allocator mode: the DLL's
  // inference_compute takes (state, inputs) only and allocates graph outputs
  // in-graph via the EP's output-allocator callback. The EP reads this to
  // choose its dispatch arity. Travels with the artifact, so a reused
  // EPContext always reports the mode matching its own DLL ABI.
  bool use_output_allocator = 4;
}

// Tracks which input tensor dimension provides a dynamic output dimension's
// runtime value. `resolved` disambiguates the {input_idx=0, dim_idx=0}
// default — a real (input 0, dim 0) source has resolved=true; an
// unresolved dim (or a static dim with no source needed) has resolved=false.
// Consumers MUST treat resolved=false as "do not use input_idx/dim_idx".
message DimSource {
  int32 input_idx = 1;
  int32 dim_idx = 2;
  bool resolved = 3;
}

message Input {
  string name = 1;
  int32 rank = 2;
  int32 elem_type = 3;
  repeated int64 shape = 4;
}

message Output {
  string name = 1;
  int32 rank = 2;
  int32 elem_type = 3;
  repeated int64 shape = 4;
  // One per dimension. For dynamic dims (shape[i] == -1), specifies which
  // input tensor + dimension provides the runtime value.
  repeated DimSource dim_sources = 5;
}
