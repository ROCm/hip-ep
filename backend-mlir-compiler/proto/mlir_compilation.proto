syntax = "proto3";
package mlir_compilation;

// Metadata for MLIR-compiled model artifacts stored in EPContext
// Used to communicate compilation parameters between Level-1 Pass and Custom Op
message MlirCompilationProto {
  // Artifact format: "native" (DLL binary) or "llvm_ir" (LLVM IR text)
  string artifact_format = 1;

  // Compilation timestamp (milliseconds since epoch)
  int64 compilation_timestamp = 2;

  // Compiler version string (for compatibility checks)
  string compiler_version = 3;

  // LLVM optimization level used (0-3)
  int32 optimization_level = 4;

  // Input tensor metadata
  repeated TensorMetadata inputs = 5;

  // Output tensor metadata
  repeated TensorMetadata outputs = 6;

  // Artifact filename in EPContext (e.g., "model_abc123.dll" or "model_abc123.ll")
  string artifact_filename = 7;

  // Artifact size in bytes
  int64 artifact_size = 8;

  // Debug information (only populated if MORPHIZEN_DEBUG_MLIR_BACKEND >= 1)
  DebugInfo debug_info = 9;
}

// Tensor shape and type metadata
message TensorMetadata {
  // Tensor name (matches ONNX graph)
  string name = 1;

  // Tensor rank (number of dimensions)
  int32 rank = 2;

  // Tensor shape (-1 for dynamic dimensions)
  repeated int64 shape = 3;

  // Data type string ("float32", "int64", "int8", etc.)
  string dtype = 4;
}

// Debug information for troubleshooting compilation issues
// Only populated when MORPHIZEN_DEBUG_MLIR_BACKEND >= 1
message DebugInfo {
  // Path to debug LLVM IR file (if written)
  string llvm_ir_path = 1;

  // Path to debug object file (if written)
  string object_file_path = 2;

  // MLIR pass pipeline duration (milliseconds)
  int64 mlir_pass_duration_ms = 3;

  // LLVM compilation duration (milliseconds)
  int64 llvm_compilation_duration_ms = 4;

  // Linking duration (milliseconds, native mode only)
  int64 linking_duration_ms = 5;
}
