name: hipdnn-ep
channels:
  - conda-forge
dependencies:
  # cmake>=3.31 — avoids satisfying constraint with cygwin's stale /usr/bin/cmake
  # 3.14.5 if PATH order is wrong (CMakeLists.txt requires >=3.20).
  - python>=3.10
  - cmake>=3.31
  - ninja
  - sccache
  - gh
  - pip
  - pip:
    - lit
    - lintrunner==0.12.7
    - lintrunner-adapters==0.12.4
    - ruff==0.11.9
    - clang-format==16.0.1
    - pre-commit
    - licenseheaders==0.8.8
    - pytest
    - onnx
    - onnx_ir
    # Bumped from onnxruntime-directml (pinned at 1.24.4 max on pip) to
    # base onnxruntime — needed for the contrib op schemas Qwen 3.5 9B
    # depends on (com.microsoft:CausalConvWithState / LinearAttention).
    # MorphiZenEP provides GPU compute on AMD; DML EP is unused.
    # Must stay in lockstep with build.py::ORT_VERSION (per CLAUDE.md
    # gotcha "ORT version must match pip").
    - onnxruntime==1.26.0
    # PIL/Pillow: image loader used by the Qwen 3.5 OGA multimodal E2E
    # test (test/python/test_qwen3_5_9b.py::TestQwen3_5_9BMultimodal) to
    # synthesize a deterministic RGB test image.
    - Pillow
    # huggingface_hub for gated-repo downloads in test/python (e.g. the AMD
    # gemma3-4b-it ONNX repo that test_gemma3_4b.py pulls). Authenticate once
    # per machine via `hf auth login` (formerly `huggingface-cli login`).
    - huggingface_hub
    # Needed by OGA fork build (wheel packaging, distutils replacement)
    # and for fetching dependency archives during the OGA build.
    - setuptools
    - wheel
    - packaging
    - requests
