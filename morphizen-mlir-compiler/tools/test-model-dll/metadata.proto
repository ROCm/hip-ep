syntax = "proto3";

package morphizen;

message TensorMetadata {
  repeated int64 shape = 1;
}

message ModelMetadata {
  repeated TensorMetadata inputs = 1;
  repeated TensorMetadata outputs = 2;
  string version = 3;
}
