name: build-deps

inputs:
  token:
    description: 'GitHub Personal Access Token for VitisAI/onnxruntime'
    required: true
    type: string

  onnxruntime_branch_name:
    description: 'The branch name of the ort repo'
    required: false
    default: 'morphizen-ci'
    type: string

outputs:
  cache_key:
    description: 'The commit hash of the ort repo'
    value: ort-install-${{ steps.ort-commit.outputs.commit_hash }}-with-deps

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: get Onnxruntime SHA1
      id: ort-commit
      run: |
        $hash = git ls-remote git@gitenterprise.xilinx.com:VitisAI/onnxruntime.git "${{ inputs.onnxruntime_branch_name }}" |
            ForEach-Object { ($_ -split "`t")[0] }
        echo "commit_hash=$hash" >> $env:GITHUB_OUTPUT
      shell: powershell

    - name: Cache installed ONNXRuntime and deps
      id: cache-onnxruntime-and-deps
      uses: actions/cache@v3
      env:
        NODE_TLS_REJECT_UNAUTHORIZED: 0
      with:
        path: ${{ env.VAI_RT_PREFIX }}
        key: ort-install-${{ steps.ort-commit.outputs.commit_hash }}-with-deps


    - name: Checkout VitisAI/onnxruntime
      if: steps.cache-onnxruntime-and-deps.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.token }}
        repository: VitisAI/onnxruntime
        path: onnxruntime
        ref: ${{ inputs.onnxruntime_branch_name }}
        show-progress: false

    - name: Checkout VitisAI/vai-rt
      if: steps.cache-onnxruntime-and-deps.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.token }}
        repository: VitisAI/vai-rt
        path: vai-rt
        ref: cp_dev
        show-progress: false

    - name: build and install onnxrutime and deps
      if: steps.cache-onnxruntime-and-deps.outputs.cache-hit != 'true'
      shell: powershell
      run: |
          echo "build and install onnxrutime and deps.."
          . ${{ github.workspace}}/scripts/build/build_ort_and_deps.ps1

    - name: Get llvm-project repo URL and SHA1
      id: llvm-commit
      run: |
        # Read the deps.txt file and extract the llvm URL and commit hash
        $depsFile = "${{ github.workspace}}/cmake/deps.txt"
        $llvmLine = Select-String '^llvm;' $depsFile | ForEach-Object { $_.Line -split ';' }
        if ($llvmLine.Count -ge 3) {
          # Extract from the line format: llvm;https://github.com/llvm/llvm-project.git;commit_hash
          $url, $hash = $llvmLine[1], $llvmLine[2]
          echo "llvm_repo_url=$url" >> $env:GITHUB_OUTPUT
          echo "llvm_commit_hash=$hash" >> $env:GITHUB_OUTPUT
          echo "Found LLVM repo URL: $url"
          echo "Found LLVM commit hash: $hash"
        } else {
          echo "Error: Could not find LLVM entry in deps.txt"
          exit 1
        }
      shell: powershell

    - name: Checkout llvm-project
      if: steps.cache-onnxruntime-and-deps.outputs.cache-hit != 'true'
      run: |
        git clone ${{ steps.llvm-commit.outputs.llvm_repo_url }} llvm
        git -C llvm checkout ${{ steps.llvm-commit.outputs.llvm_commit_hash }}
      shell: powershell

    - name: build and install llvm
      if: steps.cache-onnxruntime-and-deps.outputs.cache-hit != 'true'
      shell: powershell
      run: |
          echo "build and install llvm.."
          . ${{ github.workspace}}/scripts/build/build_llvm.ps1
