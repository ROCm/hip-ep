---
name: Update copyrights headers and disclaimers
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      disclaimer_mode:
        description: Add disclaimers ? Use `config` to decide based on the contents
          of the COYRIGHT_EXCLUDES file.
        default: never
        type: choice
        options:
          - never
          - config
          - always

      copyright_excludes_path:
        description: Path to COPYRIGHT_EXCLUDES file to use.
        type: string
        default: .github/copyright_updates/COPYRIGHT_EXCLUDES

      languages_path:
        description: Path to languages definition file to use.
        type: string
        default: .github/copyright_updates/languages_config.yml

      check_prohibited_source:
        description: Check for prohibited sources in COYRIGHT_EXCLUDES file?
        default: yes
        type: choice
        options:
        - no
        - yes

  schedule:
    - cron: 0 20 * * 6   # Every Saturday at 20:00

jobs:
  update_copyright:
    name: Update copyright headers and disclaimers
    runs-on: [Ubuntu-22.04]
    strategy:
      fail-fast: false
      matrix:
        target_branch: [main]  # To be updated on release branching
    permissions: write-all
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.target_branch }}

      - name: Run action
        uses: ACAS-DevOps/actions/composite_actions/update_copyright_headers@main
        with:
          pr_target_branch: ${{ matrix.target_branch }}
          pr_reviewers: '["qiuyuny"]'
          token: ${{ secrets.Z1AIEBUILD_GHE_PAT }}
          copyright_excludes_path: |
            ${{ inputs.copyright_excludes_path || '.github/copyright_updates/COPYRIGHT_EXCLUDES' }}
          languages_path: |
            ${{ inputs.languages_path || '.github/copyright_updates/languages_config.yml' }}
          disclaimer_mode: ${{ inputs.disclaimer_mode || 'never' }}
          check_prohibited_source: ${{ inputs.check_prohibited_source || 'yes' }}
          do_whitespace_surround: 'False'
          comment_padding: 1
