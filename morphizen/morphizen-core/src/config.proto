syntax = "proto3";
package morphizen;
import "version.proto";
import "google/protobuf/struct.proto";

message ConfigProto {
  // Library of all available passes.
  // At runtime, target selection (TargetProto.pass) determines which passes to execute.
  // This field is immutable after initialization - never use add_passes() at runtime.
  repeated PassProto passes = 1;
  reserved 2;
  reserved "cache_dir";
  reserved 3;  // cache_key moved to ContextProto (Issue #005)
  reserved "cache_key";
  reserved 4;  // version moved to ContextProto (Issue #015)
  reserved "version";
  reserved 6;  // encryption_key removed - read from provider_options (Issue #004)
  reserved "encryption_key";
  map<string, string> provider_options = 8;
  repeated TargetProto targets = 11; // if this is empty, run all passes
  string target = 12; // default proto, comma seperated
  reserved 13;
  reserved "session_configs";
}

message TargetProto {
  string name = 1;
  repeated string pass = 2; // which passes are used
  map<string, string> provider_options = 9; // default value for provider_options
}

message PassProto {
  string name = 1;
  string plugin = 2;
  repeated string args = 3;
  bool enable_log = 4;
  int32 log_verbosity = 5;
  bool enable_gc = 6;
  bool disabled = 7;
  oneof pass_specific_param {
    google.protobuf.Struct pass_generic_param = 110; // generic pass for any parameters
  }
}
