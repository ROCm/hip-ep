syntax = "proto3";
package hipdnn;

message TensorShape {
  repeated int64 dims = 1;
}

// Conv operation attributes
message ConvAttributes {
  repeated int64 pads = 1;
  repeated int64 strides = 2;
  repeated int64 dilations = 3;
  int64 group = 4;
  bool has_bias = 5;
}

// Future: Add more operation attributes here
// message GemmAttributes { ... }
// message MatMulAttributes { ... }

message HipdnnParamProto {
  string op_type = 1;
  string version = 2;
  
  // Shapes
  repeated TensorShape input_shapes = 3;
  repeated TensorShape output_shapes = 4;
  
  // Data types (ONNX element types)
  repeated int32 input_data_types = 5;
  repeated int32 output_data_types = 6;
  
  // Operation-specific attributes (extensible via oneof)
  oneof node_attrs {
    ConvAttributes conv_attrs = 7;
    // Future: GemmAttributes gemm_attrs = 8;
    // Future: MatMulAttributes matmul_attrs = 9;
  }
}
