# The latest benchmark snapshot, rendered by site/docs/benchmarks/index.md and
# quoted on the model cards in the landing-page wall at site/index.md.
#
# Every `id` here must exist in site/_data/models.yml, which is where the
# display name and the model's identity live. This file carries numbers only.
#
# Policy for this page (decided for v1): one snapshot only, and generative
# language models only -- the same models that site/_data/models.yml carries.
# No version history, no trend lines, no comparison against other runtimes.
#
# `run_date` is not rendered on the site, but it records when the snapshot was
# collected and must move with the measurements.
#
# Updating this file is the whole job of publishing a new snapshot: replace the
# numbers, set `run_date`, set `release`. No page needs to change.
#
# Values are stored with two decimal places so numeric columns align. Keep a
# row's TTFT, TPS, and prompt-token counts from the same validated snapshot when
# refreshing this file.

snapshot:
  placeholder: false
  release: v0.5.1
  run_date: "2026-09-23"
  gpu: Ryzen AI Max ("Strix Halo", gfx1151)
  os: Windows
  note: >-
    Single machine, runs executed serially. Numbers from a different GPU,
    driver or thermal envelope are not comparable to these.

# Prompt lengths, in tokens, used as the column groups of the LM table. These
# are the NOMINAL lengths -- the name of each case, not what was fed to the
# model. See `prompt_tokens` below.
prompt_lengths: [128, 2048, 16384]

# TTFT is seconds to the first generated token, lower is better.
# TPS is generated tokens per second in steady state, higher is better.
# Both are ordered to match `prompt_lengths`.
#
# `prompt_tokens` is the count of tokens actually fed to the model in each of
# those cases, and it is not the nominal length. Two reasons it differs:
#
#   - Text models land a few tokens short of the target, because the harness
#     truncates on a boundary: 16384 nominal is 15856 to 16328 in practice.
#   - Vision-language models land far OVER it, because the image is tokenised
#     into the same prompt. Qwen3.5-9B's "128" case is 1971 tokens; 1850 of
#     those are the picture. gemma-3-4b-it's is 392. The overhead is a property
#     of the model's vision encoder, so it cannot be inferred from one model
#     and applied to another.
#
# Only the model-card prefill rate uses this, and only because a rate computed
# from the nominal length would be wrong by 15x on a VLM.
#
lm:
  - id: gpt-oss-20b
    ttft: ["0.17", "1.21", "11.27"]
    tps: ["77.62", "77.67", "68.20"]
    prompt_tokens: [125, 1984, 15856]
