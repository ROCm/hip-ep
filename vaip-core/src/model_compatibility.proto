syntax = "proto3";
package morphizen;

message ModelCompatibilityProto {
  VersionProto version = 1;
  optional bool base64_encoding = 2;  // Reserved for future: encode binary data as base64
  map<string, string> backend_compatibility = 3; // key: backend name, value: backend-specific compatibility info (JSON string)
}
message VersionProto {
  int32 major = 1;
  int32 minor = 2;
  int32 patch = 3;
}
